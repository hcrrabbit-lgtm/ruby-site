<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruby 的英語單字遊樂場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf6ec; --ink:#2d3a4a; --muted:#7a7266; --card:#fff;
  --coral:#ef6f5e; --sun:#ffc94a; --mint:#5cbf8f; --sky:#5a9cf0; --lav:#a78bfa;
  --line:#e8dfcf; --ok:#2fa36b; --bad:#e2504a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Fredoka","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;}
body{background-image:radial-gradient(#efe5d2 1px,transparent 1px);background-size:18px 18px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:.5px}
h2{font-size:20px;margin:0 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
button{font-family:inherit;cursor:pointer;border:none}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px}
.btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);
  border-radius:16px;padding:14px;box-shadow:3px 3px 0 var(--ink);font-size:17px;color:var(--ink);margin-bottom:12px;transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none;border:2px solid var(--ink)}
.btn small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.btn .step{margin-left:auto;font-size:12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:20px;padding:2px 8px;white-space:nowrap}
.pill{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}
.primary{background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 18px;font-size:17px;font-weight:600;box-shadow:3px 3px 0 var(--ink)}
.primary:active{transform:translate(3px,3px);box-shadow:none}
.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:#fff;border:2px solid var(--ink);border-radius:12px;width:42px;height:42px;font-size:20px;box-shadow:2px 2px 0 var(--ink)}
.prog{flex:1;height:14px;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.wordlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wl{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px}
.wl svg{width:34px;height:34px;flex:none}
.wl b{font-size:14px;display:block;line-height:1.1}
.stars{color:#d9cfbd;font-size:12px;letter-spacing:1px}
.stars .on{color:#f2a900}
.pic{width:150px;height:150px;margin:0 auto;display:block}
.big{font-size:32px;font-weight:700;text-align:center;margin:6px 0 0}
.ipa{text-align:center;color:var(--muted);font-size:15px}
.zh{text-align:center;font-size:20px;margin:4px 0 8px}
.tip{background:#fff6dc;border:1.5px dashed #d8a700;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.5;margin-top:10px}
.sent{background:#eef6ff;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.5;margin-top:10px}
.sent small{color:var(--muted);display:block;font-size:13px}
.speak{background:var(--sky);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.speak.slow{background:#fff;color:var(--ink)}
.center{text-align:center}
.q{font-size:19px;text-align:center;margin:6px 0 12px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 8px;font-size:17px;box-shadow:2px 2px 0 var(--ink);min-height:58px;color:var(--ink)}
.opt svg{width:84px;height:84px}
.opt.ok{background:#d9f5e6;border-color:var(--ok)}
.opt.bad{background:#fde1df;border-color:var(--bad)}
.opt:disabled{cursor:default}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:12px 0}
.slot{width:30px;height:38px;border-bottom:3px solid var(--ink);font-size:24px;font-weight:600;display:grid;place-items:center}
.slot.sp{border:none;width:14px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:42px;height:46px;background:var(--sun);border:2px solid var(--ink);border-radius:10px;font-size:22px;font-weight:600;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.tile.used{opacity:.2;pointer-events:none}
input.type{width:100%;font-family:inherit;font-size:22px;padding:12px;border:2px solid var(--ink);border-radius:12px;text-align:center;outline:none}
input.type:focus{box-shadow:0 0 0 3px var(--sun)}
.fb{margin-top:14px;border-radius:14px;padding:12px;font-size:16px;line-height:1.5;display:none}
.fb.ok{display:block;background:#d9f5e6;border:2px solid var(--ok)}
.fb.bad{display:block;background:#fde1df;border:2px solid var(--bad)}
.hud{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
.combo{color:var(--coral);font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;perspective:600px;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.flip .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border:2px solid var(--ink);border-radius:12px;backface-visibility:hidden;display:grid;place-items:center;padding:4px}
.mc .f{background:var(--lav);font-size:26px;color:#fff;box-shadow:2px 2px 0 var(--ink)}
.mc .b{background:#fff;transform:rotateY(180deg);font-size:13px;font-weight:600;text-align:center;line-height:1.15;color:var(--ink)}
.mc .b svg{width:90%;height:90%}
.mc.done .b{background:#d9f5e6;border-color:var(--ok)}
.timer{font-size:28px;font-weight:700;text-align:center}
details{font-size:14px;line-height:1.6}
details summary{cursor:pointer;font-weight:600;font-size:15px}
details li{margin-bottom:4px}
.burst{position:fixed;pointer-events:none;font-size:26px;z-index:99;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.08)}}
.note{font-size:13px;color:var(--muted)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ========== 單字資料（2026/11/12 語音對話） ========== */
const S='stroke="#2d3a4a" stroke-width="3" stroke-linejoin="round"';
const PICS={
petri:`<svg viewBox="0 0 100 100"><path d="M10 52v10c0 9 18 16 40 16s40-7 40-16V52" fill="#cbe9ef" ${S}/><ellipse cx="50" cy="52" rx="40" ry="16" fill="#eefafc" ${S}/><circle cx="36" cy="50" r="5" fill="#f7a6b6"/><circle cx="58" cy="57" r="4" fill="#ffc94a"/><circle cx="63" cy="46" r="3.5" fill="#5cbf8f"/><circle cx="46" cy="58" r="3" fill="#5a9cf0"/><circle cx="52" cy="45" r="2.5" fill="#a78bfa"/></svg>`,
fabric:`<svg viewBox="0 0 100 100"><path d="M18 20h64v40L62 80H18z" fill="#ef8f6e" ${S}/><path d="M82 60L62 80V60z" fill="#c9604a" ${S}/><g fill="#fff3e6"><circle cx="30" cy="32" r="4"/><circle cx="50" cy="32" r="4"/><circle cx="70" cy="32" r="4"/><circle cx="40" cy="48" r="4"/><circle cx="60" cy="48" r="4"/><circle cx="30" cy="64" r="4"/><circle cx="50" cy="66" r="4"/></g></svg>`,
felt:`<svg viewBox="0 0 100 100"><rect x="16" y="40" width="46" height="40" rx="3" fill="#5cbf8f" ${S} stroke-dasharray="4 2" transform="rotate(-8 39 60)"/><rect x="38" y="30" width="46" height="40" rx="3" fill="#ffc94a" ${S} stroke-dasharray="4 2" transform="rotate(6 61 50)"/><path d="M52 46c4-7 14-5 14 3 0 7-14 15-14 15s-14-8-14-15c0-8 10-10 14-3z" fill="#ef6f5e" ${S}/></svg>`,
hoop:`<svg viewBox="0 0 100 100"><rect x="44" y="8" width="12" height="12" rx="2" fill="#b9c2cc" ${S}/><circle cx="50" cy="56" r="34" fill="#fff9ee" stroke="#c98b4f" stroke-width="8"/><circle cx="50" cy="56" r="34" fill="none" ${S}/><circle cx="50" cy="56" r="27" fill="none" stroke="#2d3a4a" stroke-width="1.5"/><g stroke="#ef6f5e" stroke-width="3" stroke-linecap="round"><path d="M42 48l6 6M48 48l-6 6M52 48l6 6M58 48l-6 6M47 58l6 6M53 58l-6 6"/></g><path d="M64 66l12 12" stroke="#2d3a4a" stroke-width="2"/></svg>`,
medal:`<svg viewBox="0 0 100 100"><polygon points="28,6 46,6 58,40 44,44" fill="#5a9cf0" ${S}/><polygon points="72,6 54,6 42,40 56,44" fill="#ef6f5e" ${S}/><circle cx="50" cy="64" r="25" fill="#ffc94a" ${S}/><circle cx="50" cy="64" r="18" fill="none" stroke="#c9952b" stroke-width="2"/><path d="M50 52l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#fff3c4" stroke="#c9952b" stroke-width="1.5"/></svg>`,
boat:`<svg viewBox="0 0 100 100"><path d="M50 12v48" ${S}/><path d="M53 16v42h28z" fill="#fff" ${S}/><path d="M47 24v34H24z" fill="#ffc94a" ${S}/><path d="M12 62h76L76 80H24z" fill="#c98b4f" ${S}/><path d="M6 88c8-5 14-5 22 0s14 5 22 0 14-5 22 0 14 5 22 0" fill="none" stroke="#5a9cf0" stroke-width="3"/></svg>`,
pagoda:`<svg viewBox="0 0 100 100"><path d="M50 4v12" ${S}/><circle cx="50" cy="5" r="3" fill="#ffc94a" ${S}/><rect x="35" y="74" width="30" height="16" fill="#fff3e6" ${S}/><polygon points="20,74 80,74 68,65 32,65" fill="#ef6f5e" ${S}/><rect x="38" y="54" width="24" height="11" fill="#fff3e6" ${S}/><polygon points="25,54 75,54 65,46 35,46" fill="#ef6f5e" ${S}/><rect x="41" y="37" width="18" height="9" fill="#fff3e6" ${S}/><polygon points="30,37 70,37 62,30 38,30" fill="#ef6f5e" ${S}/><rect x="44" y="23" width="12" height="7" fill="#fff3e6" ${S}/><polygon points="35,23 65,23 58,16 42,16" fill="#ef6f5e" ${S}/><path d="M10 90h80" ${S}/></svg>`
};
const W=[
 {id:'petri',en:'petri dish',zh:'培養皿',ipa:'/ˈpiː.tri dɪʃ/',chunk:'PEE·tree dish',
  tip:'Petri 是發明它的德國科學家的名字。想像「皮翠先生的盤子」🧫',
  sent:'We put colorful water in a ___.',sentZh:'我們把彩色的水倒進培養皿裡。'},
 {id:'fabric',en:'fabric',zh:'布料',ipa:'/ˈfæb.rɪk/',chunk:'FAB·ric',
  tip:'聽起來像「法布」→ 法國來的布 🇫🇷 重音在前面：FAB-ric。',
  sent:'Choose a soft ___ for your bag.',sentZh:'幫你的袋子選一塊柔軟的布料。'},
 {id:'felt',en:'felt',zh:'不織布',ipa:'/felt/',chunk:'felt',
  tip:'felt 也是 feel（感覺）的過去式。摸摸不織布，I felt it! 一字兩用 ✋',
  sent:'Cut the ___ into a heart shape.',sentZh:'把不織布剪成愛心的形狀。'},
 {id:'hoop',en:'embroidery hoop',zh:'刺繡框',ipa:'/ɪmˈbrɔɪ.dər.i huːp/',chunk:'em·BROI·der·y hoop',
  tip:'hoop = 圈圈，就是呼拉圈 hula hoop 的 hoop ⭕ embroidery = 刺繡。',
  sent:'Put the fabric in the ___.',sentZh:'把布放進刺繡框裡。'},
 {id:'medal',en:'medal',zh:'獎牌',ipa:'/ˈmed.əl/',chunk:'MED·al',
  tip:'小心別和 metal（金屬）搞混！A gold medal is made of metal. 🏅',
  sent:'She won a gold ___.',sentZh:'她贏得了一面金牌。'},
 {id:'boat',en:'boat',zh:'船',ipa:'/boʊt/',chunk:'boat',
  tip:'跟 goat、coat 押韻：A goat in a coat on a boat! 🐐⛵',
  sent:'The kids made a paper ___.',sentZh:'孩子們做了一艘紙船。'},
 {id:'pagoda',en:'pagoda',zh:'塔',ipa:'/pəˈɡoʊ.də/',chunk:'pa·GO·da',
  tip:'重音在中間 pa-GO-da！日月潭旁的慈恩塔就是一座 pagoda 🏯',
  sent:'There is a tall ___ by Sun Moon Lake.',sentZh:'日月潭旁邊有一座高高的塔。'}
];
const byId=Object.fromEntries(W.map(w=>[w.id,w]));

/* ========== 儲存（只存在這台裝置的瀏覽器） ========== */
const KEY='rubyVocab_2026_11_12';
let D={m:{},sessions:0,last:null,bestMatch:null,bestSpeed:0,learned:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)D=Object.assign(D,s)}catch(e){}
W.forEach(w=>{if(D.m[w.id]==null)D.m[w.id]=0});
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}

/* ========== 小工具 ========== */
const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
const stars=n=>{let h='';for(let i=0;i<4;i++)h+=`<span class="${i<n?'on':''}">★</span>`;return `<span class="stars">${h}</span>`};
function speak(t,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=slow?0.6:0.9;speechSynthesis.speak(u)}catch(e){}}
let AC=null;
function tone(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const notes=ok?[660,880]:[300,220];
 notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
 const t=AC.currentTime+i*0.11;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}}
function burst(n=14){const em=['⭐','🎨','✨','🖌️','🌈','🏅'];for(let i=0;i<n;i++){const s=document.createElement('div');s.className='burst';
 s.textContent=em[i%em.length];s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight/2)+'px';
 s.style.setProperty('--dx',(Math.random()*360-180)+'px');s.style.setProperty('--dy',(Math.random()*-420+60)+'px');
 document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
const INTERVALS=[1,2,4,7,14];
function nextReview(){if(!D.last)return '今天就開始吧！';const idx=Math.min(D.sessions-1,INTERVALS.length-1);
 const due=new Date(D.last);due.setDate(due.getDate()+INTERVALS[Math.max(idx,0)]);
 const today=new Date();today.setHours(0,0,0,0);due.setHours(0,0,0,0);const diff=Math.round((due-today)/864e5);
 if(diff<=0)return '今天該複習了 ⏰';if(diff===1)return '明天';return diff+' 天後（'+(due.getMonth()+1)+'/'+due.getDate()+'）'}
function top(title,pct){return `<div class="topbar"><button class="back" onclick="home()">←</button>${pct!=null?`<div class="prog"><i style="width:${pct}%"></i></div>`:`<h2 style="margin:0">${title}</h2>`}</div>`}

/* ========== 首頁 ========== */
function home(){
 try{speechSynthesis.cancel()}catch(e){}
 const total=W.reduce((a,w)=>a+D.m[w.id],0),max=W.length*4;
 app.innerHTML=`
 <h1>🎨 Ruby 的單字遊樂場</h1>
 <p class="sub">11/12 語音對話收集的 7 個生字・掌握度 ${Math.round(total/max*100)}%</p>
 <div class="card">
  <div class="wordlist">${W.map(w=>`<div class="wl">${PICS[w.id]}<div><b>${w.en}</b>${stars(D.m[w.id])}</div></div>`).join('')}</div>
  <p class="note" style="margin:10px 0 0">📅 下次複習：<b>${nextReview()}</b></p>
 </div>
 <button class="btn" onclick="learn(0)"><span class="ic" style="background:#dff0ff">👀</span><span>認識單字<small>看圖・聽發音・記憶小撇步</small></span><span class="step">第 1 步</span></button>
 <button class="btn" onclick="match()"><span class="ic" style="background:#efe7ff">🃏</span><span>翻牌配對<small>圖片和單字配成對，暖身記憶</small></span><span class="step">第 2 步</span></button>
 <button class="btn" onclick="quest()"><span class="ic" style="background:#ffe4dc">🖌️</span><span>美術教室闖關<small>會依你的程度自動變難</small></span><span class="step">第 3 步</span></button>
 <button class="btn" onclick="speed()"><span class="ic" style="background:#fff3c4">⚡</span><span>60 秒快閃<small>越快越熟！最高 ${D.bestSpeed} 分</small></span><span class="step">挑戰</span></button>
 <div class="card">
 <details><summary>🧠 這個遊戲為什麼這樣設計？</summary>
 <ul>
  <li><b>圖文雙重記憶</b>：每個字都配上圖和聲音，大腦用兩條路記，比較不容易忘。</li>
  <li><b>主動回想</b>：闖關時要自己想出答案，比一直看單字表記得更牢。</li>
  <li><b>由易到難</b>：每個字有 4 顆星。0 星聽音選圖 → 1 星看圖選字 → 2 星拼字母 → 3 星句子填空自己打。答對升級、答錯降一級。</li>
  <li><b>錯的字很快再出現</b>：答錯的字隔幾題會再考一次，直到答對。</li>
  <li><b>穿插混合</b>：題目把不同單字、不同題型混在一起，訓練真正分辨。</li>
  <li><b>間隔複習</b>：建議在 1、2、4、7、14 天後再玩，首頁會提醒下次時間。</li>
  <li><b>和生活連結</b>：例句都用美術課、日月潭這些你熟悉的場景。</li>
 </ul></details>
 <p class="note" style="margin:8px 0 0">進度只存在這支手機的瀏覽器裡。<button class="ghost" style="padding:3px 8px;font-size:12px" onclick="resetAll()">重設進度</button></p>
 </div>`;
}
let resetArm=false;
function resetAll(){if(!resetArm){resetArm=true;event.target.textContent='再按一次確認';return}
 D={m:{},sessions:0,last:null,bestMatch:null,bestSpeed:0,learned:false};W.forEach(w=>D.m[w.id]=0);save();resetArm=false;home()}

/* ========== 1. 認識單字 ========== */
function learn(i){
 const w=W[i];
 app.innerHTML=`${top('',(i+1)/W.length*100)}
 <div class="card pop">
  <div class="pic">${PICS[w.id]}</div>
  <div class="big">${w.en}</div>
  <div class="ipa">${w.ipa}・${w.chunk}</div>
  <div class="zh">${w.zh}</div>
  <div class="row" style="justify-content:center">
   <button class="speak" onclick="speak('${w.en}')">🔊 聽</button>
   <button class="speak slow" onclick="speak('${w.en}',1)">🐢 慢慢聽</button>
  </div>
  <div class="tip">💡 ${w.tip}</div>
  <div class="sent">${w.sent.replace('___','<b>'+w.en+'</b>')} <button class="speak slow" style="padding:2px 8px;font-size:13px" onclick="speak('${w.sent.replace('___',w.en).replace(/'/g,"\\'")}')">🔊</button><small>${w.sentZh}</small></div>
 </div>
 <div class="row" style="justify-content:space-between">
  <button class="ghost" ${i===0?'style="visibility:hidden"':''} onclick="learn(${i-1})">← 上一個</button>
  ${i<W.length-1?`<button class="primary" onclick="learn(${i+1})">下一個 →</button>`:`<button class="primary" onclick="D.learned=true;save();match()">去翻牌配對 🃏</button>`}
 </div>
 <p class="note center">小提醒：跟著唸出聲音，記得更快！</p>`;
 setTimeout(()=>speak(w.en),250);
}

/* ========== 2. 翻牌配對 ========== */
let MG;
function match(){
 const words=sample(W,6);
 const cards=shuffle(words.flatMap(w=>[{id:w.id,t:'p'},{id:w.id,t:'w'}]));
 MG={cards,open:[],done:0,moves:0,start:Date.now(),lock:false,tick:null};
 app.innerHTML=`${top('翻牌配對')}
 <div class="hud"><span>翻開：<b id="mv">0</b> 次</span><span>⏱ <b id="tm">0</b> 秒</span></div>
 <div class="grid4" id="mg">${cards.map((c,i)=>`<button class="mc" data-i="${i}" onclick="flip(${i})"><div class="in"><div class="f">?</div><div class="b">${c.t==='p'?PICS[c.id]:byId[c.id].en}</div></div></button>`).join('')}</div>
 <p class="note center" style="margin-top:12px">把「圖」和「英文字」配成一對 ${D.bestMatch?`・最佳紀錄 ${D.bestMatch} 秒`:''}</p>`;
 MG.tick=setInterval(()=>{const e=$('#tm');if(!e){clearInterval(MG.tick);return}e.textContent=Math.round((Date.now()-MG.start)/1000)},500);
}
function flip(i){
 if(MG.lock)return;const el=document.querySelector(`.mc[data-i="${i}"]`);
 if(el.classList.contains('flip'))return;
 el.classList.add('flip');const c=MG.cards[i];if(c.t==='w')speak(byId[c.id].en);
 MG.open.push(i);
 if(MG.open.length===2){
  MG.moves++;$('#mv').textContent=MG.moves;
  const [a,b]=MG.open,ca=MG.cards[a],cb=MG.cards[b];
  if(ca.id===cb.id){
   MG.open=[];MG.done++;tone(true);
   [a,b].forEach(k=>document.querySelector(`.mc[data-i="${k}"]`).classList.add('done'));
   if(MG.done===6){clearInterval(MG.tick);const sec=Math.round((Date.now()-MG.start)/1000);
    const rec=!D.bestMatch||sec<D.bestMatch;if(rec)D.bestMatch=sec;save();burst();
    setTimeout(()=>{app.innerHTML=`${top('完成！')}<div class="card center pop"><div style="font-size:54px">🎉</div>
     <h2>${sec} 秒・翻了 ${MG.moves} 次</h2><p>${rec?'🏆 新紀錄！':'最佳紀錄：'+D.bestMatch+' 秒'}</p>
     <div class="row" style="justify-content:center"><button class="ghost" onclick="match()">再玩一次</button><button class="primary" onclick="quest()">去闖關 🖌️</button></div></div>`},700)}
  }else{
   MG.lock=true;
   setTimeout(()=>{[a,b].forEach(k=>document.querySelector(`.mc[data-i="${k}"]`).classList.remove('flip'));MG.open=[];MG.lock=false},900);
  }
 }
}

/* ========== 3. 美術教室闖關（依程度調整難度） ========== */
let Q;
const TYPES=['listen','pic2word','spell','cloze','cloze'];
function quest(){
 // 程度低的字多出現；每個字至少一次
 let pool=W.map(w=>w.id);
 const weak=W.filter(w=>D.m[w.id]<3).map(w=>w.id);
 pool=shuffle(pool.concat(sample(weak.length?weak:pool,Math.min(4,(weak.length||7)))));
 // 避免相同字連續
 for(let i=1;i<pool.length;i++)if(pool[i]===pool[i-1]){const j=pool.findIndex((x,k)=>k>i&&x!==pool[i]);if(j>0)[pool[i],pool[j]]=[pool[j],pool[i]]}
 Q={queue:pool,idx:0,total:pool.length,score:0,combo:0,best:0,right:0,wrong:0,before:{...D.m},answered:false};
 ask();
}
function ask(){
 if(Q.idx>=Q.queue.length)return finish();
 Q.answered=false;
 const id=Q.queue[Q.idx],w=byId[id],lv=D.m[id],type=TYPES[Math.min(lv,4)];
 Q.cur={id,type};
 const others=sample(W.filter(x=>x.id!==id),3);
 const opts=shuffle([w,...others]);
 let body='';
 if(type==='listen'){
  body=`<div class="q">🔊 聽聽看，是哪一個？</div>
  <div class="center" style="margin-bottom:12px"><button class="speak" onclick="speak('${w.en}')">🔊 再聽一次</button> <button class="speak slow" onclick="speak('${w.en}',1)">🐢</button></div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}" onclick="choose(this)">${PICS[o.id]}</button>`).join('')}</div>`;
  setTimeout(()=>speak(w.en),300);
 }else if(type==='pic2word'){
  body=`<div class="pic" style="width:120px;height:120px">${PICS[id]}</div><div class="q">這個英文叫什麼？</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}" onclick="choose(this)">${o.en}</button>`).join('')}</div>`;
 }else if(type==='spell'){
  const letters=w.en.replace(/ /g,'').split('');
  const extra=sample('abcdefghiklmnoprstuy'.split('').filter(c=>!letters.includes(c)),2);
  Q.tiles=shuffle(letters.concat(extra));Q.typed=[];
  body=`<div class="pic" style="width:100px;height:100px">${PICS[id]}</div>
  <div class="q">拼出「${w.zh}」<span class="note">（有 2 個多的字母）</span></div>
  <div class="slots" id="slots"></div>
  <div class="tiles">${Q.tiles.map((c,i)=>`<button class="tile" data-i="${i}" onclick="tap(${i})">${c}</button>`).join('')}</div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" onclick="untap()">⌫ 退一格</button><button class="ghost" onclick="speak('${w.en}',1)">🔊 提示發音</button></div>`;
 }else{
  body=`<div class="q">${w.sent.replace('___','<b style="color:var(--coral)">_____</b>')}<br><span class="note">${w.sentZh}</span></div>
  <input class="type" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="打出英文單字" onkeydown="if(event.key==='Enter')checkType()">
  <div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" onclick="hint()">💡 給我第一個字母</button><button class="primary" onclick="checkType()">送出</button></div>`;
 }
 app.innerHTML=`${top('',Q.idx/Q.queue.length*100)}
 <div class="hud"><span>⭐ ${Q.score} 分</span><span class="combo">${Q.combo>=2?'🔥 連續 '+Q.combo:''}</span><span>${stars(lv)}</span></div>
 <div class="card" id="qc">${body}<div class="fb" id="fb"></div></div>`;
 if(type==='spell')renderSlots();
 if(type==='cloze'||type==='typed')setTimeout(()=>{const a=$('#ans');a&&a.focus()},100);
}
function renderSlots(){
 const w=byId[Q.cur.id];let k=0;
 $('#slots').innerHTML=w.en.split('').map(c=>c===' '?'<div class="slot sp"></div>':`<div class="slot">${Q.typed[k++]!=null?Q.tiles[Q.typed[k-1]]:''}</div>`).join('');
}
function tap(i){if(Q.answered)return;const need=byId[Q.cur.id].en.replace(/ /g,'').length;if(Q.typed.length>=need)return;
 Q.typed.push(i);document.querySelector(`.tile[data-i="${i}"]`).classList.add('used');renderSlots();
 if(Q.typed.length===need){const s=Q.typed.map(k=>Q.tiles[k]).join('');judge(s===byId[Q.cur.id].en.replace(/ /g,''))}}
function untap(){if(Q.answered||!Q.typed.length)return;const i=Q.typed.pop();document.querySelector(`.tile[data-i="${i}"]`).classList.remove('used');renderSlots()}
function hint(){const a=$('#ans');const w=byId[Q.cur.id];Q.hinted=true;a.value=w.en[0];a.focus()}
function checkType(){if(Q.answered)return;const a=$('#ans');if(!a.value.trim()){a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),400);return}
 judge(norm(a.value)===byId[Q.cur.id].en)}
function choose(el){if(Q.answered)return;const ok=el.dataset.id===Q.cur.id;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.id===Q.cur.id)b.classList.add('ok')});
 if(!ok)el.classList.add('bad');judge(ok)}
function judge(ok){
 Q.answered=true;const w=byId[Q.cur.id];const fb=$('#fb');
 tone(ok);
 if(ok){
  Q.combo++;Q.best=Math.max(Q.best,Q.combo);Q.right++;
  const pts=10+(Q.combo>=3?5:0)+D.m[w.id]*2-(Q.hinted?3:0);Q.score+=pts;
  D.m[w.id]=Math.min(4,D.m[w.id]+1);
  const cheer=sample(['Great job! 👏','Nice! 🎨','Perfect! ✨','You got it! 🌟','Awesome! 🏅'],1)[0];
  fb.className='fb ok';fb.innerHTML=`<b>${cheer}</b> +${pts} 分<br>${w.en}・${w.zh} ${Q.combo>=3?'<br>🔥 連續答對加分！':''}`;
  if(Q.combo%3===0)burst(8);
 }else{
  Q.combo=0;Q.wrong++;D.m[w.id]=Math.max(0,D.m[w.id]-1);
  // 答錯的字 3 題後再出現一次
  Q.queue.splice(Math.min(Q.idx+3,Q.queue.length),0,w.id);
  $('#qc').classList.add('shake');
  fb.className='fb bad';fb.innerHTML=`<div class="row"><div style="width:56px;height:56px">${PICS[w.id]}</div><div>正確答案：<b>${w.en}</b>（${w.zh}）<br><span class="note">💡 ${w.tip}</span></div></div><span class="note">這個字等一下會再出現喔！</span>`;
 }
 Q.hinted=false;save();
 speak(w.en);
 fb.innerHTML+=`<div style="text-align:right;margin-top:8px"><button class="primary" onclick="Q.idx++;ask()">下一題 →</button></div>`;
}
function finish(){
 D.sessions++;D.last=new Date().toISOString();save();
 const up=W.filter(w=>D.m[w.id]>Q.before[w.id]);
 const acc=Math.round(Q.right/(Q.right+Q.wrong)*100);
 burst(20);
 app.innerHTML=`${top('闖關完成！')}
 <div class="card center pop"><div style="font-size:54px">${acc>=80?'🏆':acc>=60?'🎨':'💪'}</div>
 <h2>${Q.score} 分・正確率 ${acc}%</h2><p>最長連續答對：🔥 ${Q.best}</p>
 ${up.length?`<p>升級的字：${up.map(w=>`<span class="pill">${w.en} ${stars(D.m[w.id])}</span>`).join(' ')}</p>`:''}
 <p class="note">📅 下次複習：<b>${nextReview()}</b><br>隔幾天再玩，記得比一次玩很久更牢！</p>
 <div class="row" style="justify-content:center"><button class="ghost" onclick="home()">回首頁</button><button class="primary" onclick="quest()">再闖一次</button></div></div>`;
}

/* ========== 4. 60 秒快閃 ========== */
let SP;
function speed(){
 SP={score:0,end:Date.now()+60000,combo:0,tick:null,last:null};
 app.innerHTML=`${top('60 秒快閃')}<div class="card center"><p class="q">看中文，<b>越快</b>選出英文越好！<br>連續答對分數加倍 🔥</p><button class="primary" onclick="spGo()">開始！</button></div>`;
}
function spGo(){SP.end=Date.now()+60000;SP.tick=setInterval(()=>{const e=$('#spt');if(!e){clearInterval(SP.tick);return}
 const left=Math.max(0,Math.ceil((SP.end-Date.now())/1000));e.textContent=left;if(left<=0){clearInterval(SP.tick);spEnd()}},200);spAsk()}
function spAsk(){
 let w;do{w=sample(W,1)[0]}while(SP.last&&w.id===SP.last&&W.length>1);SP.last=w.id;
 const opts=shuffle([w,...sample(W.filter(x=>x.id!==w.id),3)]);
 const mode=Math.random()<.5?'zh':'pic';
 app.innerHTML=`${top('60 秒快閃')}
 <div class="timer">⏱ <span id="spt">${Math.ceil((SP.end-Date.now())/1000)}</span></div>
 <div class="hud"><span>⭐ ${SP.score}</span><span class="combo">${SP.combo>=2?'🔥 x'+SP.combo:''}</span></div>
 <div class="card">${mode==='zh'?`<div class="big">${w.zh}</div>`:`<div class="pic" style="width:110px;height:110px">${PICS[w.id]}</div>`}
 <div class="opts" style="margin-top:14px">${opts.map(o=>`<button class="opt" data-id="${o.id}" onclick="spPick(this,'${w.id}')">${o.en}</button>`).join('')}</div></div>`;
}
function spPick(el,id){
 if(Date.now()>SP.end)return;
 const ok=el.dataset.id===id;tone(ok);
 if(ok){SP.combo++;SP.score+=SP.combo>=3?2:1;el.classList.add('ok')}else{SP.combo=0;el.classList.add('bad');
  document.querySelector(`.opt[data-id="${id}"]`).classList.add('ok')}
 document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
 setTimeout(spAsk,ok?250:800);
}
function spEnd(){
 const rec=SP.score>D.bestSpeed;if(rec)D.bestSpeed=SP.score;save();if(rec)burst();
 app.innerHTML=`${top('時間到！')}<div class="card center pop"><div style="font-size:54px">⚡</div><h2>${SP.score} 分</h2>
 <p>${rec?'🏆 新紀錄！':'最高紀錄：'+D.bestSpeed+' 分'}</p>
 <div class="row" style="justify-content:center"><button class="ghost" onclick="home()">回首頁</button><button class="primary" onclick="speed()">再挑戰</button></div></div>`;
}

home();
</script>
</body>
</html>
