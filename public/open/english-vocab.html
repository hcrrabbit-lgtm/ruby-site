<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruby 的英語單字遊樂場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f8f3ea; --ink:#3d3a35; --muted:#857c70; --card:#fffdf8;
  --coral:#c27a5c; --sun:#e8cf8f; --mint:#8fa37f; --sky:#8aa5b8; --lav:#a9b79a;
  --line:#e6dccb; --ok:#6f8f5f; --bad:#c0665a; --shadow:#e3d7c3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Fredoka","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;}
body{background-image:radial-gradient(#ece3d3 1px,transparent 1px);background-size:18px 18px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:25px;margin:6px 0 2px;letter-spacing:1px;font-family:"Noto Serif TC",serif;font-weight:700;display:flex;align-items:center;gap:8px}
h1 svg{width:34px;height:34px}
.mini{display:inline-block;width:20px;height:20px;vertical-align:-4px}
.btn .ic svg{width:38px;height:38px}
h2{font-size:20px;margin:0 0 10px;font-family:"Noto Serif TC",serif;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
button{font-family:inherit;cursor:pointer;border:none}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:16px;box-shadow:4px 4px 0 var(--shadow);margin-bottom:16px}
.btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--ink);
  border-radius:16px;padding:14px;box-shadow:3px 3px 0 var(--shadow);font-size:17px;color:var(--ink);margin-bottom:12px;transition:transform .08s}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none;border:1.5px solid var(--ink)}
.btn small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.btn .step{margin-left:auto;font-size:12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:20px;padding:2px 8px;white-space:nowrap}
.pill{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}
.primary{background:var(--coral);color:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:12px 18px;font-size:17px;font-weight:600;box-shadow:3px 3px 0 var(--shadow)}
.primary:active{transform:translate(3px,3px);box-shadow:none}
.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:2px 2px 0 var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:#fff;border:1.5px solid var(--ink);border-radius:12px;width:42px;height:42px;font-size:20px;box-shadow:2px 2px 0 var(--shadow)}
.prog{flex:1;height:14px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s}
.wordlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wl{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px}
.wl svg{width:34px;height:34px;flex:none}
.wl b{font-size:14px;display:block;line-height:1.1}
.stars{color:#d9cfbd;font-size:12px;letter-spacing:1px}
.stars .on{color:#f2a900}
.pic{width:150px;height:150px;margin:0 auto;display:block}
.big{font-size:32px;font-weight:700;text-align:center;margin:6px 0 0}
.ipa{text-align:center;color:var(--muted);font-size:15px}
.zh{text-align:center;font-size:20px;margin:4px 0 8px}
.tip{background:#fff6dc;border:1.5px dashed #d8a700;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.5;margin-top:10px}
.sent{background:#eef6ff;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.5;margin-top:10px}
.sent small{color:var(--muted);display:block;font-size:13px}
.speak{background:var(--sky);color:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:2px 2px 0 var(--shadow)}
.speak.slow{background:#fff;color:var(--ink)}
.center{text-align:center}
.q{font-size:19px;text-align:center;margin:6px 0 12px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:12px 8px;font-size:17px;box-shadow:2px 2px 0 var(--shadow);min-height:58px;color:var(--ink)}
.opt svg{width:84px;height:84px}
.opt.ok{background:#d9f5e6;border-color:var(--ok)}
.opt.bad{background:#fde1df;border-color:var(--bad)}
.opt:disabled{cursor:default}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:12px 0}
.slot{width:30px;height:38px;border-bottom:3px solid var(--ink);font-size:24px;font-weight:600;display:grid;place-items:center}
.slot.sp{border:none;width:14px}
.sw{display:flex;gap:5px}
.slots{column-gap:16px;row-gap:8px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:42px;height:46px;background:#f3e3b8;border:1.5px solid var(--ink);border-radius:10px;font-size:22px;font-weight:600;box-shadow:2px 2px 0 var(--shadow);color:var(--ink)}
.tile.used{opacity:.2;pointer-events:none}
input.type{width:100%;font-family:inherit;font-size:22px;padding:12px;border:1.5px solid var(--ink);border-radius:12px;text-align:center;outline:none}
input.type:focus{box-shadow:0 0 0 3px var(--sun)}
.fb{margin-top:14px;border-radius:14px;padding:12px;font-size:16px;line-height:1.5;display:none}
.fb.ok{display:block;background:#d9f5e6;border:2px solid var(--ok)}
.fb.bad{display:block;background:#fde1df;border:2px solid var(--bad)}
.hud{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
.combo{color:var(--coral);font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;perspective:600px;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.flip .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border:1.5px solid var(--ink);border-radius:12px;backface-visibility:hidden;display:grid;place-items:center;padding:4px}
.mc .f{background:var(--lav);font-size:26px;color:#fff;box-shadow:2px 2px 0 var(--shadow)}
.mc .b{background:#fff;transform:rotateY(180deg);font-size:13px;font-weight:600;text-align:center;line-height:1.15;color:var(--ink)}
.mc .b svg{width:90%;height:90%}
.mc.done .b{background:#d9f5e6;border-color:var(--ok)}
.timer{font-size:28px;font-weight:700;text-align:center}
details{font-size:14px;line-height:1.6}
details summary{cursor:pointer;font-weight:600;font-size:15px}
details li{margin-bottom:4px}
.grp{margin-bottom:8px}.grp summary{margin-bottom:8px;font-weight:400}
.burst{position:fixed;pointer-events:none;font-size:26px;z-index:99;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.08)}}
.note{font-size:13px;color:var(--muted)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

 el.classList.add('flip');const c=MG.cards[i];if(c.t==='w')speak(byId[c.id].en);

/* ========== 3. 美術教室闖關（依程度調整難度） ========== */
let Q;
const TYPES=['listen','pic2word','spell','cloze','cloze'];
function quest(){
 // 寶盒裡的字只在抽查日出現；其他字至少一次，程度低的多出現
 let pool=shuffle(W.filter(w=>!inBox(w.id)||boxDue(w.id))).sort((a,b)=>(boxDue(b.id)-boxDue(a.id))||(D.m[a.id]-D.m[b.id])).slice(0,12).map(w=>w.id);
 if(!pool.length){app.innerHTML=`${topBar('闖關')}<div class="card center pop"><div style="font-size:54px">🎁</div><h2>全部的字都在記憶寶盒裡了！</h2><p>還沒到抽查日。<br>可以玩翻牌或 60 秒快閃複習，或等新的生字加進來。</p><div class="row" style="justify-content:center"><button class="ghost" onclick="home()">回首頁</button><button class="primary" onclick="boxView()">看寶盒</button></div></div>`;return}
 const weak=pool.filter(id=>!inBox(id)&&D.m[id]<3);
 pool=shuffle(pool.concat(sample(weak.length?weak:pool,Math.min(4,weak.length||pool.length))));
 // 避免相同字連續
 for(let i=1;i<pool.length;i++)if(pool[i]===pool[i-1]){const j=pool.findIndex((x,k)=>k>i&&x!==pool[i]);if(j>0)[pool[i],pool[j]]=[pool[j],pool[i]]}
 Q={queue:pool,idx:0,total:pool.length,score:0,combo:0,best:0,right:0,wrong:0,before:{...D.m},answered:false,newBox:[],outBox:[]};
 ask();
}
function ask(){
 if(Q.idx>=Q.queue.length)return finish();
 Q.answered=false;
 const id=Q.queue[Q.idx],w=byId[id],lv=D.m[id],type=TYPES[Math.min(lv,4)];
 Q.cur={id,type,lv,check:boxDue(id)};
 const others=sample(W.filter(x=>x.id!==id),3);
 const opts=shuffle([w,...others]);
 let body='';
 if(type==='listen'){
  body=`<div class="q">🔊 聽聽看，是哪一個？</div>
  <div class="center" style="margin-bottom:12px"><button class="speak" onclick="speak('${w.en}')">🔊 再聽一次</button> <button class="speak slow" onclick="speak('${w.en}',1)">🐢</button></div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}" onclick="choose(this)">${PICS[o.id]}</button>`).join('')}</div>`;
  setTimeout(()=>speak(w.en),300);
 }else if(type==='pic2word'){
  body=`<div class="pic" style="width:120px;height:120px">${PICS[id]}</div><div class="q">這個英文叫什麼？</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}" onclick="choose(this)">${o.en}</button>`).join('')}</div>`;
 }else if(type==='spell'){
  const letters=bare(w.en).split('');
  const extra=sample('abcdefghiklmnoprstuy'.split('').filter(c=>!letters.includes(c)),2);
  Q.tiles=shuffle(letters.concat(extra));Q.typed=[];
  body=`<div class="pic" style="width:100px;height:100px">${PICS[id]}</div>
  <div class="q">拼出「${w.zh}」<span class="note">（有 2 個多的字母）</span></div>
  <div class="slots" id="slots"></div>
  <div class="tiles">${Q.tiles.map((c,i)=>`<button class="tile" data-i="${i}" onclick="tap(${i})">${c}</button>`).join('')}</div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" onclick="untap()">⌫ 退一格</button><button class="ghost" onclick="speak('${w.en}',1)">🔊 提示發音</button></div>`;
 }else{
  body=`<div class="q">${w.sent.replace('___','<b style="color:var(--coral)">_____</b>')}<br><span class="note">${w.sentZh}</span></div>
  <input class="type" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="打出英文單字" onkeydown="if(event.key==='Enter')checkType()">
  <div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" onclick="hint()">💡 給我第一個字母</button><button class="primary" onclick="checkType()">送出</button></div>`;
 }
 app.innerHTML=`${topBar('',Q.idx/Q.queue.length*100)}
 <div class="hud"><span>⭐ ${Q.score} 分</span><span class="combo">${Q.combo>=2?'🔥 連續 '+Q.combo:''}</span><span>${Q.cur.check?'🎁 寶盒抽查':stars(lv)}</span></div>
 <div class="card" id="qc">${body}<div class="fb" id="fb"></div></div>`;
 if(type==='spell')renderSlots();
 if(type==='cloze'||type==='typed')setTimeout(()=>{const a=$('#ans');a&&a.focus()},100);
}
function renderSlots(){
 const w=byId[Q.cur.id];let k=0;
 // 每個英文字包成一組，換行時不會把一個字切成兩半
 $('#slots').innerHTML=w.en.split(' ').map(word=>'<div class="sw">'+word.split('').map(c=>c==='-'?'<div class="slot sp">-</div>':`<div class="slot">${Q.typed[k++]!=null?Q.tiles[Q.typed[k-1]]:''}</div>`).join('')+'</div>').join('');
}
function tap(i){if(Q.answered)return;const need=bare(byId[Q.cur.id].en).length;if(Q.typed.length>=need)return;
 Q.typed.push(i);document.querySelector(`.tile[data-i="${i}"]`).classList.add('used');renderSlots();
 if(Q.typed.length===need){const s=Q.typed.map(k=>Q.tiles[k]).join('');judge(s===bare(byId[Q.cur.id].en))}}
function untap(){if(Q.answered||!Q.typed.length)return;const i=Q.typed.pop();document.querySelector(`.tile[data-i="${i}"]`).classList.remove('used');renderSlots()}
function hint(){const a=$('#ans');const w=byId[Q.cur.id];Q.hinted=true;a.value=w.en[0];a.focus()}
function checkType(){if(Q.answered)return;const a=$('#ans');if(!a.value.trim()){a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),400);return}
 judge(norm(a.value)===norm(byId[Q.cur.id].en))}
function choose(el){if(Q.answered)return;const ok=el.dataset.id===Q.cur.id;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.id===Q.cur.id)b.classList.add('ok')});
 if(!ok)el.classList.add('bad');judge(ok)}
function judge(ok){
 Q.answered=true;const w=byId[Q.cur.id];const fb=$('#fb');
 tone(ok);
 if(ok){
  Q.combo++;Q.best=Math.max(Q.best,Q.combo);Q.right++;
  const pts=10+(Q.combo>=3?5:0)+D.m[w.id]*2-(Q.hinted?3:0);Q.score+=pts;
  D.m[w.id]=Math.min(4,D.m[w.id]+1);
  let boxMsg='';
  if(Q.cur.check){const b=D.box[w.id];b.step=Math.min(b.step+1,BOX_GAPS.length-1);b.next=addDays(BOX_GAPS[b.step]);boxMsg=`<br>🎁 抽查通過！下次抽查：${md(b.next)}`}
  else if(Q.cur.lv>=4&&!inBox(w.id)){const t=dstr();const a=D.d4[w.id]=D.d4[w.id]||[];if(!a.includes(t))a.push(t);
   if(a.length>=2){D.box[w.id]={in:t,next:addDays(BOX_GAPS[0]),step:0};Q.newBox.push(w.id);boxMsg='<br>🎁 <b>不同天都答對了，收進記憶寶盒！</b>';setTimeout(()=>burst(18),200)}
   else boxMsg='<br>🌙 今天答對了！<b>明天以後</b>再答對一次，就能收進寶盒。'}
  const cheer=sample(['Great job! 👏','Nice! 🎨','Perfect! ✨','You got it! 🌟','Awesome! 🏅'],1)[0];
  fb.className='fb ok';fb.innerHTML=`<b>${cheer}</b> +${pts} 分<br>${w.en}・${w.zh} ${Q.combo>=3?'<br>🔥 連續答對加分！':''}${boxMsg}`;
  if(Q.combo%3===0)burst(8);
 }else{
  Q.combo=0;Q.wrong++;
  if(inBox(w.id)){delete D.box[w.id];D.m[w.id]=2;Q.outBox.push(w.id)}else D.m[w.id]=Math.max(0,D.m[w.id]-1);
  D.d4[w.id]=[];
  // 答錯的字 3 題後再出現一次
  Q.queue.splice(Math.min(Q.idx+3,Q.queue.length),0,w.id);
  $('#qc').classList.add('shake');
  fb.className='fb bad';fb.innerHTML=`<div class="row"><div style="width:56px;height:56px">${PICS[w.id]}</div><div>正確答案：<b>${w.en}</b>（${w.zh}）<br><span class="note">💡 ${w.tip}</span></div></div><span class="note">這個字等一下會再出現喔！</span>`;
 }
 Q.hinted=false;save();
 speak(w.en);
 fb.innerHTML+=`<div style="text-align:right;margin-top:8px"><button class="primary" onclick="Q.idx++;ask()">下一題 →</button></div>`;
}
function finish(){
 D.sessions++;D.last=new Date().toISOString();save();practiced();
 const up=W.filter(w=>D.m[w.id]>Q.before[w.id]);
 const acc=Math.round(Q.right/(Q.right+Q.wrong)*100);
 burst(20);
 app.innerHTML=`${topBar('闖關完成！')}
 <div class="card center pop"><div style="font-size:54px">${acc>=80?'🏆':acc>=60?'🎨':'💪'}</div>
 <h2>${Q.score} 分・正確率 ${acc}%</h2><p>最長連續答對：🔥 ${Q.best}</p>
 ${Q.newBox.length?`<p>🎁 新收進寶盒：${Q.newBox.map(id=>`<span class="pill">${byId[id].en}</span>`).join(' ')}</p>`:''}
 ${Q.outBox.length?`<p class="note">退回練習區：${Q.outBox.map(id=>byId[id].en).join('、')}（再練練就會回來）</p>`:''}
 ${up.length?`<p>升級的字：${up.map(w=>`<span class="pill">${w.en} ${stars(D.m[w.id])}</span>`).join(' ')}</p>`:''}
 <p class="note">📅 下次複習：<b>${nextReview()}</b><br>隔幾天再玩，記得比一次玩很久更牢！</p>
 <div class="row" style="justify-content:center"><button class="ghost" onclick="home()">回首頁</button><button class="primary" onclick="quest()">再闖一次</button></div></div>`;
}

/* ========== 記憶寶盒 ========== */
function boxView(){
 const ins=W.filter(w=>inBox(w.id)),outs=W.filter(w=>!inBox(w.id));
 app.innerHTML=`${topBar('🎁 記憶寶盒')}
 <div class="card" style="background:#fffaf0">
  <p class="note" style="margin-top:0">拿到 4 顆星，又在<b>不同的兩天</b>答對，就會收進來。寶盒裡的字會在 7、14、30、60 天後抽查，答錯就退回練習區。</p>
  ${ins.length?`<div class="wordlist">${ins.map(w=>`<div class="wl" style="background:#fff3d6;border-color:#e9c46a">${PICS[w.id]}<div><b>${w.en}</b><span class="note">${w.zh}・${boxDue(w.id)?'<b style="color:var(--coral)">今天抽查</b>':'抽查 '+md(D.box[w.id].next)}</span></div></div>`).join('')}</div>`
   :'<p class="center" style="font-size:40px;margin:10px 0">📦</p><p class="center">寶盒還是空的，去闖關把字收進來吧！</p>'}
 </div>
 ${outs.length?`<div class="card"><h2 style="font-size:17px">還在練習的字</h2><div class="wordlist">${outs.map(w=>{const half=(D.d4[w.id]||[]).length>=1;return `<div class="wl">${PICS[w.id]}<div><b>${w.en}</b>${stars(D.m[w.id])}${half?'<span class="note"> 🌙差一天</span>':''}</div></div>`}).join('')}</div></div>`:''}
 <div class="center"><button class="primary" onclick="quest()">去闖關 🖌️</button></div>`;
}

/* ========== 4. 60 秒快閃 ========== */
let SP;
function speed(){
 SP={score:0,end:Date.now()+60000,combo:0,tick:null,last:null};
 app.innerHTML=`${topBar('60 秒快閃')}<div class="card center"><p class="q">看中文，<b>越快</b>選出英文越好！<br>連續答對分數加倍 🔥</p><button class="primary" onclick="spGo()">開始！</button></div>`;
}
function spGo(){SP.end=Date.now()+60000;SP.tick=setInterval(()=>{const e=$('#spt');if(!e){clearInterval(SP.tick);return}
 const left=Math.max(0,Math.ceil((SP.end-Date.now())/1000));e.textContent=left;if(left<=0){clearInterval(SP.tick);spEnd()}},200);spAsk()}
function spAsk(){
 let w;do{w=sample(W,1)[0]}while(SP.last&&w.id===SP.last&&W.length>1);SP.last=w.id;
 const opts=shuffle([w,...sample(W.filter(x=>x.id!==w.id),3)]);
 const mode=Math.random()<.5?'zh':'pic';
 app.innerHTML=`${topBar('60 秒快閃')}
 <div class="timer">⏱ <span id="spt">${Math.ceil((SP.end-Date.now())/1000)}</span></div>
 <div class="hud"><span>⭐ ${SP.score}</span><span class="combo">${SP.combo>=2?'🔥 x'+SP.combo:''}</span></div>
 <div class="card">${mode==='zh'?`<div class="big">${w.zh}</div>`:`<div class="pic" style="width:110px;height:110px">${PICS[w.id]}</div>`}
 <div class="opts" style="margin-top:14px">${opts.map(o=>`<button class="opt" data-id="${o.id}" onclick="spPick(this,'${w.id}')">${o.en}</button>`).join('')}</div></div>`;
}
function spPick(el,id){
 if(Date.now()>SP.end)return;
 const ok=el.dataset.id===id;tone(ok);
 if(ok){SP.combo++;SP.score+=SP.combo>=3?2:1;el.classList.add('ok')}else{SP.combo=0;el.classList.add('bad');
  document.querySelector(`.opt[data-id="${id}"]`).classList.add('ok')}
 document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
 setTimeout(spAsk,ok?250:800);
}
function spEnd(){
 const rec=SP.score>D.bestSpeed;if(rec)D.bestSpeed=SP.score;save();if(rec)burst();practiced();
 app.innerHTML=`${topBar('時間到！')}<div class="card center pop"><div style="font-size:54px">⚡</div><h2>${SP.score} 分</h2>
 <p>${rec?'🏆 新紀錄！':'最高紀錄：'+D.bestSpeed+' 分'}</p>
 <div class="row" style="justify-content:center"><button class="ghost" onclick="home()">回首頁</button><button class="primary" onclick="speed()">再挑戰</button></div></div>`;
}

home();
</script>
<script src="/open/refresh-button.js" defer></script>
