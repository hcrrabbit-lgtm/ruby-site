<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Me</title>
<link rel="manifest" href="manifest-better-me.json" id="pwaManifest">
<meta name="theme-color" content="#5F8955">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Better Me" id="pwaTitle">
<script>
  (function(){
    // pick the per-child manifest/title so "Add to Home Screen" keeps the ?who=
    // instead of falling back to the shared manifest's fixed start_url
    var who = new URLSearchParams(location.search).get('who');
    if (who === 'Cathy' || who === 'Rina') {
      document.getElementById('pwaManifest').href = 'manifest-' + who.toLowerCase() + '.json';
      document.getElementById('pwaTitle').content = 'Better Me - ' + who;
    }
  })();
</script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3EB; --paper-deep:#EFE8D9; --ink:#2E2A25; --ink-soft:#6B655C; --line:#DDD4C1;
    --study:#5F8955; --study-bg:#EBF2E6;
    --radius:14px; --shadow:0 2px 10px rgba(46,42,37,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px;}
  h1{font-family:'Noto Serif TC',serif;font-size:26px;margin:0 0 4px;color:var(--study);}
  .desc{color:var(--ink-soft);font-size:14px;margin-bottom:16px;line-height:1.7;}
  .rules-list{
    list-style:none;
    margin:0 0 24px;
    padding:14px 16px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:12px;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.9;
  }
  .rules-list li{ display:flex; gap:6px; }
  .rules-list b{ color:var(--ink); }

  .child-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .child-group{
    margin-bottom:20px;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 14px 16px;
    background:#fff;
  }
  .child-group.child-cathy, .month-section.child-cathy{ --child-c:#4C8C5A; --child-bg:#E9F3E9; border-color:#C3DFC5; }
  .child-group.child-rina, .month-section.child-rina{ --child-c:#3B7EA8; --child-bg:#E6F0F6; border-color:#BFDCEC; }
  .child-group.child-other, .month-section.child-other{ --child-c:var(--ink-soft); --child-bg:var(--paper-deep); }
  .plant-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));
    gap:8px;
  }
  .plant-card{
    position:relative;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:8px 5px 7px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:transform .15s ease, border-color .15s ease;
  }
  .plant-card:hover{ transform:translateY(-2px); }
  .plant-card .emoji{ line-height:1; margin-bottom:3px; display:flex; justify-content:center; }
  .plant-card .emoji svg{ display:block; width:30px; height:30px; }
  .plant-card .name{ font-size:13px; font-weight:700; color:var(--ink); word-break:break-word; margin-bottom:1px; }
  .plant-card .status{ font-size:10.5px; color:var(--ink-soft); }
  .plant-card .remove{
    position:absolute; top:4px; right:6px;
    font-size:11px; opacity:.35; padding:2px;
  }
  .plant-card .remove:hover{ opacity:1; }
  .plant-card.seed{ border-style:dashed; }
  .plant-card.bloom{ border-color:var(--child-c, var(--study)); background:var(--child-bg, var(--study-bg)); }
  .plant-card.healthy{ border-color:var(--child-c, var(--study)); }
  .plant-card.fading{ border-color:#C9A227; }
  .plant-card.fading .status{ color:#9C7F1E; }
  .plant-card.wilting{ border-color:#B96B77; }
  .plant-card.wilting .status{ color:#B96B77; }
  .plant-card.dead{ border-color:#9a958c; background:#F1EEE7; opacity:.85; }
  .plant-card.dead .status{ color:#8a857c; font-weight:700; }
  .habit-add{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .habit-add input{
    flex:1;
    max-width:240px;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .child-btn{
    flex:1;
    padding:10px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-weight:900;
    font-size:15px;
    font-family:'Noto Serif TC',serif;
    cursor:pointer;
  }
  .child-btn.child-cathy.active{ border-color:#4C8C5A; background:#E9F3E9; color:#4C8C5A; }
  .child-btn.child-rina.active{ border-color:#3B7EA8; background:#E6F0F6; color:#3B7EA8; }
  .child-btn.child-other.active{ border-color:var(--ink-soft); background:var(--paper-deep); color:var(--ink-soft); }
  .habit-add button{
    padding:8px 16px;
    border-radius:8px;
    border:1px solid var(--study);
    background:var(--study-bg);
    color:var(--study);
    font-weight:700;
    cursor:pointer;
    font-size:14px;
  }
  .month-section{
    margin-bottom:24px;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 14px 16px;
    background:#fff;
  }
  .habit-month-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .habit-month-nav button{
    border:1px solid var(--line);
    background:#fff;
    border-radius:8px;
    padding:4px 12px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-soft);
  }
  .habit-month-nav .label{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    color:var(--study);
    font-size:16px;
  }
  .habit-month-nav .child-name{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    color:var(--child-c, var(--study));
    font-size:16px;
    margin-left:4px;
  }
  .habit-table-wrap{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    box-shadow:var(--shadow);
  }
  table.habit-table{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.habit-table th, table.habit-table td{
    border-bottom:1px solid var(--line);
    padding:7px 5px;
    text-align:center;
    white-space:nowrap;
  }
  table.habit-table th.habit-name-col, table.habit-table td.habit-name-col{
    text-align:left;
    padding-left:12px;
    position:sticky;
    left:0;
    background:#fff;
    font-weight:700;
    color:var(--ink);
    min-width:110px;
  }
  table.habit-table th{ color:var(--ink-soft); font-weight:500; }
  table.habit-table th .weekday{ font-size:9px; font-weight:400; color:var(--ink-soft); margin-top:1px; }
  table.habit-table td.today-col, table.habit-table th.today-col{ background:var(--study-bg); }
  table.habit-table td.mark{ color:var(--study); font-weight:700; }
  table.habit-table td.total-col, table.habit-table th.total-col{ font-weight:700; color:var(--study); }
  table.habit-table td.fillable{ cursor:pointer; }
  table.habit-table td.fillable:hover{ background:var(--child-bg, var(--study-bg)); }
  .habit-empty{ color:var(--ink-soft); font-size:13.5px; padding:16px; text-align:center; }
  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .score-badge{
    display:inline-flex;
    align-items:baseline;
    gap:6px;
    background:var(--child-bg, var(--study-bg));
    color:var(--child-c, var(--study));
    font-weight:700;
    font-size:14px;
    padding:8px 16px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .score-row .score-badge{ margin-bottom:0; }
  .score-badge b{ font-size:20px; }
  .edit-toggle{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:13px;
    font-weight:700;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .meal-block{
    margin-top:28px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .meal-block.child-cathy{ border-color:#C3DFC5; }
  .meal-block.child-rina{ border-color:#BFDCEC; }
  .meal-title{ font-family:'Noto Serif TC',serif; font-size:16px; margin:0 0 12px; color:var(--ink); }
  .meal-today{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .meal-input{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); }
  .meal-input input{
    width:72px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    text-align:center;
    font-family:inherit;
  }
  .meal-chart-wrap{ overflow-x:auto; }
  .meal-legend{ display:flex; gap:14px; margin-top:8px; font-size:11px; color:var(--ink-soft); }
  .meal-legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .rescue-bubble{
    position:absolute;
    left:50%;
    top:-8px;
    transform:translate(-50%, -100%) scale(.9);
    background:#2E2A25;
    color:#fff;
    padding:6px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:5;
  }
  .rescue-bubble.show{ opacity:1; transform:translate(-50%, -110%) scale(1); }
  .penalty-banner{
    background:#F6E8E5;
    border:1.5px solid #E3B5AC;
    color:#8A4A3E;
    border-radius:12px;
    padding:12px 16px;
    font-size:13.5px;
    font-weight:700;
    margin-bottom:16px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>✅ Better Me</h1>
  <p class="desc">紀錄小孩每天的學習習慣（例如：閱讀30分鐘、複習功課、練習圍棋）。每個習慣是一株小植物，點一下代表今天澆水（完成打卡）；太久沒澆水植物會慢慢枯萎，提醒你哪個習慣被忽略了。下面會自動累積成本月統計表。</p>
  <ul class="rules-list">
    <li>✅ 每天幫一株植物澆水：<b>+1 分</b></li>
    <li>🎉 救回一株超過 <b>7 天</b>沒澆水的植物：額外再 <b>+2 分</b>（連同澆水那 1 分，總共 +3 分）</li>
    <li>😢 每個禮拜日，會計算現在有幾株超過 7 天沒澆水，直接扣掉對應的分數（例如有 2 株，就扣 2 分）；這是當天鎖定的紀錄，之後就算補澆水，那天的扣分也不會變</li>
  </ul>

  <div class="child-tabs" id="childTabs"></div>

  <div id="habitToday"></div>
  <div class="habit-add">
    <input id="habitNewName" type="text" placeholder="新增習慣，例如：閱讀30分鐘" maxlength="30">
    <button id="habitAddBtn" type="button">＋ 新增</button>
  </div>

  <div id="habitMonthSections"></div>

  <div id="mealSection"></div>
</div>

<script>
  const API = '/api/open/study-habits';

  function pad2(n){ return n.toString().padStart(2, '0'); }
  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function monthStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const habitState = { habits: [], viewDate: new Date() };

  function daysSince(dateStr){
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split('-').map(Number);
    const last = new Date(y, m - 1, d);
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    last.setHours(0, 0, 0, 0);
    return Math.round((now - last) / 86400000);
  }

  function plantStage(h){
    if (h.lastDate) {
      const days = daysSince(h.lastDate);
      if (days <= 0) return { label: '今天澆過水', cls: 'bloom', days };
      if (days === 1) return { label: '昨天澆過水', cls: 'healthy', days };
      if (days <= 3) return { label: days + ' 天沒澆水', cls: 'fading', days };
      if (days <= 6) return { label: days + ' 天沒澆水', cls: 'wilting', days };
      return { label: days + ' 天沒澆水', cls: 'dead', days };
    }
    // never watered at all — measure neglect from when the habit was added, not forever "還沒開始"
    const days = daysSince(h.createdAt ? h.createdAt.slice(0, 10) : null);
    if (days === null || days <= 0) return { label: '還沒開始', cls: 'seed', days: days === null ? -1 : days };
    if (days <= 3) return { label: days + ' 天沒澆水', cls: 'fading', days };
    if (days <= 6) return { label: days + ' 天沒澆水', cls: 'wilting', days };
    return { label: days + ' 天沒澆水', cls: 'dead', days };
  }

      <path d="M39,76 L37,84 M61,76 L63,84" stroke="#7FB6E0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="33" cy="88" r="4" fill="#EAA79A"/>
      <circle cx="67" cy="88" r="4" fill="#EAA79A"/>
      <path d="M42,92 Q50,88 58,92" stroke="#3A3A3A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>`,
    dead: `<svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
      <path d="M78,10 Q90,8 90,18 Q90,26 80,26 L74,30 L76,24 Q70,20 72,14 Q74,10 78,10 Z" fill="#DCD8E6"/>
      <path d="M79,15 L83,19 M83,15 L79,19" stroke="#3A3A3A" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M50,55 C48,46 40,42 33,44" stroke="#8B7355" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M50,55 C52,45 60,40 68,40" stroke="#8B7355" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M33,44 C28,44 24,48 24,52" stroke="#8B7355" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M68,40 C72,38 76,40 78,44" stroke="#8B7355" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M25,58 L75,58 L69,96 Q68,99 65,99 L35,99 Q32,99 31,96 Z" fill="#CFC9DA"/>
      <rect x="21" y="52" width="58" height="10" rx="4" fill="#B7AFC9"/>
      <path d="M35,73 L45,79 M45,73 L35,79" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/>
      <path d="M55,73 L65,79 M65,73 L55,79" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/>
      <path d="M42,88 Q50,84 58,88" stroke="#3A3A3A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>`
  };

  const CHILD_GROUPS = ['Cathy', 'Rina', '其他'];
  const CHILD_SLUG = { Cathy: 'child-cathy', Rina: 'child-rina', '其他': 'child-other' };
  let activeChild = 'Cathy';
  try { activeChild = localStorage.getItem('studyHabitActiveChild') || 'Cathy'; } catch (e) {}
  const urlChild = new URLSearchParams(location.search).get('who');
  if (urlChild === 'Cathy' || urlChild === 'Rina') {
    activeChild = urlChild;
    try { localStorage.setItem('studyHabitActiveChild', activeChild); } catch (e) {}
  }

  function groupByChild(habits){
    const groups = { Cathy: [], Rina: [], '其他': [] };
    habits.forEach(h => {
      (groups[h.child] || groups['其他']).push(h);
    });
    return groups;
  }

  let habitsLoadSeq = 0;
  async function loadHabits(){
    const seq = ++habitsLoadSeq;
    const habits = await fetch(API).then(r => r.json());
    if (seq !== habitsLoadSeq) return; // a newer load already started; don't overwrite it with a stale response
    habitState.habits = habits;
    renderTabs();
    renderPlants();
    loadHabitMonth();
    loadWeeklyPenalty();
  }

  let weeklyPenaltyState = { child: null, isSunday: false, count: 0 };
  let weeklyPenaltyLoadSeq = 0;
  async function loadWeeklyPenalty(){
    const seq = ++weeklyPenaltyLoadSeq;
    const child = activeChild;
    const data = await fetch('/api/open/study-habits/weekly-penalty?child=' + encodeURIComponent(child)).then(r => r.json());
    if (seq !== weeklyPenaltyLoadSeq) return;
    weeklyPenaltyState = { child, isSunday: !!data.isSunday, count: data.count || 0 };
    renderPlants();
  }

  function renderTabs(){
    const groups = groupByChild(habitState.habits);
    const tabs = CHILD_GROUPS.filter(name => name !== '其他' || groups[name].length > 0);
    if (!tabs.includes(activeChild)) activeChild = tabs[0] || 'Cathy';
    const container = document.getElementById('childTabs');
    container.innerHTML = tabs.map(name =>
      `<button type="button" class="child-btn ${CHILD_SLUG[name]} ${name === activeChild ? 'active' : ''}" data-child="${name}">${escapeHtml(name)}</button>`
    ).join('');
    container.querySelectorAll('.child-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeChild = btn.dataset.child;
        try { localStorage.setItem('studyHabitActiveChild', activeChild); } catch (e) {}
        renderTabs();
        renderPlants();
        loadHabitMonth();
        loadWeeklyPenalty();
      });
    });
  }

  let editMode = false;

  function plantCardHtml(h){
    const stage = plantStage(h);
    const removeHtml = editMode ? `<span class="remove" data-remove="${h.id}" title="刪除這個習慣">✕</span>` : '';
    return `<div class="plant-card ${stage.cls}" data-id="${h.id}" title="點一下：完成/取消今天的打卡">
      ${removeHtml}
      <div class="emoji">${PLANT_ICONS[stage.cls]}</div>
      <div class="name">${escapeHtml(h.name)}</div>
      <div class="status">${stage.label}</div>
    </div>`;
  }

  function renderPlants(){
    const wrap = document.getElementById('habitToday');
    const list = groupByChild(habitState.habits)[activeChild] || [];
    if (list.length === 0) {
      wrap.innerHTML = `<div class="child-group ${CHILD_SLUG[activeChild]}"><p class="habit-empty" style="padding:0;">${escapeHtml(activeChild)} 還沒有習慣項目，先在下面新增一個吧。</p></div>`;
      return;
    }
    // most-neglected first, so the plants that most need watering show up first
    list.sort((a, b) => plantStage(b).days - plantStage(a).days);
    const doneToday = list.filter(h => daysSince(h.lastDate) === 0).length;
    const bonusToday = list.reduce((sum, h) => sum + (daysSince(h.lastDate) === 0 ? (h.todayBonus || 0) : 0), 0);
    const penalty = weeklyPenaltyState.child === activeChild ? weeklyPenaltyState.count : 0;
    const todayScore = doneToday + bonusToday - penalty;
    const penaltyBanner = penalty > 0
      ? `<div class="penalty-banner">😢 今天是禮拜日，有 ${penalty} 株超過 7 天沒澆水，扣 ${penalty} 分！趕快去澆水搶救，下週不要再枯掉囉～</div>`
      : '';
    wrap.innerHTML = `<div class="child-group ${CHILD_SLUG[activeChild]}">
      ${penaltyBanner}
      <div class="score-row">
        <div class="score-badge">✨ 今天分數：<b>${todayScore}</b> 分（${doneToday}／${list.length} 項）</div>
        <button type="button" class="edit-toggle" id="editToggleBtn">${editMode ? '完成編輯' : '✎ 編輯'}</button>
      </div>
      <div class="plant-grid">${list.map(plantCardHtml).join('')}</div>
    </div>`;
    document.getElementById('editToggleBtn').addEventListener('click', () => {
      editMode = !editMode;
      renderPlants();
    });
    wrap.querySelectorAll('.plant-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.dataset.remove) return;
        toggleHabit(card.dataset.id);
      });
    });
    wrap.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeHabit(btn.dataset.remove);
      });
    });
  }

  let audioCtx;
  function playChime(){
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      [880, 1174.66].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = now + i * 0.08;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.25);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.28);
      });
    } catch (e) { /* Web Audio unavailable, skip sound */ }
  }

  function playRescueChime(){
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      // a brighter little victory arpeggio, distinct from the everyday check-off chime
      [659.25, 830.61, 987.77, 1318.51].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const start = now + i * 0.09;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.28, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.32);
      });
    } catch (e) { /* Web Audio unavailable, skip sound */ }
  }

  function showRescueBubble(anchorEl, bonus){
    if (!anchorEl) return;
    if (getComputedStyle(anchorEl).position === 'static') anchorEl.style.position = 'relative';
    const bubble = document.createElement('div');
    bubble.className = 'rescue-bubble';
    bubble.textContent = '🎉 +' + bonus + ' 搶救成功！';
    anchorEl.appendChild(bubble);
    requestAnimationFrame(() => bubble.classList.add('show'));
    setTimeout(() => bubble.remove(), 1800);
  }

  async function toggleHabit(id){
    const date = todayStr();
    // optimistic update: flip the local state and re-render immediately so the tap feels
    // instant, instead of waiting on the round-trip (toggle -> refetch list -> refetch month)
    const habit = habitState.habits.find(h => h.id === id);
    if (habit) {
      const wasDoneToday = habit.lastDate === date;
      // undoing today's tap should bring back whatever it was watered on before (the
      // server-provided prevDate), not wipe it to "never watered" — that wrongly shows
      // the seed stage even when the habit already has real history before today
      habit.lastDate = wasDoneToday ? (habit.prevDate || null) : date;
      renderPlants();
      if (!wasDoneToday) playChime();
    }
    try {
      const res = await fetch(API + '/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ habitId: id, date })
      }).then(r => r.json());
      if (res && res.bonus) {
        playRescueChime();
        showRescueBubble(document.querySelector('.plant-card[data-id="' + id + '"]'), res.bonus);
      }
    } finally {
      loadHabits();
    }
  }

  async function removeHabit(id){
    const h = habitState.habits.find(x => x.id === id);
    const label = h ? `${h.child || '其他'} 的『${h.name}』` : '這個習慣';
    if (!confirm(`確定要刪除${label}嗎？相關紀錄也會一併刪除。`)) return;
    await fetch(API, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    loadHabits();
  }

  async function addHabit(){
    const input = document.getElementById('habitNewName');
    const name = input.value.trim();
    if (!name) return;
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, child: activeChild })
    });
    const data = await res.json();
    if (data.id) {
      input.value = '';
      loadHabits();
    }
  }
  document.getElementById('habitAddBtn').addEventListener('click', addHabit);
  document.getElementById('habitNewName').addEventListener('keydown', e => { if (e.key === 'Enter') addHabit(); });

  let monthLoadSeq = 0;
  async function loadHabitMonth(){
    const seq = ++monthLoadSeq;
    const m = monthStr(habitState.viewDate);
    const [data, penaltyRows] = await Promise.all([
      fetch(API + '/month?month=' + m).then(r => r.json()),
      fetch('/api/open/study-habits/weekly-penalty/month?month=' + m + '&child=' + encodeURIComponent(activeChild)).then(r => r.json())
    ]);
    if (seq !== monthLoadSeq) return; // a newer load already started; don't overwrite it with a stale response
    data.weeklyPenaltyTotal = (penaltyRows || []).reduce((sum, r) => sum + (r.count || 0), 0);
    renderMonthSections(data, m);
    loadMealTimes(m);
  }

  const MEAL_LABELS = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐' };
  const MEAL_COLORS = { breakfast: '#C9A227', lunch: '#5F8955', dinner: '#3B7EA8' };
  const MEAL_ORDER = ['breakfast', 'lunch', 'dinner'];

  let mealLoadSeq = 0;
  async function loadMealTimes(month){
    const seq = ++mealLoadSeq;
    const rows = await fetch('/api/open/meal-times?month=' + month + '&child=' + encodeURIComponent(activeChild)).then(r => r.json());
    if (seq !== mealLoadSeq) return;
    renderMealSection(rows, month);
  }

  function renderMealSection(rows, month){
    const container = document.getElementById('mealSection');
    if (!container) return;
    const [y, mo] = month.split('-').map(Number);
    const daysInMonth = new Date(y, mo, 0).getDate();
    const today = todayStr();

    const byMeal = { breakfast: {}, lunch: {}, dinner: {} };
    rows.forEach(r => { if (byMeal[r.meal]) byMeal[r.meal][r.date] = r.minutes; });

    const todayInputs = MEAL_ORDER.map(meal => {
      const val = byMeal[meal][today];
      return `<label class="meal-input">
        <span>${MEAL_LABELS[meal]}</span>
        <input type="number" min="0" max="180" inputmode="numeric" placeholder="分鐘" value="${val !== undefined ? val : ''}" data-meal="${meal}">
      </label>`;
    }).join('');

    container.innerHTML = `<div class="meal-block ${CHILD_SLUG[activeChild]}">
      <h2 class="meal-title">🍽 三餐花費時間（分鐘）</h2>
      <div class="meal-today">${todayInputs}</div>
      <div class="meal-chart-wrap">${mealChartSvg(byMeal, daysInMonth, y, mo)}</div>
      <div class="meal-legend">
        <span><i style="background:${MEAL_COLORS.breakfast}"></i>早餐</span>
        <span><i style="background:${MEAL_COLORS.lunch}"></i>午餐</span>
        <span><i style="background:${MEAL_COLORS.dinner}"></i>晚餐</span>
      </div>
    </div>`;

    container.querySelectorAll('.meal-today input').forEach(input => {
      input.addEventListener('change', () => saveMealTime(input.dataset.meal, input.value));
    });
  }

  async function saveMealTime(meal, value){
    const minutes = Number(value);
    if (!Number.isFinite(minutes) || minutes < 0) return;
    await fetch('/api/open/meal-times', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ child: activeChild, meal, date: todayStr(), minutes })
    });
    loadHabitMonth();
  }

  function mealChartSvg(byMeal, daysInMonth, y, mo){
    const w = Math.max(daysInMonth * 18, 300);
    const h = 140;
    const padL = 26, padR = 8, padT = 8, padB = 26;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;

    let maxMin = 10;
    MEAL_ORDER.forEach(meal => {
      Object.values(byMeal[meal]).forEach(v => { if (v > maxMin) maxMin = v; });
    });
    maxMin = Math.ceil(maxMin / 10) * 10 + 10;

    const xFor = d => padL + (plotW * (d - 1) / Math.max(daysInMonth - 1, 1));
    const yFor = v => padT + plotH - (plotH * v / maxMin);

    const gridVals = [0, Math.round(maxMin / 2), maxMin];
    const grid = gridVals.map(v => `
      <line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w - padR}" y2="${yFor(v).toFixed(1)}" stroke="#E3DCC9" stroke-width="1"/>
      <text x="${padL - 4}" y="${(yFor(v) + 3).toFixed(1)}" font-size="9" fill="#6B655C" text-anchor="end">${v}</text>
    `).join('');

    const xLabels = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const weekday = WEEKDAY_CHARS[new Date(y, mo - 1, d).getDay()];
      const cx = xFor(d).toFixed(1);
      xLabels.push(`
        <text x="${cx}" y="${h - padB + 11}" font-size="8" fill="#6B655C" text-anchor="middle">${d}</text>
        <text x="${cx}" y="${h - padB + 21}" font-size="7" fill="#9C9585" text-anchor="middle">${weekday}</text>
      `);
    }
    const xAxis = xLabels.join('');

    const lines = MEAL_ORDER.map(meal => {
      const pts = [];
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${pad2(mo)}-${pad2(d)}`;
        const v = byMeal[meal][dateStr];
        if (v !== undefined) pts.push([d, v]);
      }
      if (pts.length === 0) return '';
      const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${xFor(p[0]).toFixed(1)},${yFor(p[1]).toFixed(1)}`).join(' ');
      const dots = pts.map(p => `<circle cx="${xFor(p[0]).toFixed(1)}" cy="${yFor(p[1]).toFixed(1)}" r="2.5" fill="${MEAL_COLORS[meal]}"/>`).join('');
      return `<path d="${path}" fill="none" stroke="${MEAL_COLORS[meal]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
    }).join('');

    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${grid}${lines}${xAxis}</svg>`;
  }

  const WEEKDAY_CHARS = ['日', '一', '二', '三', '四', '五', '六'];

  function habitTableHtml(habits, logs, month){
    const [y, mo] = month.split('-').map(Number);
    const daysInMonth = new Date(y, mo, 0).getDate();
    const isCurrentMonth = monthStr(new Date()) === month;
    const todayDate = new Date().getDate();
    const todayFull = todayStr();

    let thead = '<tr><th class="habit-name-col">習慣</th>';
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = isCurrentMonth && d === todayDate;
      const weekday = WEEKDAY_CHARS[new Date(y, mo - 1, d).getDay()];
      thead += `<th class="${isToday ? 'today-col' : ''}">${d}<div class="weekday">${weekday}</div></th>`;
    }
    thead += '<th class="total-col">完成</th></tr>';

    let tbody = '';
    habits.forEach(h => {
      const doneDates = new Set(logs[h.id] || []);
      let row = `<tr><td class="habit-name-col">${escapeHtml(h.name)}</td>`;
      let count = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${pad2(mo)}-${pad2(d)}`;
        const done = doneDates.has(dateStr);
        if (done) count++;
        const isToday = isCurrentMonth && d === todayDate;
        const isFuture = dateStr > todayFull;
        const cls = [done ? 'mark' : '', isToday ? 'today-col' : '', isFuture ? '' : 'fillable'].filter(Boolean).join(' ');
        const attrs = isFuture ? '' : ` data-habit="${h.id}" data-date="${dateStr}"`;
        row += `<td class="${cls}"${attrs}>${done ? '✓' : ''}</td>`;
      }
      row += `<td class="total-col">${count}/${daysInMonth}</td></tr>`;
      tbody += row;
    });

    return `<table class="habit-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }

  function renderMonthSections(data, month){
    const container = document.getElementById('habitMonthSections');
    const monthLabelText = `${habitState.viewDate.getFullYear()}年${habitState.viewDate.getMonth() + 1}月`;
    const list = groupByChild(data.habits || [])[activeChild] || [];
    const monthlyTotal = list.reduce((sum, h) => sum + ((data.logs[h.id] || []).length) + ((data.bonusByHabit && data.bonusByHabit[h.id]) || 0), 0) - (data.weeklyPenaltyTotal || 0);
    const bodyHtml = list.length === 0
      ? `<p class="habit-empty">目前還沒有習慣項目可以統計。</p>`
      : `<div class="score-badge">📊 本月分數：<b>${monthlyTotal}</b> 分</div>
         <div class="habit-table-wrap">${habitTableHtml(list, data.logs, month)}</div>`;
    container.innerHTML = `<div class="month-section ${CHILD_SLUG[activeChild]}">
      <div class="habit-month-nav">
        <button class="habit-prev-month" type="button">‹</button>
        <span class="label">${monthLabelText}</span>
        <span class="child-name">${escapeHtml(activeChild)}</span>
        <button class="habit-next-month" type="button">›</button>
      </div>
      ${bodyHtml}
    </div>`;
    container.querySelector('.habit-prev-month').addEventListener('click', () => {
      habitState.viewDate.setMonth(habitState.viewDate.getMonth() - 1);
      loadHabitMonth();
    });
    container.querySelector('.habit-next-month').addEventListener('click', () => {
      habitState.viewDate.setMonth(habitState.viewDate.getMonth() + 1);
      loadHabitMonth();
    });
    container.querySelectorAll('td.fillable').forEach(td => {
      td.addEventListener('click', () => {
        const turningOn = !td.classList.contains('mark');
        td.classList.toggle('mark', turningOn);
        td.textContent = turningOn ? '✓' : '';
        toggleHabitDate(td.dataset.habit, td.dataset.date, turningOn, td);
      });
    });
  }

  async function toggleHabitDate(habitId, date, turningOn, anchorEl){
    if (turningOn) playChime();
    try {
      const res = await fetch(API + '/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ habitId, date })
      }).then(r => r.json());
      if (res && res.bonus) {
        playRescueChime();
        showRescueBubble(anchorEl, res.bonus);
      }
    } finally {
      loadHabits();
    }
  }

  loadHabits();
</script>
