<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Better Me</title>
<link rel="manifest" href="manifest-better-me.json" id="pwaManifest">
<meta name="theme-color" content="#5F8955">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Better Me" id="pwaTitle">
<script>
  (function(){
    // pick the per-child manifest/title so "Add to Home Screen" keeps the ?who=
    // instead of falling back to the shared manifest's fixed start_url
    var who = new URLSearchParams(location.search).get('who');
    if (who === 'Cathy' || who === 'Rina') {
      document.getElementById('pwaManifest').href = 'manifest-' + who.toLowerCase() + '.json';
      document.getElementById('pwaTitle').content = 'Better Me - ' + who;
    }
  })();
</script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3EB; --paper-deep:#EFE8D9; --ink:#2E2A25; --ink-soft:#6B655C; --line:#DDD4C1;
    --study:#5F8955; --study-bg:#EBF2E6;
    --today-c:#8C7BB8; --today-bg:#EFEAF6;
    --radius:14px; --shadow:0 2px 10px rgba(46,42,37,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px;}
  h1{font-family:'Noto Serif TC',serif;font-size:26px;margin:0 0 4px;color:var(--study);}
  .rules-list{
    list-style:none;
    margin:12px 0 24px;
    padding:14px 16px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:12px;
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.9;
  }
  .rules-list li{ display:flex; gap:8px; }
  .rules-list li::before{
    content:"";
    flex:0 0 auto;
    width:7px;
    height:7px;
    margin-top:7px;
    border-radius:50%;
    background:var(--study);
  }
  .rules-list li > span{ flex:1 1 auto; min-width:0; }
  .rules-list b{ color:var(--ink); }

  .bank-block{
    margin-bottom:24px;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 16px 16px;
    background:#fff;
  }
  .bank-block.child-cathy{ --child-c:#4C8C5A; --child-bg:#E9F3E9; border-color:#C3DFC5; }
  .bank-block.child-rina{ --child-c:#3B7EA8; --child-bg:#E6F0F6; border-color:#BFDCEC; }
  .bank-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .bank-title{ font-weight:700; font-size:15px; color:var(--ink); }
  .bank-withdraw-btn{
    padding:7px 14px;
    border-radius:8px;
    border:1px solid var(--child-c, var(--study));
    background:var(--child-bg, var(--study-bg));
    color:var(--child-c, var(--study));
    font-weight:700;
    cursor:pointer;
    font-size:13px;
  }
  .bank-balance{ font-size:14px; color:var(--ink-soft); margin-bottom:6px; }
  .bank-balance b{ color:var(--ink); font-size:18px; }
  .bank-history-wrap{ font-size:12.5px; color:var(--ink-soft); }
  .bank-history-wrap + .bank-history-wrap{ margin-top:4px; }
  .bank-history-wrap summary{ cursor:pointer; font-weight:700; padding:4px 0; }
  .bank-history-list{ list-style:none; margin:6px 0 0; padding:0; }
  .bank-history-list li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
    border-top:1px solid var(--line);
  }
  .bank-empty{ margin:4px 0 0; }

  .child-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .child-group{
    margin-bottom:20px;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 14px 16px;
    background:#fff;
  }
  .child-group.child-cathy, .month-section.child-cathy{ --child-c:#4C8C5A; --child-bg:#E9F3E9; border-color:#C3DFC5; }
  .child-group.child-rina, .month-section.child-rina{ --child-c:#3B7EA8; --child-bg:#E6F0F6; border-color:#BFDCEC; }
  .child-group.child-other, .month-section.child-other{ --child-c:var(--ink-soft); --child-bg:var(--paper-deep); }
  .plant-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));
    gap:8px;
  }
  .plant-card{
    position:relative;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:8px 5px 7px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:transform .15s ease, border-color .15s ease;
  }
  .plant-card:hover{ transform:translateY(-2px); }
  .plant-card .emoji{ line-height:1; margin-bottom:3px; display:flex; justify-content:center; }
  .plant-card .emoji svg{ display:block; width:30px; height:30px; }
  .plant-card .name{ font-size:13px; font-weight:700; color:var(--ink); word-break:break-word; margin-bottom:1px; }
  .plant-card .rename-icon{
    display:inline-block; font-size:12px; opacity:.6; padding:3px; border-radius:6px;
    vertical-align:1px; line-height:1;
  }
  .plant-card .rename-icon:hover, .plant-card .rename-icon:active{ opacity:1; background:var(--study-bg); }
  .plant-card .status{ font-size:10.5px; color:var(--ink-soft); }
  .plant-card .remove{
    position:absolute; top:4px; right:6px;
    font-size:11px; opacity:.35; padding:2px;
  }
  .plant-card .remove:hover{ opacity:1; }
  .plant-card .target-edit{
    position:absolute; top:3px; left:4px;
    font-size:14px; opacity:.75; padding:4px;
    line-height:1; border-radius:8px;
    background:rgba(255,255,255,.7);
  }
  .plant-card .target-edit:hover, .plant-card .target-edit:active{ opacity:1; background:var(--study-bg); }
  .plant-card.seed{ border-style:dashed; }
  .plant-card.bloom{ border-color:var(--child-c, var(--study)); background:var(--child-bg, var(--study-bg)); }
  .plant-card.healthy{ border-color:var(--child-c, var(--study)); }
  .plant-card.fading{ border-color:#C9A227; }
  .plant-card.fading .status{ color:#9C7F1E; }
  .plant-card.wilting{ border-color:#B96B77; }
  .plant-card.wilting .status{ color:#B96B77; }
  .plant-card.dead{ border-color:#9a958c; background:#F1EEE7; opacity:.85; }
  .plant-card.dead .status{ color:#8a857c; font-weight:700; }
  .plant-card.today{ border-color:var(--today-c); background:var(--today-bg); }
  .plant-card.today .status{ color:var(--today-c); font-weight:700; }
  .drop-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:2px; margin-top:3px; min-height:11px; }
  .drop{ flex:0 0 auto; display:block; }
  .drop-frac{ font-size:9.5px; color:var(--ink-soft); margin-top:1px; font-variant-numeric:tabular-nums; }
  .plant-card.bloom .drop-frac{ color:var(--child-c, var(--study)); font-weight:700; }
  .quota-streak{
    display:inline-block; font-size:8.5px; font-weight:700; color:#C9772E;
    background:#FBEEE0; border-radius:999px; padding:1px 6px; margin-top:2px;
  }
  .habit-add{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .habit-add input{
    flex:1;
    max-width:240px;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .habit-add input.habit-add-target{
    flex:0 0 auto;
    width:118px;
    max-width:118px;
  }
  .child-btn{
    flex:1;
    padding:10px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-weight:900;
    font-size:15px;
    font-family:'Noto Serif TC',serif;
    cursor:pointer;
  }
  .child-btn.child-cathy.active{ border-color:#4C8C5A; background:#E9F3E9; color:#4C8C5A; }
  .child-btn.child-rina.active{ border-color:#3B7EA8; background:#E6F0F6; color:#3B7EA8; }
  .child-btn.child-other.active{ border-color:var(--ink-soft); background:var(--paper-deep); color:var(--ink-soft); }
  .habit-add button{
    padding:8px 16px;
    border-radius:8px;
    border:1px solid var(--study);
    background:var(--study-bg);
    color:var(--study);
    font-weight:700;
    cursor:pointer;
    font-size:14px;
  }
  .month-section{
    margin-bottom:24px;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 14px 16px;
    background:#fff;
  }
  .habit-month-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .habit-month-nav button{
    border:1px solid var(--line);
    background:#fff;
    border-radius:8px;
    padding:4px 12px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-soft);
  }
  .habit-month-nav .label{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    color:var(--study);
    font-size:16px;
  }
  .habit-month-nav .child-name{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    color:var(--child-c, var(--study));
    font-size:16px;
    margin-left:4px;
  }
  .habit-table-wrap{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    box-shadow:var(--shadow);
  }
  table.habit-table{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.habit-table th, table.habit-table td{
    border-bottom:1px solid var(--line);
    padding:7px 5px;
    text-align:center;
    white-space:nowrap;
  }
  table.habit-table th.habit-name-col, table.habit-table td.habit-name-col{
    text-align:left;
    padding-left:12px;
    position:sticky;
    left:0;
    background:#fff;
    font-weight:700;
    color:var(--ink);
    min-width:110px;
  }
  table.habit-table th{ color:var(--ink-soft); font-weight:500; }
  table.habit-table th .weekday{ font-size:9px; font-weight:400; color:var(--ink-soft); margin-top:1px; }
  table.habit-table td.today-col, table.habit-table th.today-col{ background:var(--study-bg); }
  table.habit-table td.mark{ color:var(--study); font-weight:700; }
  table.habit-table td.total-col, table.habit-table th.total-col{ font-weight:700; color:var(--study); }
  table.habit-table td.fillable{ cursor:pointer; }
  table.habit-table td.fillable:hover{ background:var(--child-bg, var(--study-bg)); }
  .habit-empty{ color:var(--ink-soft); font-size:13.5px; padding:16px; text-align:center; }
  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .score-badge{
    display:inline-flex;
    align-items:baseline;
    gap:6px;
    background:var(--child-bg, var(--study-bg));
    color:var(--child-c, var(--study));
    font-weight:700;
    font-size:14px;
    padding:8px 16px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .score-row .score-badge{ margin-bottom:0; }
  .score-badge b{ font-size:20px; }
  .edit-toggle{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-size:13px;
    font-weight:700;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .meal-block{
    margin-top:28px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .meal-block.child-cathy{ border-color:#C3DFC5; }
  .meal-block.child-rina{ border-color:#BFDCEC; }
  .meal-title{ font-family:'Noto Serif TC',serif; font-size:16px; margin:0 0 12px; color:var(--ink); }
  .meal-weekly-status{ margin-bottom:14px; }
  .meal-weekly-badge{
    padding:8px 12px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    line-height:1.6;
    margin-bottom:6px;
  }
  .meal-weekly-badge.pass{ background:#EBF2E6; color:#4C8C5A; }
  .meal-weekly-badge.fail{ background:#F6E8E5; color:#8A4A3E; }
  .meal-today{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .meal-input{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); }
  .meal-input input{
    width:72px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    text-align:center;
    font-family:inherit;
  }
  .meal-chart-wrap{ overflow-x:auto; }
  .meal-legend{ display:flex; gap:14px; margin-top:8px; font-size:11px; color:var(--ink-soft); }
  .meal-legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .section-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin:20px 0 8px;
  }
  .section-head:first-of-type{ margin-top:0; }
  .section-head h2{
    font-family:'Noto Serif TC',serif;
    font-size:14.5px;
    margin:0;
    color:var(--ink);
  }
  .section-head .section-count{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
  .section-empty, .rescue-empty{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    padding:10px 0;
    margin:0;
  }
  .rescue-block{
    background:#fff;
    border:1.5px solid #E3B5AC;
    border-radius:14px;
    padding:12px;
  }
  .rescue-block .plant-card.wilting{ background:#F6E8E5; }
  .rescue-block .plant-card.fading{ background:#FBF1DD; }
  .rescue-cheer{
    font-size:11px;
    color:var(--ink-soft);
    padding:0 0 10px;
    margin-bottom:10px;
    line-height:1.7;
    border-bottom:1px dashed #EAD8D4;
  }
  .streak-toast{
    position:fixed;
    top:16px;
    left:50%;
    transform:translate(-50%, -16px);
    background:var(--study);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .streak-toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---- 分頁：每日習慣／里程碑／成長紀錄 ---- */
  .view-tabs{
    display:flex; gap:4px; margin:-8px 0 20px; padding:4px;
    background:var(--paper-deep); border-radius:12px;
  }
  .view-btn{
    flex:1; padding:9px 6px; border:0; border-radius:9px; background:transparent;
    font:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .view-btn.active{ background:#fff; color:var(--ink); box-shadow:var(--shadow); }

  .rec-card{
    background:#fff; border:1.5px solid var(--line); border-radius:16px;
    padding:14px 16px 16px; margin-bottom:16px;
  }
  .rec-card.child-cathy{ --child-c:#4C8C5A; --child-bg:#E9F3E9; border-color:#C3DFC5; }
  .rec-card.child-rina{ --child-c:#3B7EA8; --child-bg:#E6F0F6; border-color:#BFDCEC; }
  .rec-title{ font-family:'Noto Serif TC',serif; font-size:16px; margin:0 0 10px; color:var(--ink); }
  .rec-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .rec-grid{ grid-template-columns:1fr; } }
  .rec-grid .rec-card{ margin-bottom:0; }
  .rec-now{
    display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
    padding:10px 12px; border-radius:12px; background:var(--child-bg, var(--study-bg));
  }
  .rec-now .lbl{ font-size:12px; color:var(--ink-soft); }
  .rec-now .val{ font-size:26px; font-weight:700; color:var(--child-c, var(--study)); line-height:1.1; }
  .rec-now .sub{ font-size:12px; color:var(--ink-soft); margin-left:auto; text-align:right; }

  .ladder{ list-style:none; margin:0; padding:0 0 0 22px; position:relative; }
  .ladder::before{ content:""; position:absolute; left:4px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .ladder li{ position:relative; display:flex; align-items:center; gap:10px; padding:5px 0; font-size:13px; }
  .ladder li::before{
    content:""; position:absolute; left:-23px; width:10px; height:10px; border-radius:50%;
    background:#fff; border:2px solid var(--child-c, var(--study));
  }
  .ladder li.top::before{ background:var(--child-c, var(--study)); }
  .ladder .lv{ font-weight:700; color:var(--ink); min-width:62px; }
  .ladder .dt{ color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .ladder .gap{ color:var(--ink-soft); font-size:11.5px; }

  .rec-del{
    margin-left:auto; border:0; background:none; color:#B5AC98; cursor:pointer;
    font-size:14px; padding:2px 6px; line-height:1;
  }
  .rec-del:hover{ color:#B5524A; }
  .rec-toolbar{ display:flex; justify-content:flex-end; align-items:center; gap:10px; margin:-6px 0 12px; }
  .rec-toolbar-hint{ font-size:12px; color:var(--ink-soft); }
  .rec-toolbar .rec-btn{ background:#fff; border-color:var(--line); color:var(--ink-soft); }
  .rec-toolbar .rec-btn.on{ background:#FFF3D6; border-color:#E3C77A; color:#8A6A1F; }
  .row-acts{ margin-left:auto; display:flex; gap:2px; flex:0 0 auto; white-space:nowrap; }
  .row-acts .rec-del{ margin-left:0; }
  .rec-edit{ border:0; background:none; cursor:pointer; font-size:14px; padding:2px 6px; line-height:1; }
  .rec-form.editing{ background:#FFF8E6; border-radius:12px; padding:12px; border-top:0; outline:2px dashed #E3C77A; }
  .growth-table td:last-child{ white-space:nowrap; }
  .rec-empty{ font-size:13px; color:var(--ink-soft); margin:2px 0 8px; }

  .rec-form{ display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .rec-form label{ display:flex; flex-direction:column; gap:3px; font-size:11.5px; color:var(--ink-soft); }
  .rec-form input, .rec-form select{
    font:inherit; font-size:14px; padding:7px 9px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); min-width:0;
  }
  .rec-form input[type=number]{ width:78px; }
  .rec-form input[type=date]{ width:142px; }
  .rec-form .grow{ flex:1 1 160px; }
  .rec-form .grow input{ width:100%; }
  .rec-btn{
    padding:8px 14px; border-radius:8px; border:1px solid var(--child-c, var(--study));
    background:var(--child-bg, var(--study-bg)); color:var(--child-c, var(--study));
    font:inherit; font-size:13px; font-weight:700; cursor:pointer;
  }
  .rec-btn.solid{ background:var(--child-c, var(--study)); color:#fff; }
  .rec-btn:disabled{ opacity:.55; cursor:default; }

  .contest-list{ list-style:none; margin:0; padding:0; }
  .contest-list li{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .contest-list li:first-child{ border-top:0; }
  .contest-medal{ font-size:20px; line-height:1.2; }
  .contest-body{ flex:1; min-width:0; }
  .contest-name{ font-size:13.5px; font-weight:700; color:var(--ink); word-break:break-word; }
  .contest-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .contest-meta b{ color:var(--child-c, var(--study)); }
  .photo-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%; }
  .photo-note{ font-size:11.5px; color:var(--ink-soft); line-height:1.6; }
  .photo-status{ font-size:12.5px; color:var(--child-c, var(--study)); font-weight:700; }
  .photo-status.err{ color:#B5524A; }

  .growth-now{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .growth-now .rec-now{ margin:0; flex-direction:column; align-items:flex-start; gap:2px; }
  .growth-now .sub{ margin:0; text-align:left; }
  .growth-chart{ margin-top:6px; }

    border-radius:8px; background:#fff; color:var(--ink); width:100%; min-width:0;
  }
  .eye-form select{ width:auto; flex:0 0 auto; padding:6px 4px; }
  .eye-now{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .eye-now .rec-now{ margin:0; flex-direction:column; align-items:flex-start; gap:2px; }
  .eye-now .sub{ margin:0; text-align:left; line-height:1.6; }
  .chart-legend{ display:flex; gap:14px; font-size:12px; color:var(--ink-soft); margin:2px 0 0; }
  .chart-legend i{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .vision-table td{ font-size:12.5px; }

    font-size:11px; font-weight:700; white-space:nowrap; vertical-align:1px;
  }
</style>
</head>

<div class="wrap">
  <h1>✅ Better Me</h1>

  <div class="child-tabs" id="childTabs"></div>

  <div class="view-tabs" role="tablist">

    <button type="button" class="view-btn" data-view="milestones">🏅 里程碑</button>
    <button type="button" class="view-btn" data-view="growth">📏 成長</button>
    <button type="button" class="view-btn" data-view="vision">👀 視力</button>
  </div>

  <div class="view" id="viewHabits">

      <li><span>每個習慣是一株小植物，點一下代表今天澆水，<b>+1 分</b></span></li>
      <li><span>設定「每週目標次數」的習慣：達標當週還是每天可以 <b>+1 分</b>（一週最多 7 天）；<b>連續 4 週都達標，額外 +4 分</b>；沒達標不扣分，只是沒有這筆額外獎勵。</span></li>
    </ul>

    <div id="habitToday"></div>

    <div id="bankSection"></div>

    <div id="habitMonthSections"></div>

    <div id="mealSection"></div>
  </div>

  <div class="view" id="viewMilestones" hidden></div>

  <div class="view" id="viewVision" hidden></div>
</div>

<script>
  const API = '/api/open/study-habits';

  function pad2(n){ return n.toString().padStart(2, '0'); }
  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function monthStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const habitState = { habits: [], viewDate: new Date() };

  function daysSince(dateStr){
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split('-').map(Number);
    const last = new Date(y, m - 1, d);
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    last.setHours(0, 0, 0, 0);
    return Math.round((now - last) / 86400000);
  }

  function plantStage(h){
    if (h.lastDate) {
      const days = daysSince(h.lastDate);
      if (days <= 0) return { label: '今日已澆水', cls: 'bloom', days };
      if (days === 1) return { label: '昨天澆過水', cls: 'healthy', days };
      if (days <= 3) return { label: days + ' 天沒澆水', cls: 'fading', days };
      if (days <= 6) return { label: days + ' 天沒澆水', cls: 'wilting', days };
      return { label: days + ' 天沒澆水', cls: 'dead', days };
    }
    // never watered at all — measure neglect from when the habit was added, not forever "還沒開始"
    const days = daysSince(h.createdAt ? h.createdAt.slice(0, 10) : null);
    if (days === null || days <= 0) return { label: '還沒開始', cls: 'seed', days: days === null ? -1 : days };
    if (days <= 3) return { label: days + ' 天沒澆水', cls: 'fading', days };
    if (days <= 6) return { label: days + ' 天沒澆水', cls: 'wilting', days };
    return { label: days + ' 天沒澆水', cls: 'dead', days };
  }

  // days left in the Mon-Sun week, including today
  function weekDaysLeft(){
    const dow = new Date().getDay(); // 0=Sun .. 6=Sat
    return dow === 0 ? 1 : 8 - dow;
  }

  function quotaStage(h){
    const target = h.weeklyTarget;
    const count = h.weekCount || 0;
    const remaining = target - count;
    if (remaining <= 0) return { label: '已達標', cls: 'bloom' };
    if (daysSince(h.lastDate) === 0) return { label: '今日已澆水', cls: 'today' };
    // not started yet always reads the same calm way, regardless of how much
    // time is left — habitBucket below is what actually routes it to the rescue section
    if (count === 0) return { label: '本週還沒開始', cls: 'seed' };
    const daysLeft = weekDaysLeft();
    if (remaining > daysLeft) return { label: '', cls: 'wilting' };
    if (remaining === daysLeft) return { label: '', cls: 'fading' };
    return { label: '', cls: 'healthy' };
  }

  // which of the three sections a habit belongs in today. A habit already
  // acted on today always counts as "in progress" (not urgent) even if the
  // week's math is still tight — today's action already answered the call.
  function habitBucket(h){
    const doneToday = daysSince(h.lastDate) === 0;
    if (h.weeklyTarget) {
      const remaining = h.weeklyTarget - (h.weekCount || 0);
      if (remaining <= 0) return 'done';
      if (doneToday) return 'progress';
      return remaining >= weekDaysLeft() ? 'rescue' : 'progress';
    }
    if (doneToday) return 'done';
    const cls = plantStage(h).cls;
    return (cls === 'wilting' || cls === 'dead') ? 'rescue' : 'progress';
  }

  // a short reason for the rescue-section card's status line — quota habits'
  // wilting/fading states are otherwise blank (kept calm in the in-progress
  // grid), so the rescue grid fills that in since it's exactly what's urgent
  function rescueLabel(h){
    const remaining = h.weeklyTarget - (h.weekCount || 0);
    return remaining > weekDaysLeft() ? '這週來不及了' : '最後衝刺';
  }

  function dropSvg(state){
    const fill = state === 'empty' ? 'none' : (state === 'bonus' ? '#5F8955' : '#6FA8D8');
    const stroke = state === 'empty' ? '#C9BFA8' : (state === 'bonus' ? '#5F8955' : '#6FA8D8');
    return `<svg class="drop" width="9" height="12" viewBox="0 0 12 16" aria-hidden="true">
      <path d="M6,0 C6,0 11,7.5 11,10.5 C11,13.5 8.8,15.5 6,15.5 C3.2,15.5 1,13.5 1,10.5 C1,7.5 6,0 6,0 Z"
        fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>
    </svg>`;
  }

  function dropRowHtml(target, count){
    const filled = Math.min(count, target);
    const bonus = Math.max(0, count - target);
    let html = '';
    for (let i = 0; i < target; i++) html += dropSvg(i < filled ? 'filled' : 'empty');
    for (let i = 0; i < bonus; i++) html += dropSvg('bonus');
    return html;
  }

  const CHILD_GROUPS = ['Cathy', 'Rina', '其他'];
  const CHILD_SLUG = { Cathy: 'child-cathy', Rina: 'child-rina', '其他': 'child-other' };
  let activeChild = 'Cathy';
  try { activeChild = localStorage.getItem('studyHabitActiveChild') || 'Cathy'; } catch (e) {}
  const urlChild = new URLSearchParams(location.search).get('who');
  if (urlChild === 'Cathy' || urlChild === 'Rina') {
    activeChild = urlChild;
    try { localStorage.setItem('studyHabitActiveChild', activeChild); } catch (e) {}
  }

  function groupByChild(habits){
    const groups = { Cathy: [], Rina: [], '其他': [] };
    habits.forEach(h => {
      (groups[h.child] || groups['其他']).push(h);
    });
    return groups;
  }

  let habitsLoadSeq = 0;
  async function loadHabits(){
    const seq = ++habitsLoadSeq;
    const habits = await fetch(API).then(r => r.json());
    if (seq !== habitsLoadSeq) return; // a newer load already started; don't overwrite it with a stale response
    habitState.habits = habits;
    renderTabs();
    renderPlants();
    loadHabitMonth();
    loadStreakCheck();
    loadBank();
  }

  let bankLoadSeq = 0;
  async function loadBank(){
    const seq = ++bankLoadSeq;
    const child = activeChild;
    const [bank, history, streaks] = await Promise.all([
      fetch('/api/open/study-habits/bank?child=' + encodeURIComponent(child)).then(r => r.json()),
      fetch('/api/open/study-habits/bank/history?child=' + encodeURIComponent(child)).then(r => r.json()),
      fetch('/api/open/study-habits/streak-history?child=' + encodeURIComponent(child)).then(r => r.json())
    ]);
    if (seq !== bankLoadSeq) return;
    renderBankSection(bank, history, streaks);
  }

  function renderBankSection(bank, history, streaks){
    const container = document.getElementById('bankSection');
    if (!container) return;
    const balance = bank.balance || 0;
    const amount = bank.amount || 0;
    const historyHtml = (!history || history.length === 0)
      ? `<p class="bank-empty">還沒有提領紀錄。</p>`
      : `<ul class="bank-history-list">${history.map(r =>
          `<li><span>${r.date}</span><span>提領 ${r.points} 分 → NT$ ${r.amount}</span></li>`
        ).join('')}</ul>`;
    const streakHtml = (!streaks || streaks.length === 0)
      ? `<p class="bank-empty">還沒有連續達標獎勵紀錄。</p>`
      : `<ul class="bank-history-list">${streaks.map(r =>
          `<li><span>${r.weekDate} ${escapeHtml(r.name)}</span><span>🔥連續${r.streak}週 +${r.bonus} 分</span></li>`
        ).join('')}</ul>`;
    container.innerHTML = `<div class="bank-block ${CHILD_SLUG[activeChild]}">
      <div class="bank-header">
        <span class="bank-title">🏦 習慣銀行</span>
        <button type="button" class="bank-withdraw-btn" id="bankWithdrawBtn">提領</button>
      </div>
      <div class="bank-balance">累積餘額：<b>${balance}</b> 分 ≈ <b>NT$ ${amount}</b></div>
      <details class="bank-history-wrap"><summary>提領紀錄</summary>${historyHtml}</details>
      <details class="bank-history-wrap"><summary>連續達標獎勵紀錄</summary>${streakHtml}</details>
    </div>`;
    document.getElementById('bankWithdrawBtn').addEventListener('click', () => withdrawFromBank(balance, bank.rate || 1));
  }

  async function withdrawFromBank(balance, rate){
    if (balance <= 0) { alert('目前還沒有可以提領的點數喔！'); return; }
    const input = prompt(`累積餘額 ${balance} 分（NT$ ${balance * rate}）\n要提領幾分？`, String(balance));
    if (input === null) return;
    const points = Math.round(Number(input));
    if (!Number.isFinite(points) || points <= 0) { alert('請輸入有效的點數'); return; }
    if (points > balance) { alert('點數超過目前餘額囉'); return; }
    const res = await fetch('/api/open/study-habits/bank/withdraw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ child: activeChild, points })
    }).then(r => r.json());
    if (res.error) { alert(res.error); return; }
    alert(`已提領 ${res.points} 分，換 NT$ ${res.amount} 元！`);
    loadBank();
  }

  let streakCheckLoadSeq = 0;
  async function loadStreakCheck(){
    const seq = ++streakCheckLoadSeq;
    const child = activeChild;
    const data = await fetch('/api/open/study-habits/streak-check?child=' + encodeURIComponent(child)).then(r => r.json());
    if (seq !== streakCheckLoadSeq) return;
    const newlyEarned = data.newlyEarned || [];
    if (newlyEarned.length > 0) {
      playStreakChime();
      newlyEarned.forEach(e => showStreakToast(`🎉 ${e.name} 連續${e.streak}週達標！+${e.bonus} 分`));
      loadBank();
      loadHabits();
    }
  }

  function renderTabs(){
    const groups = groupByChild(habitState.habits);
    const tabs = CHILD_GROUPS.filter(name => name !== '其他' || groups[name].length > 0);
    if (!tabs.includes(activeChild)) activeChild = tabs[0] || 'Cathy';
    const container = document.getElementById('childTabs');
    container.innerHTML = tabs.map(name =>
      `<button type="button" class="child-btn ${CHILD_SLUG[name]} ${name === activeChild ? 'active' : ''}" data-child="${name}">${escapeHtml(name)}</button>`
    ).join('');
    container.querySelectorAll('.child-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeChild = btn.dataset.child;
        try { localStorage.setItem('studyHabitActiveChild', activeChild); } catch (e) {}
        renderTabs();
        renderPlants();
        loadHabitMonth();
        loadStreakCheck();
        loadBank();
        if (window.reloadRecordViews) window.reloadRecordViews();
      });
    });
  }

  let editMode = false;

  function plantCardHtml(h, inRescue){
    const isQuota = !!h.weeklyTarget;
    const stage = isQuota ? quotaStage(h) : plantStage(h);
    const iconKey = stage.cls === 'today' ? 'healthy' : stage.cls;
    // quota wilting/fading cards are blank in the calm in-progress grid, but the
    // rescue grid is exactly where that reason belongs
    const label = (inRescue && isQuota && !stage.label) ? rescueLabel(h) : stage.label;
    const removeHtml = editMode ? `<span class="remove" data-remove="${h.id}" title="刪除這個習慣">✕</span>` : '';
    const targetEditHtml = editMode ? `<span class="target-edit" data-target-edit="${h.id}" title="設定每週目標次數">🎯</span>` : '';
    const dropsHtml = isQuota
      ? `<div class="drop-row">${dropRowHtml(h.weeklyTarget, h.weekCount || 0)}</div>
         <div class="drop-frac">${Math.min(h.weekCount || 0, h.weeklyTarget)}／${h.weeklyTarget}</div>`
      : '';
    const streakHtml = isQuota && h.streak > 0 ? `<div class="quota-streak">🔥 連續達標 ${h.streak} 週</div>` : '';
    return `<div class="plant-card ${stage.cls}" data-id="${h.id}" title="點一下：完成/取消今天的打卡">
      ${removeHtml}
      ${targetEditHtml}
      <div class="emoji">${PLANT_ICONS[iconKey]}</div>
      <div class="name">${escapeHtml(h.name)}${editMode ? ` <span class="rename-icon" data-rename="${h.id}" title="修改名稱">✏️</span>` : ''}</div>
      <div class="status">${label}</div>
      ${dropsHtml}
      ${streakHtml}
    </div>`;
  }

  function renderPlants(){
    const wrap = document.getElementById('habitToday');
    const list = groupByChild(habitState.habits)[activeChild] || [];
    if (list.length === 0) {
      wrap.innerHTML = `<div class="child-group ${CHILD_SLUG[activeChild]}">
        <p class="habit-empty" style="padding:0;">${escapeHtml(activeChild)} 還沒有習慣項目，先新增一個吧。</p>
        ${habitAddFormHtml()}
      </div>`;
      bindHabitAddForm();
      return;
    }

    const rescue = [], progress = [], done = [];
    list.forEach(h => {
      const bucket = habitBucket(h);
      (bucket === 'rescue' ? rescue : bucket === 'done' ? done : progress).push(h);
    });
    // within a section, most-urgent/most-neglected first
    const urgency = h => h.weeklyTarget ? (h.weeklyTarget - (h.weekCount || 0)) - weekDaysLeft() : plantStage(h).days;
    rescue.sort((a, b) => urgency(b) - urgency(a));
    progress.sort((a, b) => urgency(b) - urgency(a));

    const doneToday = list.filter(h => daysSince(h.lastDate) === 0).length;
    const bonusToday = list.reduce((sum, h) => sum + (daysSince(h.lastDate) === 0 ? (h.todayBonus || 0) : 0), 0);
    const todayScore = doneToday + bonusToday;

    const name = escapeHtml(activeChild);
    const rescueHtml = rescue.length
      ? `<div class="rescue-cheer">你願意先救一株嗎？小小的行動，會讓它重新長大 🌱</div>
         <div class="plant-grid">${rescue.map(h => plantCardHtml(h, true)).join('')}</div>`
      : `<p class="rescue-empty">目前沒有急需照顧的項目，太棒了！</p>`;
    const progressHtml = progress.length
      ? `<div class="plant-grid">${progress.map(plantCardHtml).join('')}</div>`
      : `<p class="section-empty">目前沒有進行中的項目。</p>`;
    const doneHtml = done.length
      ? `<div class="plant-grid">${done.map(plantCardHtml).join('')}</div>`
      : `<p class="section-empty">今天先從急救站或照顧中的項目開始吧～</p>`;

    wrap.innerHTML = `<div class="child-group ${CHILD_SLUG[activeChild]}">
      <div class="score-row">
        <div class="score-badge">✨ 今天分數：<b>${todayScore}</b> 分（${doneToday}／${list.length} 項）</div>
        <button type="button" class="edit-toggle" id="editToggleBtn">${editMode ? '完成編輯' : '✎ 編輯'}</button>
      </div>

      <div class="section-head"><h2>🚨 ${name}今日急救站</h2>${rescue.length ? `<span class="section-count">有 ${rescue.length} 項在等你</span>` : ''}</div>
      <div class="rescue-block">${rescueHtml}</div>

      <div class="section-head"><h2>🌿 ${name}照顧中的植物</h2><span class="section-count">${progress.length} 項</span></div>
      ${progressHtml}

      <div class="section-head"><h2>✅ ${name}已達標</h2><span class="section-count">${done.length} 項</span></div>
      ${doneHtml}

      ${editMode ? habitAddFormHtml() : ''}
    </div>`;
    document.getElementById('editToggleBtn').addEventListener('click', () => {
      editMode = !editMode;
      renderPlants();
    });
    wrap.querySelectorAll('.plant-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.dataset.remove || e.target.dataset.targetEdit || e.target.dataset.rename) return;
        toggleHabit(card.dataset.id);
      });
    });
    wrap.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeHabit(btn.dataset.remove);
      });
    });
    wrap.querySelectorAll('[data-target-edit]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        editWeeklyTarget(btn.dataset.targetEdit);
      });
    });
    wrap.querySelectorAll('[data-rename]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        renameHabit(btn.dataset.rename);
      });
    });
    if (editMode) bindHabitAddForm();
  }

  function habitAddFormHtml(){
    return `<div class="habit-add">
      <input id="habitNewName" type="text" placeholder="新增習慣，例如：閱讀30分鐘" maxlength="30">
      <input id="habitNewWeeklyTarget" type="number" min="1" max="14" placeholder="每週次數(選填)" class="habit-add-target">

  let audioCtx;
  function playChime(){
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      [880, 1174.66].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = now + i * 0.08;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.25);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.28);
      });
    } catch (e) { /* Web Audio unavailable, skip sound */ }
  }

  function playStreakChime(){
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      // a longer ascending run than the everyday chime, landing on a held chord —
      // reserved for the rare 4-consecutive-week streak bonus, so it should feel the biggest
      const run = [523.25, 659.25, 783.99, 1046.5, 1318.51];
      run.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const start = now + i * 0.075;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.26, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.24);
      });
      const chordStart = now + run.length * 0.075 + 0.03;
      [1046.5, 1318.51, 1567.98].forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, chordStart);
        gain.gain.linearRampToValueAtTime(0.22, chordStart + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, chordStart + 0.6);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(chordStart);
        osc.stop(chordStart + 0.62);
      });
    } catch (e) { /* Web Audio unavailable, skip sound */ }
  }

  function showStreakToast(text){
    const toast = document.createElement('div');
    toast.className = 'streak-toast';
    toast.textContent = text;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => toast.remove(), 4000);
  }

  async function toggleHabit(id){
    const date = todayStr();
    // optimistic update: flip the local state and re-render immediately so the tap feels
    // instant, instead of waiting on the round-trip (toggle -> refetch list -> refetch month)
    const habit = habitState.habits.find(h => h.id === id);
    if (habit) {
      const wasDoneToday = habit.lastDate === date;
      // undoing today's tap should bring back whatever it was watered on before (the
      // server-provided prevDate), not wipe it to "never watered" — that wrongly shows
      // the seed stage even when the habit already has real history before today
      habit.lastDate = wasDoneToday ? (habit.prevDate || null) : date;
      renderPlants();
      if (!wasDoneToday) playChime();
    }
    try {
      await fetch(API + '/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ habitId: id, date })
      });
    } finally {
      loadHabits();
    }
  }

  async function removeHabit(id){
    const h = habitState.habits.find(x => x.id === id);
    const label = h ? `${h.child || '其他'} 的『${h.name}』` : '這個習慣';
    if (!confirm(`確定要刪除${label}嗎？相關紀錄也會一併刪除。`)) return;
    await fetch(API, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    loadHabits();
  }

  async function addHabit(){
    const input = document.getElementById('habitNewName');
    const name = input.value.trim();
    if (!name) return;
    const targetInput = document.getElementById('habitNewWeeklyTarget');
    const weeklyTarget = targetInput && targetInput.value ? parseInt(targetInput.value, 10) : null;
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, child: activeChild, weeklyTarget })
    });
    const data = await res.json();
    if (data.id) {
      input.value = '';
      if (targetInput) targetInput.value = '';
      loadHabits();
    }
  }

  async function editWeeklyTarget(id){
    const habit = habitState.habits.find(h => h.id === id);
    if (!habit) return;
    const input = prompt(
      '這個習慣「一週最好做幾次」？（留空＝一般每天澆水型，不用天天做才填數字）',
      habit.weeklyTarget || ''
    );
    if (input === null) return;
    const trimmed = input.trim();
    const weeklyTarget = trimmed === '' ? null : parseInt(trimmed, 10);
    if (weeklyTarget !== null && (!Number.isFinite(weeklyTarget) || weeklyTarget <= 0)) {
      alert('請輸入正整數，或留空取消每週目標');
      return;
    }
    const res = await fetch(API + '/weekly-target', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, weeklyTarget })
    }).then(r => r.json());
    if (res.error) { alert(res.error); return; }
    loadHabits();
  }

  async function renameHabit(id){
    const habit = habitState.habits.find(h => h.id === id);
    if (!habit) return;
    const input = prompt('新的習慣名稱：', habit.name);
    if (input === null) return;
    const name = input.trim();
    if (!name) { alert('名稱不能空白'); return; }
    const res = await fetch(API + '/rename', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, name })
    }).then(r => r.json());
    if (res.error) { alert(res.error); return; }
    loadHabits();
  }
  let monthLoadSeq = 0;
  async function loadHabitMonth(){
    const seq = ++monthLoadSeq;
    const m = monthStr(habitState.viewDate);
    loadMealTimes(m); // independent of the fetch below, so don't make it wait on it
    const data = await fetch(API + '/month?month=' + m).then(r => r.json());
    if (seq !== monthLoadSeq) return; // a newer load already started; don't overwrite it with a stale response
    renderMonthSections(data, m);
  }

  const MEAL_LABELS = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐' };
  const MEAL_COLORS = { breakfast: '#C9A227', lunch: '#5F8955', dinner: '#3B7EA8' };
  const MEAL_ORDER = ['breakfast', 'lunch', 'dinner'];

  let mealLoadSeq = 0;
  async function loadMealTimes(month){
    const seq = ++mealLoadSeq;
    const child = activeChild;
    // weekly-status endpoints are fetched best-effort: if either fails, the
    // meal log/chart (rows) should still render instead of the whole section
    // going blank over an unrelated fetch
    const [rows, weekly, weeklyHistory] = await Promise.all([
      fetch('/api/open/meal-times?month=' + month + '&child=' + encodeURIComponent(child)).then(r => r.json()),
      fetch('/api/open/meal-times/weekly-status?child=' + encodeURIComponent(child)).then(r => r.json()).catch(() => ({})),
      fetch('/api/open/meal-times/weekly-status/history?child=' + encodeURIComponent(child)).then(r => r.json()).catch(() => [])
    ]);
    if (seq !== mealLoadSeq) return;
    renderMealSection(rows, month, weekly.latest, weeklyHistory);
  }

  function mealWeeklyStatusHtml(status, history){
    const historyHtml = (!history || history.length === 0)
      ? `<p class="bank-empty">還沒有結算紀錄。</p>`

          `<li><span>${r.week_date}</span><span>${r.passed ? '✅ 達標' : '❌ 未達標'}（${r.success}/${r.total}，需 &gt; ${Number(r.threshold).toFixed(1)}）Lv.${r.level_after}</span></li>`
        ).join('')}</ul>`;

        </div>`

    return `<div class="meal-weekly-status">

  function renderMealSection(rows, month, weeklyStatus, weeklyHistory){
    const container = document.getElementById('mealSection');
    if (!container) return;
    const [y, mo] = month.split('-').map(Number);
    const daysInMonth = new Date(y, mo, 0).getDate();
    const today = todayStr();

    const byMeal = { breakfast: {}, lunch: {}, dinner: {} };
    rows.forEach(r => { if (byMeal[r.meal]) byMeal[r.meal][r.date] = r.minutes; });

      </label>`;
    }).join('');

    container.innerHTML = `<div class="meal-block ${CHILD_SLUG[activeChild]}">

      <div class="meal-chart-wrap">${mealChartSvg(byMeal, daysInMonth, y, mo)}</div>
