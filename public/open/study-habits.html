  async function saveMealTime(meal, value){
    const minutes = Number(value);
    if (!Number.isFinite(minutes) || minutes < 0) return;
    await fetch('/api/open/meal-times', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ child: activeChild, meal, date: todayStr(), minutes })
    });
    loadHabitMonth();
  }

  function mealChartSvg(byMeal, daysInMonth, y, mo){
    const w = Math.max(daysInMonth * 18, 300);
    const h = 140;
    const padL = 26, padR = 8, padT = 8, padB = 26;
    const plotW = w - padL - padR;
    const plotH = h - padT - padB;

    let maxMin = 10;
    MEAL_ORDER.forEach(meal => {
      Object.values(byMeal[meal]).forEach(v => { if (v > maxMin) maxMin = v; });
    });
    maxMin = Math.ceil(maxMin / 10) * 10 + 10;

    const xFor = d => padL + (plotW * (d - 1) / Math.max(daysInMonth - 1, 1));
    const yFor = v => padT + plotH - (plotH * v / maxMin);

    const gridVals = [0, Math.round(maxMin / 2), maxMin];
    const grid = gridVals.map(v => `
      <line x1="${padL}" y1="${yFor(v).toFixed(1)}" x2="${w - padR}" y2="${yFor(v).toFixed(1)}" stroke="#E3DCC9" stroke-width="1"/>
      <text x="${padL - 4}" y="${(yFor(v) + 3).toFixed(1)}" font-size="9" fill="#6B655C" text-anchor="end">${v}</text>
    `).join('');

    const xLabels = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const weekday = WEEKDAY_CHARS[new Date(y, mo - 1, d).getDay()];
      const cx = xFor(d).toFixed(1);
      xLabels.push(`
        <text x="${cx}" y="${h - padB + 11}" font-size="8" fill="#6B655C" text-anchor="middle">${d}</text>
        <text x="${cx}" y="${h - padB + 21}" font-size="7" fill="#9C9585" text-anchor="middle">${weekday}</text>
      `);
    }
    const xAxis = xLabels.join('');

    const lines = MEAL_ORDER.map(meal => {
      const pts = [];
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${pad2(mo)}-${pad2(d)}`;
        const v = byMeal[meal][dateStr];
        if (v !== undefined) pts.push([d, v]);
      }
      if (pts.length === 0) return '';
      const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${xFor(p[0]).toFixed(1)},${yFor(p[1]).toFixed(1)}`).join(' ');
      const dots = pts.map(p => `<circle cx="${xFor(p[0]).toFixed(1)}" cy="${yFor(p[1]).toFixed(1)}" r="2.5" fill="${MEAL_COLORS[meal]}"/>`).join('');
      return `<path d="${path}" fill="none" stroke="${MEAL_COLORS[meal]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
    }).join('');

    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${grid}${lines}${xAxis}</svg>`;
  }

  const WEEKDAY_CHARS = ['日', '一', '二', '三', '四', '五', '六'];

  function habitTableHtml(habits, logs, month){
    const [y, mo] = month.split('-').map(Number);
    const daysInMonth = new Date(y, mo, 0).getDate();
    const isCurrentMonth = monthStr(new Date()) === month;
    const todayDate = new Date().getDate();
    const todayFull = todayStr();

    let thead = '<tr><th class="habit-name-col">習慣</th>';
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = isCurrentMonth && d === todayDate;
      const weekday = WEEKDAY_CHARS[new Date(y, mo - 1, d).getDay()];
      thead += `<th class="${isToday ? 'today-col' : ''}">${d}<div class="weekday">${weekday}</div></th>`;
    }
    thead += '<th class="total-col">完成</th></tr>';

    let tbody = '';
    habits.forEach(h => {
      const doneDates = new Set(logs[h.id] || []);
      let row = `<tr><td class="habit-name-col">${escapeHtml(h.name)}</td>`;
      let count = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${pad2(mo)}-${pad2(d)}`;
        const done = doneDates.has(dateStr);
        if (done) count++;
        const isToday = isCurrentMonth && d === todayDate;
        const isFuture = dateStr > todayFull;
        const cls = [done ? 'mark' : '', isToday ? 'today-col' : '', isFuture ? '' : 'fillable'].filter(Boolean).join(' ');
        const attrs = isFuture ? '' : ` data-habit="${h.id}" data-date="${dateStr}"`;
        row += `<td class="${cls}"${attrs}>${done ? '✓' : ''}</td>`;
      }
      row += `<td class="total-col">${count}/${daysInMonth}</td></tr>`;
      tbody += row;
    });

    return `<table class="habit-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }

  function renderMonthSections(data, month){
    const container = document.getElementById('habitMonthSections');
    const monthLabelText = `${habitState.viewDate.getFullYear()}年${habitState.viewDate.getMonth() + 1}月`;
    const list = groupByChild(data.habits || [])[activeChild] || [];
    const monthlyTotal = list.reduce((sum, h) => sum + ((data.logs[h.id] || []).length) + ((data.bonusByHabit && data.bonusByHabit[h.id]) || 0), 0);
    const bodyHtml = list.length === 0
      ? `<p class="habit-empty">目前還沒有習慣項目可以統計。</p>`
      : `<div class="score-badge">📊 本月分數：<b>${monthlyTotal}</b> 分</div>
         <div class="habit-table-wrap">${habitTableHtml(list, data.logs, month)}</div>`;
    container.innerHTML = `<div class="month-section ${CHILD_SLUG[activeChild]}">
      <div class="habit-month-nav">
        <button class="habit-prev-month" type="button">‹</button>
        <span class="label">${monthLabelText}</span>
        <span class="child-name">${escapeHtml(activeChild)}</span>
        <button class="habit-next-month" type="button">›</button>
      </div>
      ${bodyHtml}
    </div>`;
    container.querySelector('.habit-prev-month').addEventListener('click', () => {
      habitState.viewDate.setMonth(habitState.viewDate.getMonth() - 1);
      loadHabitMonth();
    });
    container.querySelector('.habit-next-month').addEventListener('click', () => {
      habitState.viewDate.setMonth(habitState.viewDate.getMonth() + 1);
      loadHabitMonth();
    });
    container.querySelectorAll('td.fillable').forEach(td => {
      td.addEventListener('click', () => {
        const turningOn = !td.classList.contains('mark');
        td.classList.toggle('mark', turningOn);
        td.textContent = turningOn ? '✓' : '';
        toggleHabitDate(td.dataset.habit, td.dataset.date, turningOn);
      });
    });
  }

  async function toggleHabitDate(habitId, date, turningOn){
    if (turningOn) playChime();
    try {
      await fetch(API + '/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ habitId, date })
      });
    } finally {
      loadHabits();
    }
  }

  loadHabits();
</script>
<script>
  // ---- 里程碑（I English／野狐圍棋／比賽）與成長紀錄 ----
  const REC_API = '/api/open/better-me';
  const VIEWS = { habits: 'viewHabits', milestones: 'viewMilestones', growth: 'viewGrowth', vision: 'viewVision' };
  let activeView = 'habits';
  try { activeView = localStorage.getItem('betterMeView') || 'habits'; } catch (e) {}
  if (!VIEWS[activeView]) activeView = 'habits';
  let recData = null;
  let recLoadSeq = 0;

  function showView(view){
    activeView = view;
    try { localStorage.setItem('betterMeView', view); } catch (e) {}
    recEditMode = false;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    Object.entries(VIEWS).forEach(([k, id]) => { document.getElementById(id).hidden = k !== view; });
    if (view !== 'habits') loadRecords();
  }
  document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));

  window.reloadRecordViews = function(){ recEditMode = false; if (activeView !== 'habits') loadRecords(); };

  // 平常不顯示刪除鈕，按「✏️ 編輯」才出現每筆的修改／刪除，避免誤按
  let recEditMode = false;
  function editToolbarHtml(){
    return `<div class="rec-toolbar">
      ${recEditMode ? '<span class="rec-toolbar-hint">按 ✏️ 修改、✕ 刪除</span>' : ''}
      <button type="button" class="rec-btn rec-edit-toggle ${recEditMode ? 'on' : ''}">${recEditMode ? '✔ 完成編輯' : '✏️ 編輯'}</button>
    </div>`;
  }
  function rowActs(kind, id){
    if (!recEditMode) return '';
    return `<span class="row-acts">
      <button type="button" class="rec-edit" data-edit-${kind}="${id}" title="修改這筆">✏️</button>
      <button type="button" class="rec-del" data-del-${kind}="${id}" title="刪除這筆">✕</button>
    </span>`;
  }
  function rerenderRecords(){
    if (!recData) return;
    if (activeView === 'milestones') renderMilestones();
    if (activeView === 'growth') renderGrowth();
    if (activeView === 'vision') renderVision();
  }
  function bindEditToggle(box){
    const t = box.querySelector('.rec-edit-toggle');
    if (t) t.addEventListener('click', () => { recEditMode = !recEditMode; rerenderRecords(); });
  }
  // 把一筆舊紀錄帶進表單，按鈕改成「更新這筆」
  function startEditing(form, id, fill){
    fill();
    form.dataset.editId = id;
    form.classList.add('editing');
    const btn = form.querySelector('button[type=submit]');
    btn.textContent = '💾 更新這筆';
    if (!form.querySelector('.rec-cancel')) {
      const c = document.createElement('button');
      c.type = 'button'; c.className = 'rec-btn rec-cancel'; c.textContent = '取消修改';
      c.addEventListener('click', rerenderRecords);
      btn.after(c);
    }
    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  const editIdOf = form => form && form.dataset.editId ? Number(form.dataset.editId) : undefined;

  async function loadRecords(){
    const seq = ++recLoadSeq;
    const child = activeChild;
    const box = document.getElementById(VIEWS[activeView]);
    if (child !== 'Cathy' && child !== 'Rina') {
      box.innerHTML = `<p class="rec-empty">里程碑和成長紀錄只有 Cathy 和 Rina 有喔。</p>`;
      return;
    }
    let data;
    try {
      data = await fetch(REC_API + '/records?child=' + encodeURIComponent(child)).then(r => r.json());
    } catch (e) {
      if (seq === recLoadSeq) box.innerHTML = `<p class="rec-empty">讀取失敗，請稍後再試。</p>`;
      return;
    }
    if (seq !== recLoadSeq) return;
    recData = data;
    if (activeView === 'milestones') renderMilestones();
    if (activeView === 'growth') renderGrowth();
    if (activeView === 'vision') renderVision();
  }

  async function recSend(path, method, body){
    const r = await fetch(REC_API + path, {
      method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.error || '儲存失敗');
    return out;
  }

  function fmtDate(d){ const [y, m, dd] = d.split('-'); return `${y}/${Number(m)}/${Number(dd)}`; }
  function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
  function gapText(days){
    if (days < 1) return '';
    if (days < 60) return `花了 ${days} 天`;
    return `花了約 ${Math.round(days / 30)} 個月`;
  }
  const childCls = () => CHILD_SLUG[activeChild] || '';

  // 讀小一那一學年的開始年份（學年從 8 月算起）。
  // 2026 學年 Cathy 國二、Rina 小三。
  const GRADE1_YEAR = { Cathy: 2019, Rina: 2024 };
  const GRADE_NAMES = { '-3': '幼幼班', '-2': '小班', '-1': '中班', '0': '大班',
    1: '小一', 2: '小二', 3: '小三', 4: '小四', 5: '小五', 6: '小六',
    7: '國一', 8: '國二', 9: '國三', 10: '高一', 11: '高二', 12: '高三' };
  function gradeOf(dateStr, child){
    const start = GRADE1_YEAR[child || activeChild];
    if (!start || !dateStr) return '';
    const [y, m] = dateStr.split('-').map(Number);
    const schoolYear = m >= 8 ? y : y - 1;
    return GRADE_NAMES[String(schoolYear - start + 1)] || '';
  }
  function gradeTag(dateStr){
    const g = gradeOf(dateStr);
    return g ? `<span class="grade-tag">${g}</span>` : '';
  }

  // ---------- 里程碑 ----------
  const TRACKS = {
    ienglish: { title: '📘 I English', unit: 'Level' },
    yehu: { title: '⚫ 野狐圍棋', unit: '級段' }
  };

  function levelCardHtml(track){
    const t = TRACKS[track];
    const rows = recData.levels.filter(l => l.track === track);
    const latest = rows[rows.length - 1];
    const nowHtml = latest
      ? `<div class="rec-now"><span class="lbl">目前</span><span class="val">${escapeHtml(latest.label)}</span>
           <span class="sub">${fmtDate(latest.date)}<br>升上來的</span></div>`
      : `<p class="rec-empty">還沒有紀錄，升級時記下來吧！</p>`;
    const ladder = rows.slice().reverse().map((l, i, arr) => {
      const prev = arr[i + 1];
      const gap = prev ? gapText(daysBetween(prev.date, l.date)) : '';
      return `<li class="${i === 0 ? 'top' : ''}">
        <span class="lv">${escapeHtml(l.label)}</span>
        <span class="dt">${fmtDate(l.date)}${gradeTag(l.date)}</span>
        ${gap ? `<span class="gap">${gap}</span>` : ''}
        ${rowActs('level', l.id)}
      </li>`;
    }).join('');
    const unitInput = track === 'yehu'
      ? `<label>級數<input type="number" min="1" max="30" inputmode="numeric" class="lv-num"></label>
         <label>單位<select class="lv-unit"><option value="級">級</option><option value="段">段</option></select></label>`
      : `<label>Level<input type="number" min="1" max="50" inputmode="numeric" class="lv-num"></label>`;
    return `<div class="rec-card ${childCls()}">
      <h2 class="rec-title">${t.title}</h2>
      ${nowHtml}
      ${rows.length ? `<ul class="ladder">${ladder}</ul>` : ''}
      <form novalidate class="rec-form" data-track="${track}">
        ${unitInput}
        <label>升級日期<input type="date" class="lv-date" value="${todayStr()}" max="${todayStr()}"></label>
        <button class="rec-btn solid" type="submit">＋ 記錄升級</button>
      </form>
    </div>`;
  }

  function medalFor(result){
    if (/冠軍|第一名|第1名|金/.test(result)) return '🥇';
    if (/亞軍|第二名|第2名|銀/.test(result)) return '🥈';
    if (/季軍|第三名|第3名|銅/.test(result)) return '🥉';
    return '🏆';
  }

  function contestCardHtml(){
    const list = recData.contests;
    const items = list.length
      ? `<ul class="contest-list">${list.map(c => `<li>
          <span class="contest-medal">${medalFor(c.result)}</span>
          <div class="contest-body">
            <div class="contest-name">${escapeHtml(c.name)}</div>
            <div class="contest-meta">${fmtDate(c.date)}${gradeTag(c.date)}${c.division ? `　${escapeHtml(c.division)}` : ''}　<b>${escapeHtml(c.result)}</b></div>
          </div>
          ${rowActs('contest', c.id)}
        </li>`).join('')}</ul>`
      : `<p class="rec-empty">還沒有比賽紀錄。</p>`;
    return `<div class="rec-card ${childCls()}">
      <h2 class="rec-title">🏆 圍棋比賽成績</h2>
      ${items}
      <form novalidate class="rec-form" id="contestForm">
        <div class="photo-row">
          <button type="button" class="rec-btn" id="contestPhotoBtn">📷 拍獎狀自動填寫</button>
          <input type="file" accept="image/*" capture="environment" id="contestPhoto" hidden>
          <span class="photo-status" id="contestPhotoStatus"></span>
        </div>
        <div class="photo-note">照片只用來讀出比賽名稱、組別、成績和日期，不會被存下來；獎狀上的姓名不會記錄。讀完請檢查一下再按儲存。</div>
        <label class="grow">比賽名稱<input type="text" maxlength="80" id="contestName" placeholder="例如：南投縣縣長盃圍棋賽"></label>
        <label>組別<input type="text" maxlength="40" id="contestDivision" placeholder="例如：國小低年級組" style="width:150px"></label>
        <label>成績<input type="text" maxlength="40" id="contestResult" placeholder="例如：第三名" style="width:120px"></label>
        <label>日期<input type="date" id="contestDate" value="${todayStr()}" max="${todayStr()}"></label>
        <button class="rec-btn solid" type="submit">儲存</button>
      </form>
    </div>`;
  }

  function renderMilestones(){
    const box = document.getElementById('viewMilestones');
    box.innerHTML = `${editToolbarHtml()}<div class="rec-grid">${levelCardHtml('ienglish')}${levelCardHtml('yehu')}</div>
      <div style="height:16px"></div>${contestCardHtml()}`;

    box.querySelectorAll('form[data-track]').forEach(f => f.addEventListener('submit', async e => {
      e.preventDefault();
      const track = f.dataset.track;
      const n = parseInt(f.querySelector('.lv-num').value, 10);
      const date = f.querySelector('.lv-date').value;
      if (!n || !date) { alert('請填等級和日期'); return; }
      const label = track === 'yehu' ? `${n}${f.querySelector('.lv-unit').value}` : `Level ${n}`;
      try { await recSend('/levels', 'POST', { child: activeChild, track, label, date, id: editIdOf(f) }); playChime(); }
      catch (err) { alert(err.message); return; }
      loadRecords();
    }));
    bindEditToggle(box);
    box.querySelectorAll('[data-edit-level]').forEach(b => b.addEventListener('click', () => {
      const l = recData.levels.find(x => x.id === Number(b.dataset.editLevel));
      if (!l) return;
      const f = box.querySelector(`form[data-track="${l.track}"]`);
      startEditing(f, l.id, () => {
        f.querySelector('.lv-num').value = parseInt(l.label.replace(/\D+/g, ''), 10) || '';
        if (f.querySelector('.lv-unit')) f.querySelector('.lv-unit').value = /段/.test(l.label) ? '段' : '級';
        f.querySelector('.lv-date').value = l.date;
      });
    }));
    box.querySelectorAll('[data-edit-contest]').forEach(b => b.addEventListener('click', () => {
      const c = recData.contests.find(x => x.id === Number(b.dataset.editContest));
      if (!c) return;
      startEditing(document.getElementById('contestForm'), c.id, () => {
        document.getElementById('contestName').value = c.name;
        document.getElementById('contestDivision').value = c.division || '';
        document.getElementById('contestResult').value = c.result;
        document.getElementById('contestDate').value = c.date;
      });
    }));
    box.querySelectorAll('[data-del-level]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('確定要刪除這筆升級紀錄嗎？')) return;
      await recSend('/levels', 'DELETE', { id: Number(b.dataset.delLevel) }).catch(err => alert(err.message));
      loadRecords();
    }));
    box.querySelectorAll('[data-del-contest]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('確定要刪除這筆比賽紀錄嗎？')) return;
      await recSend('/contests', 'DELETE', { id: Number(b.dataset.delContest) }).catch(err => alert(err.message));
      loadRecords();
    }));

    const photo = document.getElementById('contestPhoto');
    document.getElementById('contestPhotoBtn').addEventListener('click', () => photo.click());
    photo.addEventListener('change', () => { if (photo.files[0]) readCertificate(photo.files[0]); photo.value = ''; });

    document.getElementById('contestForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('contestName').value.trim();
      const result = document.getElementById('contestResult').value.trim();
      const division = document.getElementById('contestDivision').value.trim();
      const date = document.getElementById('contestDate').value;
      if (!name || !result || !date) { alert('比賽名稱、成績、日期都要填'); return; }
      try { await recSend('/contests', 'POST', { child: activeChild, name, division, result, date, id: editIdOf(e.target) }); playChime(); }
      catch (err) { alert(err.message); return; }
      loadRecords();
    });
  }

  // 先在手機上把照片縮小，再送去讀字，省流量也比較快
  function shrinkImage(file, maxSide){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('照片打不開')); };
      img.src = url;
    });
  }

  async function readCertificate(file){
    const status = document.getElementById('contestPhotoStatus');
    const btn = document.getElementById('contestPhotoBtn');
    status.className = 'photo-status';
    status.textContent = '讀取中…';
    btn.disabled = true;
    try {
      const image = await shrinkImage(file, 1280);
      const out = await recSend('/contests/read-photo', 'POST', { image });
      if (out.name) document.getElementById('contestName').value = out.name;
      if (out.division) document.getElementById('contestDivision').value = out.division;
      if (out.result) document.getElementById('contestResult').value = out.result;
      if (out.date) document.getElementById('contestDate').value = out.date;
      const missing = [!out.name && '名稱', !out.division && '組別', !out.result && '成績', !out.date && '日期'].filter(Boolean);
      status.textContent = missing.length ? `讀好了，${missing.join('、')}請自己補上` : '讀好了！請確認後按儲存';
    } catch (err) {
      status.className = 'photo-status err';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- 成長紀錄 ----------
  function growthChartSvg(rows, key, unit, color){
    const pts = rows.filter(r => r[key] != null).map(r => ({ t: new Date(r.date).getTime(), v: r[key], d: r.date }));
    if (pts.length < 2) return `<p class="rec-empty">記錄兩次以上，就會出現曲線。</p>`;
    const w = 340, h = 150, padL = 34, padR = 12, padT = 14, padB = 24;
    const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
    const span = Math.max(hi - lo, unit === 'cm' ? 4 : 2);
    lo = Math.floor(lo - span * 0.15); hi = Math.ceil(hi + span * 0.15);
    const x = t => padL + (w - padL - padR) * (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0));
    const y = v => padT + (h - padT - padB) * (1 - (v - lo) / (hi - lo));
    const grid = [lo, Math.round((lo + hi) / 2), hi].map(v =>
      `<line x1="${padL}" x2="${w - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#E3DCC9"/>
       <text x="${padL - 5}" y="${(y(v) + 3).toFixed(1)}" font-size="9" fill="#6B655C" text-anchor="end">${v}</text>`).join('');
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const dots = pts.map(p => `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="${color}"><title>${fmtDate(p.d)}：${p.v} ${unit}</title></circle>`).join('');
    const last = pts[pts.length - 1];
    const lastLbl = `<text x="${Math.min(x(last.t), w - padR).toFixed(1)}" y="${(y(last.v) - 7).toFixed(1)}" font-size="10" font-weight="700" fill="${color}" text-anchor="end">${last.v}</text>`;
    const xl = [pts[0], last].map((p, i) =>
      `<text x="${x(p.t).toFixed(1)}" y="${h - 7}" font-size="9" fill="#6B655C" text-anchor="${i ? 'end' : 'start'}">${fmtDate(p.d)}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${unit === 'cm' ? '身高' : '體重'}變化">${grid}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lastLbl}${xl}</svg>`;
  }

  function growthNowHtml(rows, key, label, unit){
    const has = rows.filter(r => r[key] != null);
    if (!has.length) return `<div class="rec-now"><span class="lbl">${label}</span><span class="val">—</span></div>`;
    const last = has[has.length - 1], prev = has[has.length - 2];
    let diff = '';
    if (prev) {
      const d = Math.round((last[key] - prev[key]) * 10) / 10;
      diff = `比上次 ${d > 0 ? '+' : ''}${d} ${unit}`;
    }
    return `<div class="rec-now"><span class="lbl">${label}（${fmtDate(last.date)}）</span>
      <span class="val">${last[key]}<small style="font-size:14px"> ${unit}</small></span>
      <span class="sub">${diff}</span></div>`;
  }

  function renderGrowth(){
    const box = document.getElementById('viewGrowth');
    const rows = recData.growth;
    const color = activeChild === 'Rina' ? '#3B7EA8' : '#4C8C5A';
    const table = rows.length
      ? `<table class="growth-table"><thead><tr><th>日期</th><th>身高</th><th>體重</th><th></th></tr></thead><tbody>
          ${rows.slice().reverse().map(r => `<tr><td>${fmtDate(r.date)}${gradeTag(r.date)}</td>
            <td>${r.heightCm != null ? r.heightCm + ' cm' : '—'}</td>
            <td>${r.weightKg != null ? r.weightKg + ' kg' : '—'}</td>
            <td>${rowActs('growth', r.id)}</td></tr>`).join('')}
        </tbody></table>`
      : `<p class="rec-empty">還沒有紀錄，量完身高體重記下來吧！</p>`;
    box.innerHTML = `${editToolbarHtml()}<div class="rec-card ${childCls()}">
        <h2 class="rec-title">📏 身高體重</h2>
        <div class="growth-now">${growthNowHtml(rows, 'heightCm', '身高', 'cm')}${growthNowHtml(rows, 'weightKg', '體重', 'kg')}</div>
        <form novalidate class="rec-form" id="growthForm" style="margin-top:0;border-top:0;padding-top:0">
          <div class="photo-row">
            <button type="button" class="rec-btn" id="growthPhotoBtn">📷 拍照自動填寫</button>
            <input type="file" accept="image/*" capture="environment" id="growthPhoto" hidden>
            <span class="photo-status" id="growthPhotoStatus"></span>
          </div>
          <div class="photo-note">可以拍體重計螢幕、身高尺，或學校的健康檢查單。照片只用來讀數字，不會被存下來。讀完請檢查一下再按儲存。</div>
          <label>日期<input type="date" id="gDate" value="${todayStr()}" max="${todayStr()}"></label>
          <label>身高 cm<input type="number" step="0.1" min="50" max="220" inputmode="decimal" id="gHeight"></label>
          <label>體重 kg<input type="number" step="0.01" min="1" max="150" inputmode="decimal" id="gWeight"></label>
          <button class="rec-btn solid" type="submit">儲存</button>
        </form>
      </div>
      <div class="rec-card ${childCls()}">
        <h2 class="rec-title">📈 成長曲線</h2>
        <div class="growth-chart"><h3>身高（cm）</h3>${growthChartSvg(rows, 'heightCm', 'cm', color)}</div>
        <div class="growth-chart"><h3>體重（kg）</h3>${growthChartSvg(rows, 'weightKg', 'kg', '#C9A227')}</div>
      </div>
      <div class="rec-card ${childCls()}">
        <h2 class="rec-title">🗂 歷次紀錄</h2>
        ${table}
      </div>`;

    document.getElementById('growthForm').addEventListener('submit', async e => {
      e.preventDefault();
      const date = document.getElementById('gDate').value;
      const heightCm = document.getElementById('gHeight').value;
      const weightKg = document.getElementById('gWeight').value;
      if (!date || (!heightCm && !weightKg)) { alert('請填日期，身高或體重至少填一個'); return; }
      try { await recSend('/growth', 'POST', { child: activeChild, date, heightCm, weightKg, id: editIdOf(e.target) }); playChime(); }
      catch (err) { alert(err.message); return; }
      loadRecords();
    });
    bindEditToggle(box);
    box.querySelectorAll('[data-edit-growth]').forEach(b => b.addEventListener('click', () => {
      const r = recData.growth.find(x => x.id === Number(b.dataset.editGrowth));
      if (!r) return;
      startEditing(document.getElementById('growthForm'), r.id, () => {
        document.getElementById('gDate').value = r.date;
        document.getElementById('gHeight').value = r.heightCm != null ? r.heightCm : '';
        document.getElementById('gWeight').value = r.weightKg != null ? r.weightKg : '';
      });
    }));
    const gPhoto = document.getElementById('growthPhoto');
    document.getElementById('growthPhotoBtn').addEventListener('click', () => gPhoto.click());
    gPhoto.addEventListener('change', () => { if (gPhoto.files[0]) readGrowthPhoto(gPhoto.files[0]); gPhoto.value = ''; });

    box.querySelectorAll('[data-del-growth]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('確定要刪除這筆紀錄嗎？')) return;
      await recSend('/growth', 'DELETE', { id: Number(b.dataset.delGrowth) }).catch(err => alert(err.message));
      loadRecords();
    }));
  }

  // ---------- 視力 ----------
  // 度數用「度」：近視存負數（-125）、遠視存正數；散光存正數
  function sphText(v){
    if (v == null) return '';
    if (v === 0) return '0 度';
    return v < 0 ? `近視 ${-v} 度` : `遠視 ${v} 度`;
  }
  const vaText = v => v == null ? null : (Number.isInteger(v) ? v.toFixed(1) : String(v));
  function eyeSummary(r, side){
    const va = vaText(r['va' + side]), sph = r['sph' + side], cyl = r['cyl' + side];
    const parts = [sphText(sph), cyl ? `散光 ${cyl} 度` : ''].filter(Boolean);
    return { va, extra: parts.join('、') };
  }

  // 多條線的小圖：series = [{ key, label, color, map? }]
  function multiLineSvg(rows, series, opts){
    const all = [];
    series.forEach(sr => rows.forEach(r => {
      const raw = r[sr.key];
      if (raw != null) all.push({ s: sr, t: new Date(r.date).getTime(), v: sr.map ? sr.map(raw) : raw, d: r.date });
    }));
    const dates = new Set(all.map(p => p.d));
    if (dates.size < 2) return `<p class="rec-empty">記錄兩次以上，就會出現曲線。</p>`;
    const w = 340, h = 150, padL = 34, padR = 12, padT = 14, padB = 24;
    const ts = all.map(p => p.t), t0 = Math.min(...ts), t1 = Math.max(...ts);
    let lo = opts.lo != null ? opts.lo : Math.min(...all.map(p => p.v));
    let hi = opts.hi != null ? Math.max(opts.hi, ...all.map(p => p.v)) : Math.max(...all.map(p => p.v));
    if (opts.lo == null) {
      const step = opts.step || 1, span = Math.max(hi - lo, opts.minSpan || 1);
      lo = Math.floor((lo - span * 0.15) / step) * step; hi = Math.ceil((hi + span * 0.15) / step) * step;
      if ((hi - lo) / step % 2) hi += step; // keep the middle gridline on a whole step
    }
    const x = t => padL + (w - padL - padR) * (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0));
    const y = v => padT + (h - padT - padB) * (1 - (v - lo) / (hi - lo));
    const ticks = opts.ticks || [lo, (lo + hi) / 2, hi];
    const fmt = opts.fmt || (v => Math.round(v));
    const grid = ticks.map(v =>
      `<line x1="${padL}" x2="${w - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#E3DCC9"/>
       <text x="${padL - 5}" y="${(y(v) + 3).toFixed(1)}" font-size="9" fill="#6B655C" text-anchor="end">${fmt(v)}</text>`).join('');
    const lines = series.map(sr => {
      const pts = all.filter(p => p.s === sr).sort((a, b) => a.t - b.t);
      if (!pts.length) return '';
      const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
      const dots = pts.map(p => `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="${sr.color}"><title>${sr.label} ${fmtDate(p.d)}：${fmt(p.v)}</title></circle>`).join('');
      return `<path d="${path}" fill="none" stroke="${sr.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
    }).join('');
    const firstD = all.reduce((a, b) => a.t <= b.t ? a : b).d, lastD = all.reduce((a, b) => a.t >= b.t ? a : b).d;
    const xl = `<text x="${padL}" y="${h - 7}" font-size="9" fill="#6B655C">${fmtDate(firstD)}</text>
      <text x="${w - padR}" y="${h - 7}" font-size="9" fill="#6B655C" text-anchor="end">${fmtDate(lastD)}</text>`;
    const legend = `<div class="chart-legend">${series.map(sr => `<span><i style="background:${sr.color}"></i>${sr.label}</span>`).join('')}</div>`;
    return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${opts.title || ''}">${grid}${lines}${xl}</svg>${legend}`;
  }

  function eyeNowCard(rows, side, label){
    const has = rows.filter(r => r['va' + side] != null || r['sph' + side] != null || r['cyl' + side] != null);
    if (!has.length) return `<div class="rec-now"><span class="lbl">${label}</span><span class="val">—</span></div>`;
    const last = has[has.length - 1];
    const { va, extra } = eyeSummary(last, side);
    return `<div class="rec-now"><span class="lbl">${label}（${fmtDate(last.date)}）</span>
      <span class="val">${va != null ? va : '—'}<small style="font-size:12px;font-weight:500"> 裸視</small></span>
      <span class="sub">${escapeHtml(extra)}</span></div>`;
  }

  function renderVision(){
    const box = document.getElementById('viewVision');
    const rows = recData.vision || [];
    const cR = activeChild === 'Rina' ? '#3B7EA8' : '#4C8C5A', cL = '#C9A227';
    const eyeInputs = side => `
      <td><input type="number" step="any" min="0.01" max="2" inputmode="decimal" id="vVa${side}" placeholder="例 0.8"></td>`;
    const sphInputs = side => `
      <td><div class="pair"><select id="vSphType${side}"><option value="-1">近視</option><option value="1">遠視</option></select>
      <input type="number" step="any" min="0" max="2000" inputmode="numeric" id="vSph${side}" placeholder="度"></div></td>`;
    const cylInputs = side => `
      <td><input type="number" step="any" min="0" max="800" inputmode="numeric" id="vCyl${side}" placeholder="度"></td>`;
    const table = rows.length
      ? `<table class="growth-table vision-table"><thead><tr><th>日期</th><th>右眼</th><th>左眼</th><th></th></tr></thead><tbody>
          ${rows.slice().reverse().map(r => {
            const R = eyeSummary(r, 'R'), L = eyeSummary(r, 'L');
            const cell = e => `${e.va != null ? e.va : '—'}${e.extra ? `<span class="note">${escapeHtml(e.extra)}</span>` : ''}`;
            return `<tr><td>${fmtDate(r.date)}${gradeTag(r.date)}${r.note ? `<span class="note">${escapeHtml(r.note)}</span>` : ''}</td>
              <td>${cell(R)}</td><td>${cell(L)}</td>
              <td>${rowActs('vision', r.id)}</td></tr>`;
          }).join('')}
        </tbody></table>`
      : `<p class="rec-empty">還沒有視力紀錄。</p>`;
    const hasSph = rows.some(r => r.sphR != null || r.sphL != null);
    box.innerHTML = `${editToolbarHtml()}<div class="rec-card ${childCls()}">
        <h2 class="rec-title">👀 視力檢查</h2>
        <div class="eye-now">${eyeNowCard(rows, 'R', '右眼')}${eyeNowCard(rows, 'L', '左眼')}</div>
        <form novalidate class="rec-form" id="visionForm" style="margin-top:0;border-top:0;padding-top:0">
          <div class="photo-row">
            <button type="button" class="rec-btn" id="visionPhotoBtn">📷 拍檢查單自動填寫</button>
            <input type="file" accept="image/*" capture="environment" id="visionPhoto" hidden>
            <span class="photo-status" id="visionPhotoStatus"></span>
          </div>
          <div class="photo-note">可以拍學校的視力檢查通知單，或眼科、眼鏡行的驗光單。照片只用來讀數字，不會被存下來。讀完請檢查一下再按儲存。</div>
          <table class="eye-form">
            <thead><tr><th></th><th>右眼</th><th>左眼</th></tr></thead>
            <tbody>
              <tr><th>裸視</th>${eyeInputs('R')}${eyeInputs('L')}</tr>
              <tr><th>度數</th>${sphInputs('R')}${sphInputs('L')}</tr>
              <tr><th>散光</th>${cylInputs('R')}${cylInputs('L')}</tr>
            </tbody>
          </table>
          <label>日期<input type="date" id="vDate" value="${todayStr()}" max="${todayStr()}"></label>
          <label class="grow">備註<input type="text" maxlength="80" id="vNote" placeholder="例如：學校檢查、眼科散瞳後"></label>
          <button class="rec-btn solid" type="submit">儲存</button>
        </form>
      </div>
      <div class="rec-card ${childCls()}">
        <h2 class="rec-title">📈 視力變化</h2>
        <div class="growth-chart"><h3>裸視視力（越高越好）</h3>${multiLineSvg(rows,
          [{ key: 'vaR', label: '右眼', color: cR }, { key: 'vaL', label: '左眼', color: cL }],
          { lo: 0, hi: 1.5, ticks: [0, 0.5, 1.0, 1.5], fmt: v => (Math.round(v * 10) / 10).toFixed(1), title: '裸視視力變化' })}</div>
        ${hasSph ? `<div class="growth-chart"><h3>近視度數（度，越高越深；遠視顯示為負數）</h3>${multiLineSvg(rows,
          [{ key: 'sphR', label: '右眼', color: cR, map: v => -v }, { key: 'sphL', label: '左眼', color: cL, map: v => -v }],
          { minSpan: 100, step: 25, title: '近視度數變化' })}</div>` : ''}
      </div>
      <div class="rec-card ${childCls()}">
        <h2 class="rec-title">🗂 歷次紀錄</h2>
        ${table}
      </div>`;

    document.getElementById('visionForm').addEventListener('submit', async e => {
      e.preventDefault();
      const g = id => document.getElementById(id).value.trim();
      const sph = side => g('vSph' + side) === '' ? '' : Number(g('vSphType' + side)) * Number(g('vSph' + side));
      const body = {
        child: activeChild, date: g('vDate'), note: g('vNote'),
        vaR: g('vVaR'), vaL: g('vVaL'), sphR: sph('R'), sphL: sph('L'), cylR: g('vCylR'), cylL: g('vCylL'),
        id: editIdOf(e.target)
      };
      if (!body.date || ['vaR', 'vaL', 'sphR', 'sphL', 'cylR', 'cylL'].every(k => body[k] === '')) {
        alert('請填日期，視力或度數至少填一個'); return;
      }
      try { await recSend('/vision', 'POST', body); playChime(); }
      catch (err) { alert(err.message); return; }
      loadRecords();
    });
    bindEditToggle(box);
    box.querySelectorAll('[data-edit-vision]').forEach(b => b.addEventListener('click', () => {
      const r = (recData.vision || []).find(x => x.id === Number(b.dataset.editVision));
      if (!r) return;
      startEditing(document.getElementById('visionForm'), r.id, () => {
        const set = (id, v) => { document.getElementById(id).value = v != null ? v : ''; };
        set('vDate', r.date); set('vNote', r.note || '');
        set('vVaR', r.vaR); set('vVaL', r.vaL); set('vCylR', r.cylR); set('vCylL', r.cylL);
        ['R', 'L'].forEach(side => {
          const v = r['sph' + side];
          document.getElementById('vSphType' + side).value = v > 0 ? '1' : '-1';
          set('vSph' + side, v != null ? Math.abs(v) : null);
        });
      });
    }));
    box.querySelectorAll('[data-del-vision]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('確定要刪除這筆視力紀錄嗎？')) return;
      await recSend('/vision', 'DELETE', { id: Number(b.dataset.delVision) }).catch(err => alert(err.message));
      loadRecords();
    }));
    const vPhoto = document.getElementById('visionPhoto');
    document.getElementById('visionPhotoBtn').addEventListener('click', () => vPhoto.click());
    vPhoto.addEventListener('change', () => { if (vPhoto.files[0]) readVisionPhoto(vPhoto.files[0]); vPhoto.value = ''; });
  }

  async function readVisionPhoto(file){
    const status = document.getElementById('visionPhotoStatus');
    const btn = document.getElementById('visionPhotoBtn');
    status.className = 'photo-status';
    status.textContent = '讀取中…';
    btn.disabled = true;
    try {
      const image = await shrinkImage(file, 1600);
      const out = await recSend('/vision/read-photo', 'POST', { image });
      const set = (id, v) => { if (v != null) document.getElementById(id).value = v; };
      set('vVaR', out.vaR); set('vVaL', out.vaL); set('vCylR', out.cylR); set('vCylL', out.cylL);
      ['R', 'L'].forEach(side => {
        const v = out['sph' + side];
        if (v != null) {
          document.getElementById('vSphType' + side).value = v > 0 ? '1' : '-1';
          document.getElementById('vSph' + side).value = Math.abs(v);
        }
      });
      if (out.date) document.getElementById('vDate').value = out.date;
      const got = ['vaR', 'vaL', 'sphR', 'sphL', 'cylR', 'cylL'].filter(k => out[k] != null).length;
      if (!got) { status.className = 'photo-status err'; status.textContent = '照片上找不到視力數字，請手動輸入'; }
      else status.textContent = `讀好了！${out.date ? '' : '日期用今天，'}請確認後按儲存`;
    } catch (err) {
      status.className = 'photo-status err';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function readGrowthPhoto(file){
    const status = document.getElementById('growthPhotoStatus');
    const btn = document.getElementById('growthPhotoBtn');
    status.className = 'photo-status';
    status.textContent = '讀取中…';
    btn.disabled = true;
    try {
      const image = await shrinkImage(file, 1280);
      const out = await recSend('/growth/read-photo', 'POST', { image });
      if (out.heightCm != null) document.getElementById('gHeight').value = out.heightCm;
      if (out.weightKg != null) document.getElementById('gWeight').value = out.weightKg;
      if (out.date) document.getElementById('gDate').value = out.date;
      if (out.heightCm == null && out.weightKg == null) {
        status.className = 'photo-status err';
        status.textContent = '照片上找不到身高或體重，請手動輸入';
      } else {
        const got = [out.heightCm != null && '身高', out.weightKg != null && '體重'].filter(Boolean).join('和');
        status.textContent = `讀到${got}了！${out.date ? '' : '日期用今天，'}請確認後按儲存`;
      }
    } catch (err) {
      status.className = 'photo-status err';
      status.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  }

  // 一次匯入多筆身高（舊紀錄搬家用）：資料放在網址 # 後面，只在打開的那支手機上送出，
  // 不會寫進程式碼。格式：#import=Cathy,2013-08-20_52.8,...（身高）
  // 或 #import=Cathy-weight,2013-08-20_3.78,...（體重）
  // （舊格式 | 和 : 也接受）。用頁面上的按鈕確認，不用 confirm()，因為 App 內建瀏覽器常常不顯示跳出視窗。
  function importFromHash(){
    let hash = location.hash;
    try { hash = decodeURIComponent(hash); } catch (e) {}
    const m = hash.match(/^#import=(Cathy|Rina)(?:-(height|weight))?[,|](.+)$/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    const child = m[1];
    const isWeight = m[2] === 'weight';
    const kind = isWeight ? '體重' : '身高';
    const [lo, hi] = isWeight ? [1, 150] : [50, 220];
    const rows = m[3].split(/[,|]/).map(x => x.split(/[_:]/))
      .filter(([d, v]) => BM_DATE_OK(d) && Number(v) >= lo && Number(v) <= hi);
    if (!rows.length) return;
    const bar = document.createElement('div');
    bar.className = 'rec-card import-bar';
    bar.innerHTML = `<h2 class="rec-title">📥 匯入舊的${kind}紀錄</h2>
      <p style="margin:0 0 12px;font-size:14px;line-height:1.7">要把 <b>${rows.length} 筆</b>${kind}加進 <b>${child}</b> 的成長紀錄嗎？<br>
      （${fmtDate(rows[0][0])} 到 ${fmtDate(rows[rows.length - 1][0])}；同一天已有的${isWeight ? '身高' : '體重'}會保留）</p>
      <div style="display:flex;gap:8px"><button type="button" class="rec-btn solid import-go" style="font-size:15px;padding:10px 18px">✅ 確定加入</button>
      <button type="button" class="rec-btn import-no" style="font-size:15px;padding:10px 18px">取消</button></div>
      <p class="import-msg photo-status" style="margin:10px 0 0"></p>`;
    const wrap = document.querySelector('.wrap');
    wrap.insertBefore(bar, wrap.children[1]);
    bar.querySelector('.import-no').addEventListener('click', () => bar.remove());
    bar.querySelector('.import-go').addEventListener('click', async () => {
      bar.querySelectorAll('button').forEach(b => b.disabled = true);
      const msg = bar.querySelector('.import-msg');
      let ok = 0;
      for (const [date, v] of rows) {
        msg.textContent = `加入中…（${ok}/${rows.length}）`;
        const body = isWeight ? { child, date, heightCm: '', weightKg: v } : { child, date, heightCm: v, weightKg: '' };
        try { await recSend('/growth', 'POST', body); ok++; } catch (e) {}
      }
      msg.textContent = `完成！加入了 ${ok} 筆${ok < rows.length ? `，有 ${rows.length - ok} 筆失敗` : ''}`;
      if (ok < rows.length) msg.classList.add('err');
      if (activeChild !== child) document.querySelector(`.child-btn[data-child="${child}"]`)?.click();
      showView('growth');
      setTimeout(() => bar.remove(), 4000);
    });
  }
  function BM_DATE_OK(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d || ''); }

  showView(activeView);
  importFromHash();
</script>
</body>
</html>
