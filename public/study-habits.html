<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更好的自己習慣養成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3EB; --paper-deep:#EFE8D9; --ink:#2E2A25; --ink-soft:#6B655C; --line:#DDD4C1;
    --study:#5F8955; --study-bg:#EBF2E6;
    --radius:14px; --shadow:0 2px 10px rgba(46,42,37,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 60px;}
  a.back{color:var(--ink-soft);text-decoration:none;font-size:13px;}
  h1{font-family:'Noto Serif TC',serif;font-size:26px;margin:14px 0 4px;color:var(--study);}
  .desc{color:var(--ink-soft);font-size:14px;margin-bottom:24px;line-height:1.7;}

  .child-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .child-group{
    margin-bottom:20px;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 14px 16px;
    background:#fff;
  }
  .child-group.child-cathy, .month-section.child-cathy{ --child-c:#C4557E; --child-bg:#FAEAF1; border-color:#EFC7D9; }
  .child-group.child-rina, .month-section.child-rina{ --child-c:#3B7EA8; --child-bg:#E6F0F6; border-color:#BFDCEC; }
  .child-group.child-other, .month-section.child-other{ --child-c:var(--ink-soft); --child-bg:var(--paper-deep); }
  .plant-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(92px, 1fr));
    gap:10px;
  }
  .plant-card{
    position:relative;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 8px 10px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:transform .15s ease, border-color .15s ease;
  }
  .plant-card:hover{ transform:translateY(-2px); }
  .plant-card .emoji{ font-size:28px; line-height:1; margin-bottom:6px; }
  .plant-card .name{ font-size:12.5px; font-weight:700; color:var(--ink); word-break:break-word; margin-bottom:2px; }
  .plant-card .status{ font-size:10.5px; color:var(--ink-soft); }
  .plant-card .remove{
    position:absolute; top:4px; right:6px;
    font-size:11px; opacity:.35; padding:2px;
  }
  .plant-card .remove:hover{ opacity:1; }
  .plant-card.seed{ border-style:dashed; }
  .plant-card.bloom{ border-color:var(--child-c, var(--study)); background:var(--child-bg, var(--study-bg)); }
  .plant-card.healthy{ border-color:var(--child-c, var(--study)); }
  .plant-card.fading{ border-color:#C9A227; }
  .plant-card.fading .status{ color:#9C7F1E; }
  .plant-card.wilting{ border-color:#B96B77; }
  .plant-card.wilting .status{ color:#B96B77; }
  .plant-card.dead{ border-color:#9a958c; background:#F1EEE7; opacity:.85; }
  .plant-card.dead .status{ color:#8a857c; font-weight:700; }
  .habit-add{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .habit-add input{
    flex:1;
    max-width:240px;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .child-btn{
    flex:1;
    padding:10px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-weight:900;
    font-size:15px;
    font-family:'Noto Serif TC',serif;
    cursor:pointer;
  }
  .child-btn.child-cathy.active{ border-color:#C4557E; background:#FAEAF1; color:#C4557E; }
  .child-btn.child-rina.active{ border-color:#3B7EA8; background:#E6F0F6; color:#3B7EA8; }
  .child-btn.child-other.active{ border-color:var(--ink-soft); background:var(--paper-deep); color:var(--ink-soft); }
  .habit-add button{
    padding:8px 16px;
    border-radius:8px;
    border:1px solid var(--study);
    background:var(--study-bg);
    color:var(--study);
    font-weight:700;
    cursor:pointer;
    font-size:14px;
  }
  .month-section{
    margin-bottom:24px;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 14px 16px;
    background:#fff;
  }
  .habit-month-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .habit-month-nav button{
    border:1px solid var(--line);
    background:#fff;
    border-radius:8px;
    padding:4px 12px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-soft);
  }
  .habit-month-nav .label{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    color:var(--study);
    font-size:16px;
  }
  .habit-month-nav .child-name{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    color:var(--child-c, var(--study));
    font-size:16px;
    margin-left:4px;
  }
  .habit-table-wrap{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    box-shadow:var(--shadow);
  }
  table.habit-table{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.habit-table th, table.habit-table td{
    border-bottom:1px solid var(--line);
    padding:7px 5px;
    text-align:center;
    white-space:nowrap;
  }
  table.habit-table th.habit-name-col, table.habit-table td.habit-name-col{
    text-align:left;
    padding-left:12px;
    position:sticky;
    left:0;
    background:#fff;
    font-weight:700;
    color:var(--ink);
    min-width:110px;
  }
  table.habit-table th{ color:var(--ink-soft); font-weight:500; }
  table.habit-table td.today-col, table.habit-table th.today-col{ background:var(--study-bg); }
  table.habit-table td.mark{ color:var(--study); font-weight:700; }
  table.habit-table td.total-col, table.habit-table th.total-col{ font-weight:700; color:var(--study); }
  .habit-empty{ color:var(--ink-soft); font-size:13.5px; padding:16px; text-align:center; }
  .score-badge{
    display:inline-flex;
    align-items:baseline;
    gap:6px;
    background:var(--child-bg, var(--study-bg));
    color:var(--child-c, var(--study));
    font-weight:700;
    font-size:14px;
    padding:8px 16px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .score-badge b{ font-size:20px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 回 Ruby 的個人工作台</a>
  <h1>✅ 更好的自己習慣養成</h1>
  <p class="desc">紀錄小孩每天的學習習慣（例如：閱讀30分鐘、複習功課、練習圍棋）。每個習慣是一株小植物，點一下代表今天澆水（完成打卡）；太久沒澆水植物會慢慢枯萎，提醒你哪個習慣被忽略了。下面會自動累積成本月統計表。</p>

  <div class="child-tabs" id="childTabs"></div>

  <div id="habitToday"></div>
  <div class="habit-add">
    <input id="habitNewName" type="text" placeholder="新增習慣，例如：閱讀30分鐘" maxlength="30">
    <button id="habitAddBtn" type="button">＋ 新增</button>
  </div>

  <div id="habitMonthSections"></div>
</div>

<script>
  const API = '/api/study-habits';

  function pad2(n){ return n.toString().padStart(2, '0'); }
  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function monthStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const habitState = { habits: [], viewDate: new Date() };

  function daysSince(dateStr){
    if (!dateStr) return null;
    const [y, m, d] = dateStr.split('-').map(Number);
    const last = new Date(y, m - 1, d);
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    last.setHours(0, 0, 0, 0);
    return Math.round((now - last) / 86400000);
  }

  function plantStage(days){
    if (days === null) return { emoji: '🌱', label: '還沒開始', cls: 'seed' };
    if (days <= 0) return { emoji: '🌸', label: '今天已澆水', cls: 'bloom' };
    if (days === 1) return { emoji: '🌿', label: '昨天澆過水', cls: 'healthy' };
    if (days <= 3) return { emoji: '🍂', label: days + ' 天沒澆水', cls: 'fading' };
    if (days <= 6) return { emoji: '🥀', label: days + ' 天沒澆水', cls: 'wilting' };
    return { emoji: '💀', label: days + ' 天沒澆水，快枯掉了', cls: 'dead' };
  }

  const CHILD_GROUPS = ['Cathy', 'Rina', '其他'];
  const CHILD_SLUG = { Cathy: 'child-cathy', Rina: 'child-rina', '其他': 'child-other' };
  let activeChild = 'Cathy';
  try { activeChild = localStorage.getItem('studyHabitActiveChild') || 'Cathy'; } catch (e) {}
  const urlChild = new URLSearchParams(location.search).get('who');
  if (urlChild === 'Cathy' || urlChild === 'Rina') {
    activeChild = urlChild;
    try { localStorage.setItem('studyHabitActiveChild', activeChild); } catch (e) {}
  }

  function groupByChild(habits){
    const groups = { Cathy: [], Rina: [], '其他': [] };
    habits.forEach(h => {
      (groups[h.child] || groups['其他']).push(h);
    });
    return groups;
  }

  async function loadHabits(){
    habitState.habits = await fetch(API).then(r => r.json());
    renderTabs();
    renderPlants();
    loadHabitMonth();
  }

  function renderTabs(){
    const groups = groupByChild(habitState.habits);
    const tabs = CHILD_GROUPS.filter(name => name !== '其他' || groups[name].length > 0);
    if (!tabs.includes(activeChild)) activeChild = tabs[0] || 'Cathy';
    const container = document.getElementById('childTabs');
    container.innerHTML = tabs.map(name =>
      `<button type="button" class="child-btn ${CHILD_SLUG[name]} ${name === activeChild ? 'active' : ''}" data-child="${name}">${escapeHtml(name)}</button>`
    ).join('');
    container.querySelectorAll('.child-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeChild = btn.dataset.child;
        try { localStorage.setItem('studyHabitActiveChild', activeChild); } catch (e) {}
        renderTabs();
        renderPlants();
        loadHabitMonth();
      });
    });
  }

  function plantCardHtml(h){
    const stage = plantStage(daysSince(h.lastDate));
    return `<div class="plant-card ${stage.cls}" data-id="${h.id}" title="點一下：完成/取消今天的打卡">
      <span class="remove" data-remove="${h.id}" title="刪除這個習慣">✕</span>
      <div class="emoji">${stage.emoji}</div>
      <div class="name">${escapeHtml(h.name)}</div>
      <div class="status">${stage.label}</div>
    </div>`;
  }

  function renderPlants(){
    const wrap = document.getElementById('habitToday');
    const list = groupByChild(habitState.habits)[activeChild] || [];
    if (list.length === 0) {
      wrap.innerHTML = `<div class="child-group ${CHILD_SLUG[activeChild]}"><p class="habit-empty" style="padding:0;">${escapeHtml(activeChild)} 還沒有習慣項目，先在下面新增一個吧。</p></div>`;
      return;
    }
    const doneToday = list.filter(h => daysSince(h.lastDate) === 0).length;
    wrap.innerHTML = `<div class="child-group ${CHILD_SLUG[activeChild]}">
      <div class="score-badge">✨ 今天分數：<b>${doneToday}</b> 分（${doneToday}／${list.length} 項）</div>
      <div class="plant-grid">${list.map(plantCardHtml).join('')}</div>
    </div>`;
    wrap.querySelectorAll('.plant-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.dataset.remove) return;
        toggleHabit(card.dataset.id);
      });
    });
    wrap.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        removeHabit(btn.dataset.remove);
      });
    });
  }

  async function toggleHabit(id){
    const date = todayStr();
    await fetch(API + '/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ habitId: id, date })
    });
    loadHabits();
  }

  async function removeHabit(id){
    const h = habitState.habits.find(x => x.id === id);
    const label = h ? `${h.child || '其他'} 的『${h.name}』` : '這個習慣';
    if (!confirm(`確定要刪除${label}嗎？相關紀錄也會一併刪除。`)) return;
    await fetch(API, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    loadHabits();
  }

  async function addHabit(){
    const input = document.getElementById('habitNewName');
    const name = input.value.trim();
    if (!name) return;
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, child: activeChild })
    });
    const data = await res.json();
    if (data.id) {
      input.value = '';
      loadHabits();
    }
  }
  document.getElementById('habitAddBtn').addEventListener('click', addHabit);
  document.getElementById('habitNewName').addEventListener('keydown', e => { if (e.key === 'Enter') addHabit(); });

  async function loadHabitMonth(){
    const m = monthStr(habitState.viewDate);
    const data = await fetch(API + '/month?month=' + m).then(r => r.json());
    renderMonthSections(data, m);
  }

  function habitTableHtml(habits, logs, month){
    const [y, mo] = month.split('-').map(Number);
    const daysInMonth = new Date(y, mo, 0).getDate();
    const isCurrentMonth = monthStr(new Date()) === month;
    const todayDate = new Date().getDate();

    let thead = '<tr><th class="habit-name-col">習慣</th>';
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = isCurrentMonth && d === todayDate;
      thead += `<th class="${isToday ? 'today-col' : ''}">${d}</th>`;
    }
    thead += '<th class="total-col">完成</th></tr>';

    let tbody = '';
    habits.forEach(h => {
      const doneDates = new Set(logs[h.id] || []);
      let row = `<tr><td class="habit-name-col">${escapeHtml(h.name)}</td>`;
      let count = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${pad2(mo)}-${pad2(d)}`;
        const done = doneDates.has(dateStr);
        if (done) count++;
        const isToday = isCurrentMonth && d === todayDate;
        row += `<td class="${done ? 'mark' : ''} ${isToday ? 'today-col' : ''}">${done ? '✓' : ''}</td>`;
      }
      row += `<td class="total-col">${count}/${daysInMonth}</td></tr>`;
      tbody += row;
    });

    return `<table class="habit-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }

  function renderMonthSections(data, month){
    const container = document.getElementById('habitMonthSections');
    const monthLabelText = `${habitState.viewDate.getFullYear()}年${habitState.viewDate.getMonth() + 1}月`;
    const list = groupByChild(data.habits || [])[activeChild] || [];
    const monthlyTotal = list.reduce((sum, h) => sum + ((data.logs[h.id] || []).length), 0);
    const bodyHtml = list.length === 0
      ? `<p class="habit-empty">目前還沒有習慣項目可以統計。</p>`
      : `<div class="score-badge">📊 本月分數：<b>${monthlyTotal}</b> 分</div>
         <div class="habit-table-wrap">${habitTableHtml(list, data.logs, month)}</div>`;
    container.innerHTML = `<div class="month-section ${CHILD_SLUG[activeChild]}">
      <div class="habit-month-nav">
        <button class="habit-prev-month" type="button">‹</button>
        <span class="label">${monthLabelText}</span>
        <span class="child-name">${escapeHtml(activeChild)}</span>
        <button class="habit-next-month" type="button">›</button>
      </div>
      ${bodyHtml}
    </div>`;
    container.querySelector('.habit-prev-month').addEventListener('click', () => {
      habitState.viewDate.setMonth(habitState.viewDate.getMonth() - 1);
      loadHabitMonth();
    });
    container.querySelector('.habit-next-month').addEventListener('click', () => {
      habitState.viewDate.setMonth(habitState.viewDate.getMonth() + 1);
      loadHabitMonth();
    });
  }

  loadHabits();
</script>
</body>
</html>
