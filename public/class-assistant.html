<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美術課上課助手</title>
<style>
  :root{
    --paper:#F7F3EC;
    --ink:#2E2B26;
    --ink-soft:#6B6459;
    --line:#E3DACB;
    --sage:#587361;
    --sage-dark:#3F5548;
    --ochre:#C68A3E;
    --clay:#B4543A;
    --sky:#3E6E8E;
    --card:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:20px 16px 60px;}

  header.top{
    display:flex;flex-direction:column;gap:6px;
    padding:18px 20px;background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    margin-bottom:16px;
  }
  .title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .brush{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;color:var(--ink-soft);letter-spacing:.5px;
  }
  .brush svg{width:16px;height:16px;flex-shrink:0;}
  .week-badge{font-size:13px;font-weight:700;color:var(--sage-dark);white-space:nowrap;}
  .now-date-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;
  }
  .now-date-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .now-date{font-size:14px;color:var(--ink-soft);}
  .today-note{font-size:12px;}
  .today-note .holiday-badge{color:var(--clay);font-weight:700;}
  .today-note .exam-badge{color:var(--ochre);font-weight:700;}
  .date-picker{display:flex;align-items:center;gap:6px;}
  .date-picker label{font-size:13px;color:var(--ink-soft);}
  .date-picker input[type="date"]{
    font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);
  }
  .calendar-link{
    align-self:flex-start;font-size:12px;color:var(--sage-dark);background:none;border:none;
    padding:2px 0;margin-top:2px;cursor:pointer;text-decoration:underline;
  }
  .semester-calendar{
    margin-top:6px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);
    border-radius:10px;max-height:240px;overflow-y:auto;
    display:flex;flex-direction:column;gap:3px;
  }
  .week-row{
    display:flex;flex-wrap:wrap;column-gap:8px;row-gap:2px;align-items:baseline;
    font-size:12px;padding:3px 4px;border-radius:6px;
  }
  .week-row b{color:var(--ink);}
  .week-row .week-range{color:var(--ink-soft);}
  .week-row .week-notes{color:var(--clay);font-weight:600;}
  .class-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:4px;flex-wrap:wrap;
  }
  .class-name{font-size:26px;font-weight:700;color:var(--sage-dark);}
  .class-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  select.override{
    font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);
  }
  .class-buttons{
    display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px;
  }
  .class-btn{
    flex:1;min-width:56px;font-size:14px;font-weight:600;padding:9px 6px;
    border-radius:10px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;transition:all .15s;
  }
  .class-btn.active{
    background:var(--sage);border-color:var(--sage);color:#fff;
  }
  .no-class-banner{
    background:#FBF0E4;border:1px dashed var(--ochre);color:#7A5522;
    padding:10px 14px;border-radius:10px;font-size:14px;margin-top:10px;
  }

  nav.tabs{
    display:flex;gap:8px;margin-bottom:16px;
  }
  nav.tabs button{
    flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-soft);font-size:15px;font-weight:600;
    cursor:pointer;transition:all .15s;
  }
  nav.tabs button.active{
    background:var(--sage);border-color:var(--sage);color:#fff;
  }

  section.panel{display:none;}
  section.panel.active{display:block;}

  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;gap:10px;flex-wrap:wrap;
  }
  .toolbar .count{font-size:13px;color:var(--ink-soft);}
  .sort-btn{
    font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;
  }
  .sort-btn.active{background:var(--sage);border-color:var(--sage);color:#fff;}

  .roster{display:flex;flex-direction:column;gap:8px;}
  .student-row{
    display:flex;flex-direction:column;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;
  }
  .student-row-top{display:flex;align-items:center;gap:12px;}
  .student-row-controls{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap;
  }
  .late-total{font-size:11px;color:var(--clay);font-weight:700;white-space:nowrap;}
  .seat{
    width:34px;height:34px;border-radius:50%;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;color:var(--sage-dark);flex-shrink:0;
    border:1px solid var(--line);
  }
  .s-name{font-size:15px;font-weight:600;flex:1;min-width:0;}
  .avatar{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;cursor:pointer;
    background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-size:16px;color:var(--ink-soft);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}

  /* attendance controls */
  .att-controls{display:flex;gap:6px;}
  .att-btn{
    font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;font-weight:600;
  }
  .att-btn.late.on{background:var(--ochre);border-color:var(--ochre);color:#fff;}
  .att-btn.absent.on{background:var(--clay);border-color:var(--clay);color:#fff;}

  /* behavior controls */
  .beh-controls{display:flex;align-items:center;gap:8px;}
  .beh-btn{
    width:32px;height:32px;border-radius:8px;border:none;
    font-size:18px;font-weight:700;cursor:pointer;color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .beh-minus{background:var(--clay);}
  .beh-plus{background:var(--sage);}
  .beh-score{
    min-width:28px;text-align:center;font-weight:700;font-size:15px;
  }
  .beh-score.pos{color:var(--sage-dark);}
  .beh-score.neg{color:var(--clay);}

  .footer-note{
    margin-top:22px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.6;
  }

  .summary-bar{
    display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;
  }
  .summary-chip{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:13px;color:var(--ink-soft);
  }
  .summary-chip b{color:var(--ink);}

  /* artwork grading */
  .assignment-bar{display:flex;gap:8px;margin-bottom:14px;}
  .assignment-bar select{flex:1;}

  .tier-buttons{display:flex;gap:8px;margin-bottom:16px;}
  .tier-btn{
    flex:1;border:none;border-radius:12px;padding:14px 6px;color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;font-weight:700;
  }
  .tier-btn span{font-size:11px;font-weight:400;opacity:.9;}
  .tier-btn.superb{background:var(--clay);}
  .tier-btn.great{background:var(--ochre);}
  .tier-btn.good{background:var(--sky);}

  .section-title{font-size:14px;font-weight:700;color:var(--ink-soft);margin:6px 0 8px;overflow:auto;}

  .thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;}
  .thumb-card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
    position:relative;
  }
  .thumb-card img{width:100%;height:90px;object-fit:cover;display:block;}
  .thumb-tier-tag{
    position:absolute;top:4px;left:4px;font-size:10px;font-weight:700;color:#fff;
    padding:2px 6px;border-radius:6px;
  }
  .thumb-tier-tag.superb{background:var(--clay);}
  .thumb-tier-tag.great{background:var(--ochre);}
  .thumb-tier-tag.good{background:var(--sky);}

  .assign-form{
    background:var(--card);border:1px solid var(--sage);border-radius:12px;padding:14px;margin-bottom:12px;
  }
  .assign-form img{width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin-bottom:10px;background:var(--paper);}
  .assign-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .assign-row label{font-size:13px;color:var(--ink-soft);width:56px;flex-shrink:0;}
  .assign-row input, .assign-row select{
    flex:1;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
  }
  .assign-actions{display:flex;gap:8px;}
  .assign-actions button{
    flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;cursor:pointer;
  }
  .assign-confirm{background:var(--sage);color:#fff;}
  .assign-cancel{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line) !important;}

  .art-list{display:flex;flex-direction:column;gap:8px;}
  .art-row{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px;
  }
  .art-row img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .art-row-main{flex:1;min-width:0;}
  .art-row-name{font-size:14px;font-weight:700;}
  .art-row-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .art-tier-badge{font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:6px;display:inline-block;margin-right:6px;}
  .art-tier-badge.superb{background:var(--clay);}
  .art-tier-badge.great{background:var(--ochre);}
  .art-tier-badge.good{background:var(--sky);}
  .art-row input.score-input{width:52px;font-size:14px;padding:5px;border-radius:6px;border:1px solid var(--line);text-align:center;}
  .art-row-remove{background:none;border:none;color:var(--clay);font-size:18px;cursor:pointer;padding:4px;}
  .group-heading{font-size:13px;font-weight:700;color:var(--ink-soft);margin:10px 0 2px;}

  .seat-grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px;
  }
  .seat-cell{
    display:flex;flex-direction:column;
    border-radius:8px;overflow:hidden;cursor:pointer;text-align:center;
    border:2px solid transparent;
  }
  .seat-cell .seat-photo{
    width:100%;aspect-ratio:1;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--ink-soft);overflow:hidden;
  }
  .seat-cell .seat-photo img{width:100%;height:100%;object-fit:cover;}
  .seat-cell .seat-info{padding:3px 2px;color:#fff;}
  .seat-cell .seat-num{font-size:13px;font-weight:700;line-height:1.2;}
  .seat-cell .seat-name{font-size:10.5px;line-height:1.2;opacity:.95;word-break:break-all;}
  .seat-cell.submitted{border-color:var(--sage);}
  .seat-cell.submitted .seat-info{background:var(--sage);}
  .seat-cell.missing{border-color:var(--clay);}
  .seat-cell.missing .seat-info{background:var(--clay);}
  .seat-cell:active{opacity:0.75;}

  .student-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  }
  .student-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;cursor:pointer;text-align:center;
  }
  .student-card .photo{
    width:100%;aspect-ratio:1;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-size:34px;color:var(--ink-soft);overflow:hidden;
  }
  .student-card .photo img{width:100%;height:100%;object-fit:cover;}
  .student-card .info{padding:6px 4px 8px;}
  .student-card .info .num{font-size:12px;color:var(--ink-soft);}
  .student-card .info .name{font-size:15px;font-weight:700;margin-top:1px;}
  .student-card:active{opacity:0.75;}

  .photo-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .photo-modal-box{
    background:var(--card);border-radius:16px;padding:16px;
    max-width:420px;width:100%;text-align:center;
  }
  .photo-modal-box img{
    width:100%;max-height:60vh;object-fit:contain;border-radius:10px;
    background:var(--paper);
  }
  .photo-modal-name{font-size:18px;font-weight:700;margin-top:12px;}
  .photo-modal-actions{display:flex;gap:8px;margin-top:14px;}
  .photo-modal-actions button{
    flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:15px;cursor:pointer;
  }
  .photo-modal-retake{background:var(--sage);color:#fff;}
  .photo-modal-close{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line) !important;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="title-row">
      <div class="brush">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20c4-1 6-3 8-7l7-9-4 1-9 7c-4 2-6 4-7 8z"/><circle cx="18" cy="4.5" r="1.4"/></svg>
        美術課上課助手
      </div>
      <div class="week-badge" id="weekBadge"></div>
    </div>
    <div class="now-date-row">
      <div class="now-date-left">
        <span class="now-date" id="nowDate">—</span>
        <span class="today-note" id="todayNote"></span>
      </div>
      <div class="date-picker">
        <label for="dateInput">查詢日期</label>
        <input type="date" id="dateInput">
      </div>
    </div>
    <button type="button" class="calendar-link" id="calendarToggleBtn">📅 學期行事曆(共21週)</button>
    <div class="semester-calendar" id="semesterCalendar" hidden></div>

      <div>
        <div class="class-name" id="className">載入中…</div>
        <div class="class-sub" id="classSub"></div>
      </div>
    </div>
    <div class="class-buttons" id="classButtons"></div>
    <div class="no-class-banner" id="noClassBanner" style="display:none;">

    </div>
  </header>

  <nav class="tabs">
    <button data-tab="attendance" class="active">課堂表現</button>
    <button data-tab="artwork">作品評分</button>
    <button data-tab="students">認識學生</button>
  </nav>

  <section class="panel active" id="panel-attendance">
    <div class="toolbar">
      <span class="count" id="attCount">30 位學生</span>
    </div>
    <div class="summary-bar">
      <div class="summary-chip">遲到 <b id="lateCount">0</b> 人</div>
      <div class="summary-chip">缺席 <b id="absentCount">0</b> 人</div>
      <button class="sort-btn" id="scoreDescSortBtn">依加分排序</button>
      <button class="sort-btn" id="scoreAscSortBtn">依扣分排序</button>
      <button class="sort-btn" id="seatSortBtn">依座號排序</button>
    </div>
    <div class="roster" id="attRoster"></div>
  </section>

  <section class="panel" id="panel-artwork">

    <div class="assignment-bar">
      <select class="override" id="assignmentSelect"></select>
      <button class="sort-btn" id="renameAssignmentBtn">✎ 改名</button>
      <button class="sort-btn" id="addAssignmentBtn">＋ 新增作業</button>
    </div>

    <div class="tier-buttons">
      <button class="tier-btn superb" data-tier="特優">📷 特優<span>拍照 / 上傳</span></button>
      <button class="tier-btn great" data-tier="優等">📷 優等<span>拍照 / 上傳</span></button>
      <button class="tier-btn good" data-tier="甲等">📷 甲等<span>拍照 / 上傳</span></button>
    </div>
    <button class="sort-btn" id="pickFromAlbumBtn" style="width:100%;margin-top:8px;">🖼 從相簿選多張(不開相機)</button>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

    <div class="section-title" style="margin-top:16px;">
      全班繳交狀況
      <span style="float:right;font-weight:400;font-size:12px;color:var(--ink-soft);">
        <span style="display:inline-block;width:10px;height:10px;background:var(--sage);border-radius:3px;"></span> 已交
        <span style="display:inline-block;width:10px;height:10px;background:var(--clay);border-radius:3px;margin-left:8px;"></span> 未交
      </span>
    </div>
    <div class="seat-grid" id="seatStatusGrid"></div>

    <div id="unassignedSection" style="display:none;">
      <div class="section-title">待歸戶照片(<span id="unassignedCount">0</span> 張)— 點照片來指定座號</div>
      <div class="thumb-grid" id="unassignedGrid"></div>
    </div>

    <div class="section-title" style="margin-top:18px;">
      已建檔作品
      <button class="sort-btn" id="artSortBtn" style="float:right;">依等第分區</button>
    </div>
    <div class="art-list" id="assignedList"></div>
  </section>

  <section class="panel" id="panel-students">
    <div class="toolbar">
      <span class="count" id="studentsCount">30 位學生</span>
    </div>
    <div class="student-grid" id="studentGrid"></div>
  </section>

  <div class="footer-note">
    出席、秩序評分、作業成績都會即時存到資料庫。<br>
    只有「待歸戶照片」(已拍但還沒指定座號)是暫存在這個分頁裡,重新整理會消失,記得拍完就盡快指定座號。
  </div>
</div>

<script>
/* ---------- App state ---------- */
let currentClassId = null;
let currentClasses = [];   // classes list from the latest /api/schedule response
let attendance = {};   // { studentId: 'late' | 'absent' }
let behavior = {};     // { studentId: number }
let lateTotals = {};   // { studentId: cumulative late count since records began }
let selectedDate = "";  // "YYYY-MM-DD", defaults to today, changeable via the date picker
let rosterSortMode = "seat"; // "seat" | "scoreDesc" | "scoreAsc"
let rosterCache = [];

let audioCtx = null;
function playBeep(freq, volume){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    osc.start(now);
    osc.stop(now + 0.13);
  }catch(e){}
}

function todayStr(){
  const now = new Date();
  return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
}

async function apiGet(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error("api error " + path);
  return await res.json();
}
async function apiPost(path, body){
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("api error " + path);
  return await res.json();
}
async function apiDelete(path, body){
  const res = await fetch(path, {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return res.ok;
}

async function loadRosterFromApi(classId){
  if(!classId) return [];
  try{
    const roster = await apiGet(`/api/roster?classId=${encodeURIComponent(classId)}`);
    if(roster && roster.length) return roster;
  }catch(e){}
  return [];
}

function studentsFor(classId){
  return rosterCache;
}

function pad(n){ return n.toString().padStart(2,"0"); }

/* ---------- 115學年度第一學期 行事曆(共21週，一律以週一~週五間的紅字為停課依據) ---------- */
const SEMESTER_START = Date.UTC(2026, 7, 31); // 8/31(一) 始業式
const SEMESTER_WEEKS = 21;
const SEMESTER_HOLIDAYS = [
  { date: "2026-09-25", label: "中秋節放假" },
  { date: "2026-09-28", label: "教師節放假" },
  { date: "2026-10-09", label: "國慶日補假" },
  { date: "2026-10-26", label: "光復節補假" },
  { date: "2026-12-21", label: "校慶運動會補假" },
  { date: "2026-12-25", label: "行憲紀念日放假" },
  { date: "2027-01-01", label: "元旦放假" }
];
const SEMESTER_EXAMS = [
  { start: "2026-11-05", end: "2026-11-06", label: "期中評量" },
  { start: "2027-01-14", end: "2027-01-15", label: "期末評量" }
];

function ymdOf(utcMs){
  const d = new Date(utcMs);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
}
function mdOf(ymd){
  const [, m, d] = ymd.split("-");
  return `${parseInt(m,10)}/${parseInt(d,10)}`;
}
function semesterWeekOf(ymd){
  const [y, m, d] = ymd.split("-").map(Number);
  const diffDays = Math.round((Date.UTC(y, m-1, d) - SEMESTER_START) / 86400000);
  if(diffDays < 0) return null;
  const week = Math.floor(diffDays / 7) + 1;
  return week <= SEMESTER_WEEKS ? week : null;
}
function holidayOn(ymd){
  return SEMESTER_HOLIDAYS.find(h => h.date === ymd) || null;
}
function examOn(ymd){
  return SEMESTER_EXAMS.find(e => ymd >= e.start && ymd <= e.end) || null;
}

function weekdayLabel(ymd){
  const [y, m, d] = ymd.split("-").map(Number);
  const wd = new Date(Date.UTC(y, m-1, d)).getUTCDay();
  return "日一二三四五六"[wd];
}

function renderNowDate(){
  const now = new Date();
  const ymd = todayStr();
  document.getElementById("nowDate").textContent =
    `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}(星期${weekdayLabel(ymd)}) ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const week = semesterWeekOf(ymd);
  let weekText = "";
  if(week){
    weekText = `第${week}週`;
  }else{
    const [y, m, d] = ymd.split("-").map(Number);
    const diffDays = Math.round((Date.UTC(y, m-1, d) - SEMESTER_START) / 86400000);
    if(diffDays < 0) weekText = `開學倒數${-diffDays}天`;
    else weekText = "本學期已結束";
  }
  document.getElementById("weekBadge").textContent = weekText;

  const holiday = holidayOn(ymd);
  const exam = examOn(ymd);
  let html = "";
  if(holiday) html += `<span class="holiday-badge">🔴 ${holiday.label}，今天不用上課</span>`;
  if(exam) html += `<span class="exam-badge">📝 今天${exam.label}</span>`;
  document.getElementById("todayNote").innerHTML = html;
}

function renderSemesterCalendar(){
  let html = "";
  for(let w = 1; w <= SEMESTER_WEEKS; w++){
    const weekStartMs = SEMESTER_START + (w-1) * 7 * 86400000;
    const weekEndMs = weekStartMs + 4 * 86400000; // 週一~週五
    const startYmd = ymdOf(weekStartMs), endYmd = ymdOf(weekEndMs);
    const notes = [];
    SEMESTER_HOLIDAYS.forEach(h => {
      if(h.date >= startYmd && h.date <= endYmd) notes.push(`🔴${mdOf(h.date)} ${h.label}`);
    });
    SEMESTER_EXAMS.forEach(e => {
      if(e.start >= startYmd && e.start <= endYmd){
        const range = e.start === e.end ? mdOf(e.start) : `${mdOf(e.start)}~${mdOf(e.end)}`;
        notes.push(`📝${range} ${e.label}`);
      }
    });
    html += `<div class="week-row"><b>第${w}週</b><span class="week-range">${mdOf(startYmd)}–${mdOf(endYmd)}</span>${notes.length ? `<span class="week-notes">${notes.join("；")}</span>` : ""}</div>`;
  }
  document.getElementById("semesterCalendar").innerHTML = html;
}

function renderHeader(scheduleResult){
  currentClasses = scheduleResult.classes || [];

  if(scheduleResult.current){
    currentClassId = scheduleResult.current.classId;
    const cls = scheduleResult.classes.find(c => c.id === currentClassId);
    document.getElementById("className").textContent = cls ? cls.name : currentClassId;
    document.getElementById("classSub").textContent = "依課表自動判斷・" + scheduleResult.current.label;
    document.getElementById("noClassBanner").style.display = "none";
  }else{
    document.getElementById("className").textContent = "目前沒有排課";
    document.getElementById("classSub").textContent = "請手動選擇要上課的班級";
    document.getElementById("noClassBanner").style.display = "block";
    currentClassId = null;
  }
  renderClassButtons();
}

function renderClassButtons(){
  const root = document.getElementById("classButtons");
  root.innerHTML = currentClasses.map(c =>
    `<button type="button" class="class-btn ${c.id === currentClassId ? "active" : ""}" data-id="${c.id}">${c.name}</button>`
  ).join("");
  root.querySelectorAll(".class-btn").forEach(btn => {
    btn.addEventListener("click", () => selectClass(btn.dataset.id));
  });
}

function selectClass(val){
  if(!val || val === currentClassId) return;
  currentClassId = val;
  const cls = currentClasses.find(c => c.id === val);
  document.getElementById("className").textContent = cls ? cls.name : val;
  document.getElementById("classSub").textContent = "手動選擇";
  document.getElementById("noClassBanner").style.display = "none";
  renderClassButtons();
  loadRoster();
}

/* ---------- Attendance + behavior (combined roster) ---------- */
function renderRoster(){
  const list = [...studentsFor(currentClassId)];
  if(rosterSortMode === "scoreDesc"){
    list.sort((a,b) => (behavior[b.id] || 0) - (behavior[a.id] || 0) || a.seat - b.seat);
  }else if(rosterSortMode === "scoreAsc"){
    list.sort((a,b) => (behavior[a.id] || 0) - (behavior[b.id] || 0) || a.seat - b.seat);
  }

  document.getElementById("scoreDescSortBtn").classList.toggle("active", rosterSortMode === "scoreDesc");
  document.getElementById("scoreAscSortBtn").classList.toggle("active", rosterSortMode === "scoreAsc");
  document.getElementById("seatSortBtn").classList.toggle("active", rosterSortMode === "seat");

  document.getElementById("attCount").textContent = list.length + " 位學生";
  const late = Object.values(attendance).filter(v => v === "late").length;
  const absent = Object.values(attendance).filter(v => v === "absent").length;
  document.getElementById("lateCount").textContent = late;
  document.getElementById("absentCount").textContent = absent;

  const root = document.getElementById("attRoster");
  root.innerHTML = list.map(st => {
    const state = attendance[st.id];
    const score = behavior[st.id] || 0;
    const scoreCls = score > 0 ? "pos" : (score < 0 ? "neg" : "");
    const avatarInner = st.photoKey ? `<img src="/api/photo/${st.photoKey}">` : "🧑";
    return `
      <div class="student-row">
        <div class="student-row-top">
          <div class="avatar" data-student="${st.id}" title="點一下拍/換大頭照">${avatarInner}</div>
          <div class="seat">${st.seat}</div>
          <div class="s-name">${st.name}</div>
        </div>
        <div class="student-row-controls">
          <div class="att-controls">
            <button class="att-btn late ${state==='late'?'on':''}" data-id="${st.id}" data-state="late">遲到</button>
            <button class="att-btn absent ${state==='absent'?'on':''}" data-id="${st.id}" data-state="absent">缺席</button>
          </div>
          <div class="late-total">累計遲到 ${lateTotals[st.id] || 0} 次</div>
          <div class="beh-controls">
            <button class="beh-btn beh-minus" data-id="${st.id}" data-delta="-1">－</button>
            <div class="beh-score ${scoreCls}">${score > 0 ? "+" + score : score}</div>
            <button class="beh-btn beh-plus" data-id="${st.id}" data-delta="1">＋</button>
          </div>
        </div>
      </div>`;
  }).join("");

  root.querySelectorAll(".avatar").forEach(el => {
    el.addEventListener("click", () => openStudentPhoto(el.dataset.student));
  });

  root.querySelectorAll(".att-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id, state = btn.dataset.state;
      const turningOn = attendance[id] !== state;
      attendance[id] = turningOn ? state : undefined;
      if(attendance[id] === undefined) delete attendance[id];
      renderRoster();
      const st = studentsFor(currentClassId).find(s => s.id === id);
      if(!st) return;
      if(turningOn){
        apiPost("/api/attendance", { classId: currentClassId, date: selectedDate, action: "setStatus", seats: [st.seat], status: state })
          .then(() => loadLateTotals())
          .catch(()=>{});
      }else{
        apiPost("/api/attendance", { classId: currentClassId, date: selectedDate, action: "clear", seats: [st.seat] })
          .then(() => loadLateTotals())
          .catch(()=>{});
      }
    });
  });

  root.querySelectorAll(".beh-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id, delta = parseInt(btn.dataset.delta, 10);
      behavior[id] = (behavior[id] || 0) + delta;
      playBeep(delta > 0 ? 880 : 330, 0.05);
      renderRoster();
      apiPost("/api/behavior", { studentId: id, date: selectedDate, delta }).catch(()=>{});
    });
  });
}

function openStudentPhoto(studentId){
  const st = rosterCache.find(s => s.id === studentId);
  if(!st) return;
  const existing = document.getElementById("photoModal");
  if(existing) existing.remove();

  const modal = document.createElement("div");
  modal.id = "photoModal";
  modal.className = "photo-modal";
  const photoInner = st.photoKey
    ? `<img src="/api/photo/${st.photoKey}">`
    : `<div class="photo" style="aspect-ratio:1;border-radius:10px;">🧑</div>`;
  modal.innerHTML = `
    <div class="photo-modal-box">
      ${photoInner}
      <div class="photo-modal-name">${st.seat} 號・${st.name}</div>
      <div class="photo-modal-actions">
        <button class="photo-modal-close" id="photoModalCloseBtn">關閉</button>
        <button class="photo-modal-retake" id="photoModalRetakeBtn">📷 重新拍照</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  modal.addEventListener("click", (e) => {
    if(e.target === modal) modal.remove();
  });
  document.getElementById("photoModalCloseBtn").addEventListener("click", () => modal.remove());
  document.getElementById("photoModalRetakeBtn").addEventListener("click", () => {
    modal.remove();
    openAvatarCamera(studentId);
  });
}

let camTargetSeat = null;

function loadImageFromBlob(blob){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}

async function normalizeToJpeg(blobOrFile){
  const img = await loadImageFromBlob(blobOrFile);
  const maxDim = 2000;
  let { width, height } = img;
  if(width > maxDim || height > maxDim){
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  canvas.getContext("2d").drawImage(img, 0, 0, width, height);
  return await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.85));
}

function addCapturedPhoto(jpegBlob, tier){
  const entry = {
    id: "p" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
    tier,
    assignmentId: currentAssignmentId,
    dataUrl: URL.createObjectURL(jpegBlob),
    photoKey: null
  };
  unassignedPhotos.push(entry);
  fetch(`/api/photo?ext=jpg&tier=${encodeURIComponent(tier)}`, {
    method: "POST", headers: { "Content-Type": "image/jpeg" }, body: jpegBlob
  }).then(r => r.ok ? r.json() : null)
    .then(res => { if(res) entry.photoKey = res.key; })
    .catch(()=>{});
  return entry;
}

let camAvatarStudentId = null;

function openAvatarCamera(studentId){
  startPhotoCapture("大頭照", { studentId });
}

async function uploadAvatar(studentId, blob){
  try{
    const res = await fetch(`/api/students/photo?studentId=${encodeURIComponent(studentId)}`, {
      method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob
    });
    if(!res.ok) return;
    const data = await res.json();
    const st = rosterCache.find(s => s.id === studentId);
    if(st) st.photoKey = data.key;
    renderRoster();
    renderStudentsGrid();
  }catch(e){}
}

// Hands photo capture off to the phone's native camera app via <input capture>,
// instead of building an in-page camera with getUserMedia — sidesteps per-site
// camera permission/hardware-lock issues that getUserMedia is prone to.
function startPhotoCapture(tier, opts){
  opts = opts || {};
  camTargetSeat = opts.seat || null;
  camAvatarStudentId = opts.studentId || null;
  pendingTier = tier;
  const input = document.getElementById("cameraInput");
  input.value = ""; // so picking the same shot twice in a row still fires "change"
  input.click();
}

async function handlePickedFiles(files){
  files = Array.from(files || []);
  if(!files.length) return;
  const avatarStudentId = camAvatarStudentId;
  const seat = camTargetSeat;
  camAvatarStudentId = null;
  camTargetSeat = null;
  for(const file of files){
    try{
      const jpegBlob = await normalizeToJpeg(file);
      if(avatarStudentId){
        await uploadAvatar(avatarStudentId, jpegBlob);
      }else{
        addCapturedPhoto(jpegBlob, pendingTier);
      }
    }catch(err){
      alert("這張照片讀取失敗，請換一張試試：" + file.name);
    }
  }
  renderUnassigned();
  if(seat && unassignedPhotos.length){
    const last = unassignedPhotos[unassignedPhotos.length - 1];
    openAssignForm(last.id, seat);
  }
}

document.getElementById("photoInput").addEventListener("change", (e) => handlePickedFiles(e.target.files));

function openAssignForm(photoId, presetSeat){
  const photo = unassignedPhotos.find(p => p.id === photoId);
  if(!photo) return;
  const existingForm = document.getElementById("assignFormWrap");
  if(existingForm) existingForm.remove();

  const wrap = document.createElement("div");
  wrap.id = "assignFormWrap";
  wrap.className = "assign-form";
  wrap.innerHTML = `
    <img src="${photo.dataUrl}">
    <div class="assign-row">
      <label>等第</label>
      <select id="assignTier">
        ${TIER_ORDER.map(t => `<option value="${t}" ${t===photo.tier?"selected":""}>${t}</option>`).join("")}
      </select>
    </div>
    <div class="assign-row">
      <label>座號</label>
      <input type="number" id="assignSeat" min="1" max="${rosterCache.length}" placeholder="輸入座號" value="${presetSeat || ''}">
    </div>
    <div class="assign-row">
      <label>分數</label>
      <input type="number" id="assignScore" value="${TIER_DEFAULT_SCORE[photo.tier]}">
    </div>
    <div class="assign-row">
      <label>備註</label>
      <input type="text" id="assignNote" placeholder="選填">
    </div>
    <div class="assign-actions">
      <button class="assign-cancel" id="assignCancelBtn">取消</button>
      <button class="assign-confirm" id="assignConfirmBtn">確認建檔</button>
    </div>
  `;
  document.getElementById("unassignedSection").after(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "center" });
  if(!presetSeat) document.getElementById("assignSeat").focus();

  document.getElementById("assignTier").addEventListener("change", (e) => {
    document.getElementById("assignScore").value = TIER_DEFAULT_SCORE[e.target.value];
  });

  document.getElementById("assignCancelBtn").addEventListener("click", () => wrap.remove());

  document.getElementById("assignConfirmBtn").addEventListener("click", async () => {
    const seat = parseInt(document.getElementById("assignSeat").value, 10);
    const st = rosterCache.find(s => s.seat === seat);
    if(!st){ alert("查無座號 " + seat); return; }
    const tier = document.getElementById("assignTier").value;
    const score = parseInt(document.getElementById("assignScore").value, 10);
    const note = document.getElementById("assignNote").value;

    if(!submissions[currentAssignmentId]) submissions[currentAssignmentId] = {};
    if(submissions[currentAssignmentId][st.id] && !confirm(`${st.name}(座號${st.seat})這項作業已經建檔過,要覆蓋嗎?`)){
      return;
    }
    submissions[currentAssignmentId][st.id] = { tier, score, note, dataUrl: photo.dataUrl, photoKey: photo.photoKey };
    unassignedPhotos = unassignedPhotos.filter(p => p.id !== photoId);
    wrap.remove();
    renderUnassigned();
    renderAssignedList();

    apiPost("/api/submissions", {
      assignmentId: currentAssignmentId,
      classId: currentClassId,
      seat,
      tier, score, note,
      photoKey: photo.photoKey
    }).catch(()=>{});
  });
}

function renderSeatStatusGrid(){
  const data = submissions[currentAssignmentId] || {};
  const root = document.getElementById("seatStatusGrid");
  if(!root) return;
  root.innerHTML = rosterCache.map(st => {
    const done = !!data[st.id];
    const photoInner = st.photoKey ? `<img src="/api/photo/${st.photoKey}">` : "🧑";
    return `<div class="seat-cell ${done ? 'submitted' : 'missing'}" data-seat="${st.seat}">
      <div class="seat-photo">${photoInner}</div>
      <div class="seat-info">
        <div class="seat-num">${st.seat}</div>
        <div class="seat-name">${st.name}</div>
      </div>
    </div>`;
  }).join("");
  root.querySelectorAll(".seat-cell").forEach(cell => {
    cell.addEventListener("click", () => {
      chooseTierThenCapture(parseInt(cell.dataset.seat, 10));
    });
  });
}

function chooseTierThenCapture(seat){
  const st = rosterCache.find(s => s.seat === seat);
  if(!st) return;
  const existing = document.getElementById("tierPickerWrap");
  if(existing) existing.remove();

  const wrap = document.createElement("div");
  wrap.id = "tierPickerWrap";
  wrap.className = "assign-form";
  wrap.innerHTML = `
    <p style="margin:0 0 10px;font-weight:700;">${st.seat} 號・${st.name} — 選擇要拍的等第</p>
    <div class="tier-buttons">
      <button class="tier-btn superb" data-tier="特優">特優</button>
      <button class="tier-btn great" data-tier="優等">優等</button>
      <button class="tier-btn good" data-tier="甲等">甲等</button>
    </div>
    <div class="assign-actions" style="margin-top:10px;">
      <button class="assign-cancel" id="tierPickerCancelBtn">取消</button>
    </div>
  `;
  document.getElementById("seatStatusGrid").after(wrap);
  wrap.querySelectorAll(".tier-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      wrap.remove();
      startPhotoCapture(btn.dataset.tier, { seat });
    });
  });
  document.getElementById("tierPickerCancelBtn").addEventListener("click", () => wrap.remove());
}

function renderAssignedList(){
  renderSeatStatusGrid();
  const data = submissions[currentAssignmentId] || {};
  const entries = Object.keys(data).map(studentId => {
    const st = rosterCache.find(s => s.id === studentId);
    return { studentId, student: st, ...data[studentId] };
  }).filter(e => e.student);

  const root = document.getElementById("assignedList");
  if(!entries.length){
    root.innerHTML = `<div class="class-sub" style="padding:10px 2px;">這項作業還沒有建檔的作品。</div>`;
    return;
  }

  function rowHtml(e){
    const imgSrc = e.photoKey ? `/api/photo/${e.photoKey}` : (e.dataUrl || "");
    return `
      <div class="art-row" data-student="${e.studentId}">
        <img src="${imgSrc}">
        <div class="art-row-main">
          <div class="art-row-name">${e.student.seat} 號・${e.student.name}</div>
          <div class="art-row-meta">
            <span class="art-tier-badge ${TIER_CLASS[e.tier]}">${e.tier}</span>
            ${e.note ? e.note : ""}
          </div>
        </div>
        <input type="number" class="score-input" value="${e.score}" data-student="${e.studentId}">
        <button class="art-row-remove" data-student="${e.studentId}" title="刪除">✕</button>
      </div>`;
  }

  let html = "";
  if(artSortByTier){
    TIER_ORDER.forEach(tier => {
      const group = entries.filter(e => e.tier === tier).sort((a,b) => a.student.seat - b.student.seat);
      if(group.length){
        html += `<div class="group-heading">${tier}(${group.length})</div>`;
        html += group.map(rowHtml).join("");
      }
    });
  }else{
    entries.sort((a,b) => a.student.seat - b.student.seat);
    html = entries.map(rowHtml).join("");
  }
  root.innerHTML = html;

  root.querySelectorAll(".score-input").forEach(inp => {
    inp.addEventListener("change", (e) => {
      const sid = e.target.dataset.student;
      const score = parseInt(e.target.value, 10) || 0;
      submissions[currentAssignmentId][sid].score = score;
      apiPost("/api/submissions/score", { assignmentId: currentAssignmentId, studentId: sid, score }).catch(()=>{});
    });
  });
  root.querySelectorAll(".art-row-remove").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const sid = e.target.dataset.student;
      const st = rosterCache.find(s => s.id === sid);
      if(confirm(`刪除 ${st.name} 這項作業的建檔紀錄?`)){
        delete submissions[currentAssignmentId][sid];
        renderAssignedList();
        apiDelete("/api/submissions", { assignmentId: currentAssignmentId, studentId: sid }).catch(()=>{});
      }
    });
  });
}

async function loadSubmissionsForCurrentAssignment(){
  if(!currentAssignmentId){ renderAssignedList(); return; }
  try{
    const list = await apiGet(`/api/submissions?assignmentId=${encodeURIComponent(currentAssignmentId)}`);
    const map = {};
    list.forEach(r => {
      map[r.studentId] = { tier: r.tier, score: r.score, note: r.note, photoKey: r.photoKey };
    });
    submissions[currentAssignmentId] = map;
  }catch(e){
    if(!submissions[currentAssignmentId]) submissions[currentAssignmentId] = {};
  }
  renderAssignedList();
}

document.getElementById("artSortBtn").addEventListener("click", () => {
  artSortByTier = !artSortByTier;
  document.getElementById("artSortBtn").textContent = artSortByTier ? "依等第分區" : "依座號排序";
  renderAssignedList();
});

async function loadRoster(){
  rosterCache = await loadRosterFromApi(currentClassId);

  selectedDate = todayStr();
  const dateInput = document.getElementById("dateInput");
  dateInput.max = selectedDate;
  dateInput.value = selectedDate;
  await loadAttendanceAndBehaviorForDate();
  await loadLateTotals();

  renderStudentsGrid();
  await loadAssignments();
  renderUnassigned();
  await loadSubmissionsForCurrentAssignment();
}

/* ---------- Init ---------- */
(async function init(){
  renderNowDate();
  setInterval(renderNowDate, 60000);
  renderSemesterCalendar();
  const scheduleResult = await tryFetchSchedule();
  renderHeader(scheduleResult);
  await loadRoster();
})();
</script>
</body>
