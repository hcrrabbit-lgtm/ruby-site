<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美術課上課助手</title>
<style>
  :root{
    --paper:#F7F3EC;
    --ink:#2E2B26;
    --ink-soft:#6B6459;
    --line:#E3DACB;
    --sage:#587361;
    --sage-dark:#3F5548;
    --ochre:#C68A3E;
    --clay:#B4543A;
    --sky:#3E6E8E;
    --card:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:20px 16px 60px;}

  header.top{
    display:flex;flex-direction:column;gap:6px;
    padding:18px 20px;background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    margin-bottom:16px;
  }
  .title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .brush{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;color:var(--ink-soft);letter-spacing:.5px;
  }
  .brush svg{width:16px;height:16px;flex-shrink:0;}
  .week-badge{font-size:13px;font-weight:700;color:var(--sage-dark);white-space:nowrap;}
  .now-date-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;
  }
  .now-date-left{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .now-date{font-size:14px;color:var(--ink-soft);}
  .today-note{font-size:12px;}
  .today-note .holiday-badge{color:var(--clay);font-weight:700;}
  .today-note .exam-badge{color:var(--ochre);font-weight:700;}
  .date-picker{display:flex;align-items:center;gap:6px;}
  .date-picker label{font-size:13px;color:var(--ink-soft);}
  .date-picker input[type="date"]{
    font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);
  }
  .class-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:4px;flex-wrap:wrap;
  }
  .class-name{font-size:26px;font-weight:700;color:var(--sage-dark);}
  .class-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  select.override{
    font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);
  }
  .class-buttons{
    display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px;
  }
  .class-btn{
    flex:1;min-width:56px;font-size:14px;font-weight:600;padding:9px 6px;
    border-radius:10px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;transition:all .15s;
  }
  .class-btn.active{
    background:var(--sage);border-color:var(--sage);color:#fff;
  }
  .no-class-banner{
    background:#FBF0E4;border:1px dashed var(--ochre);color:#7A5522;
    padding:10px 14px;border-radius:10px;font-size:14px;margin-top:10px;
  }

  nav.tabs{
    display:flex;gap:8px;margin-bottom:16px;
  }
  nav.tabs button{
    flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-soft);font-size:15px;font-weight:600;
    cursor:pointer;transition:all .15s;
  }
  nav.tabs button.active{
    background:var(--sage);border-color:var(--sage);color:#fff;
  }

  section.panel{display:none;}
  section.panel.active{display:block;}

  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;gap:10px;flex-wrap:wrap;
  }
  .count{font-size:13px;color:var(--ink-soft);}
  .sort-btn{
    font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;
  }
  .sort-btn.active{background:var(--sage);border-color:var(--sage);color:#fff;}

  .roster{display:flex;flex-direction:column;gap:8px;}
  .student-row{
    display:flex;flex-direction:column;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;
  }
  .student-row-top{display:flex;align-items:center;gap:12px;}
  .student-row-controls{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-top:8px;border-top:1px solid var(--line);flex-wrap:wrap;
  }
  .late-total{font-size:11px;color:var(--clay);font-weight:700;white-space:nowrap;}
  .seat{
    width:34px;height:34px;border-radius:50%;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;color:var(--sage-dark);flex-shrink:0;
    border:1px solid var(--line);
  }
  .s-name{font-size:15px;font-weight:600;flex:1;min-width:0;}
  .avatar{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;cursor:pointer;
    background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-size:16px;color:var(--ink-soft);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}

  /* attendance controls */
  .att-controls{display:flex;gap:6px;}
  .att-btn{
    font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;font-weight:600;
  }
  .att-btn.late.on{background:var(--ochre);border-color:var(--ochre);color:#fff;}
  .att-btn.absent.on{background:var(--clay);border-color:var(--clay);color:#fff;}

  /* behavior controls */
  .beh-controls{display:flex;align-items:center;gap:8px;}
  .beh-btn{
    min-width:48px;height:32px;padding:0 10px;border-radius:8px;border:none;
    font-size:14px;font-weight:700;cursor:pointer;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .beh-minus{background:var(--clay);}
  .beh-plus{background:var(--sage);}
  .beh-undo-btn{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .footer-note{
    margin-top:22px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.6;
  }

  .summary-bar{
    display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;
  }
  .summary-chip{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:13px;color:var(--ink-soft);
  }
  .sort-group{
    display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;
  }
  .sort-label{font-size:13px;color:var(--ink-soft);}
  .summary-chip b{color:var(--ink);}

  /* artwork library */
  .assignment-buttons{
    display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-bottom:14px;
  }
  .assignment-btn{
    flex:1;min-width:72px;font-size:14px;font-weight:600;padding:9px 10px;
    border-radius:10px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;transition:all .15s;
  }
  .assignment-btn.active{
    background:var(--sage);border-color:var(--sage);color:#fff;
  }

  .section-title{font-size:14px;font-weight:700;color:var(--ink-soft);margin:6px 0 8px;overflow:auto;}

  .assign-form{
    background:var(--card);border:1px solid var(--sage);border-radius:12px;padding:14px;margin-bottom:12px;
  }
  .assign-form img{width:100%;max-height:220px;object-fit:contain;border-radius:8px;margin-bottom:10px;background:var(--paper);}
  .assign-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .assign-row label{font-size:13px;color:var(--ink-soft);width:56px;flex-shrink:0;}
  .assign-row input, .assign-row select{
    flex:1;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
  }
  .assign-actions{display:flex;gap:8px;}
  .assign-actions button{
    flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;cursor:pointer;
  }
  .assign-confirm{background:var(--sage);color:#fff;}
  .assign-cancel{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line) !important;}

  .art-list{display:flex;flex-direction:column;gap:8px;}
  .art-row{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px;
  }
  .art-row img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .art-row-photo{cursor:pointer;}
  .art-row-main{flex:1;min-width:0;}
  .art-row-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .art-row-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .art-score-input{
    width:48px;font-size:13px;font-weight:400;padding:3px 4px;border-radius:6px;
    border:1px solid var(--line);text-align:center;background:var(--card);color:var(--ink);
  }
  .art-tier-badge{font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:6px;display:inline-block;margin-right:6px;}
  .art-tier-badge.superb{background:var(--clay);}
  .art-tier-badge.great{background:var(--ochre);}
  .art-tier-badge.good{background:var(--sky);}
  .art-row-noPhoto{
    width:52px;height:52px;border-radius:8px;flex-shrink:0;background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-soft);
  }
  .art-row-capture{
    background:var(--sage);color:#fff;border:none;border-radius:8px;padding:8px 10px;
    font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .art-row-remove{background:none;border:none;color:var(--clay);font-size:18px;cursor:pointer;padding:4px;}

  .student-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  }
  .student-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;cursor:pointer;text-align:center;
  }
  .student-card .photo{
    width:100%;aspect-ratio:1;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-size:34px;color:var(--ink-soft);overflow:hidden;
  }
  .student-card .photo img{width:100%;height:100%;object-fit:cover;}
  .student-card .info{padding:6px 4px 8px;}
  .student-card .info .num{font-size:12px;color:var(--ink-soft);}
  .student-card .info .name{font-size:15px;font-weight:700;margin-top:1px;}
  .student-card:active{opacity:0.75;}

  .schedule-note{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .schedule-table-wrap{
    overflow-x:auto;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .schedule-table{width:100%;table-layout:fixed;border-collapse:collapse;}
  .schedule-table th, .schedule-table td{
    border:1px solid var(--line);text-align:center;vertical-align:middle;
    padding:3px 1px;
  }
  .schedule-table thead th{
    background:var(--paper);color:var(--ink-soft);font-size:12px;font-weight:700;
    padding:6px 1px;
  }
  .schedule-table thead th.period-col-head{background:var(--card);border:none;}
  .schedule-table td.period-label{
    background:var(--paper);color:var(--ink-soft);font-size:9.5px;line-height:1.3;
    white-space:nowrap;
  }
  .schedule-table th.today-col, .schedule-table td.today-col{
    background:rgba(88,115,97,0.1);
  }
  .schedule-table td.pm-divider{border-top:3px solid var(--line);}
  .schedule-cell{
    display:inline-block;width:100%;
    background:var(--sage);color:#fff;border-radius:6px;
    padding:3px 1px;font-size:11px;font-weight:700;line-height:1.2;
  }
  .schedule-teacher{display:block;font-size:8px;font-weight:400;opacity:.9;white-space:nowrap;}

  .stats-toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:10px;flex-wrap:wrap;
  }
  .stats-search{
    flex:1;min-width:140px;font-size:14px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
  }
  .stats-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .stats-table-wrap{
    overflow-x:auto;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .stats-table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px;}
  .stats-table th, .stats-table td{
    border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap;
  }
  .stats-table thead th{
    background:var(--paper);color:var(--ink-soft);cursor:pointer;user-select:none;
  }
  .stats-table thead th.sorted{color:var(--sage-dark);}
  .stats-table thead th .col-sub{display:block;font-size:9px;font-weight:400;color:var(--ink-soft);}
  .stats-table thead th.assignment-col{padding:4px;}
  .stats-assignment-head{display:flex;align-items:center;justify-content:center;gap:4px;}
  .stats-rename-btn{
    border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:2px;
  }
  .stats-add-col{width:36px;}
  .stats-add-btn{
    width:26px;height:26px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--sage-dark);font-size:16px;font-weight:700;cursor:pointer;
  }
  .stats-table td.stats-name{text-align:left;font-weight:600;}
  .stats-table td.stats-seat{color:var(--ink-soft);}
  .stats-table td.stats-plus{color:var(--sage-dark);font-weight:600;}
  .stats-table td.stats-minus{color:var(--clay);font-weight:600;}
  .stats-table tfoot td{background:var(--paper);font-weight:700;}
  .stats-score-input{
    width:52px;font-size:13px;padding:4px;border-radius:6px;border:1px solid var(--line);
    text-align:center;background:var(--card);color:var(--ink);
  }
  .stats-score-cell{display:flex;align-items:center;justify-content:center;gap:4px;}
  .stats-photo-btn{
    width:24px;height:24px;border-radius:6px;border:1px solid var(--line);
    background:var(--paper);font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .stats-photo-btn.empty{opacity:0.3;cursor:default;}
  .stats-clickable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}
  .attend-detail-list{
    max-height:280px;overflow-y:auto;margin-top:10px;text-align:left;width:100%;
  }
  .attend-detail-item{
    padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;
  }
  .attend-detail-item:last-child{border-bottom:none;}
  .print-only{display:none;}
  @media print{
    body *{visibility:hidden;}
    #panel-stats, #panel-stats *{visibility:visible;}
    #panel-stats{position:absolute;left:0;top:0;width:100%;}
    .no-print{display:none !important;}
    .print-only{display:block;margin-bottom:10px;font-size:16px;font-weight:700;}
  }

  .photo-modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .photo-modal-box{
    background:var(--card);border-radius:16px;padding:16px;
    max-width:420px;width:100%;text-align:center;
  }
  .photo-modal-box img{
    width:100%;max-height:60vh;object-fit:contain;border-radius:10px;
    background:var(--paper);
  }
  .photo-modal-name{font-size:18px;font-weight:700;margin-top:12px;}
  .photo-modal-actions{display:flex;gap:8px;margin-top:14px;}
  .photo-modal-actions button{
    flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:15px;cursor:pointer;
  }
  .photo-modal-retake{background:var(--sage);color:#fff;}
  .photo-modal-close{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line) !important;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="title-row">
      <div class="brush">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20c4-1 6-3 8-7l7-9-4 1-9 7c-4 2-6 4-7 8z"/><circle cx="18" cy="4.5" r="1.4"/></svg>
        美術課上課助手
      </div>
      <div class="week-badge" id="weekBadge"></div>
    </div>
    <div class="now-date-row">
      <div class="now-date-left">
        <span class="now-date" id="nowDate">—</span>
        <span class="today-note" id="todayNote"></span>
      </div>
      <div class="date-picker">
        <label for="dateInput">查詢日期</label>
        <input type="date" id="dateInput">
      </div>
    </div>
    <div class="class-row">
      <div>
        <div class="class-name" id="className">載入中…</div>
        <div class="class-sub" id="classSub"></div>
      </div>
    </div>
    <div class="class-buttons" id="classButtons"></div>
    <div class="no-class-banner" id="noClassBanner" style="display:none;">
      這個時段課表上沒有排課,已切換為手動選擇班級。
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="attendance" class="active">課堂表現</button>
    <button data-tab="artwork">作品庫</button>
    <button data-tab="students">認識學生</button>
    <button data-tab="schedule">課表</button>
    <button data-tab="stats">統計表</button>
  </nav>

  <section class="panel active" id="panel-attendance">
    <div class="summary-bar">
      <span class="count" id="attCount">30 位學生</span>
      <div class="summary-chip">遲到 <b id="lateCount">0</b> 人</div>
      <div class="summary-chip">缺席 <b id="absentCount">0</b> 人</div>
    </div>
    <div class="sort-group">
      <span class="sort-label">排序方式</span>
      <button class="sort-btn" id="seatSortBtn">座號</button>
      <button class="sort-btn" id="scoreDescSortBtn">加分</button>
      <button class="sort-btn" id="scoreAscSortBtn">扣分</button>
    </div>
    <div class="roster" id="attRoster"></div>
  </section>

  <section class="panel" id="panel-artwork">

    <div class="assignment-buttons" id="assignmentButtons"></div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="albumInput" accept="image/*" style="display:none;">

    <div class="toolbar">
      <span class="count" id="artCount">0 位學生</span>
    </div>
    <div class="art-list" id="artRoster"></div>
  </section>

  <section class="panel" id="panel-students">
    <div class="toolbar">
      <span class="count" id="studentsCount">30 位學生</span>
    </div>
    <div class="student-grid" id="studentGrid"></div>
  </section>

  <section class="panel" id="panel-schedule">
    <div class="schedule-note">各班美術課上課時段</div>
    <div class="schedule-table-wrap">
      <table class="schedule-table" id="scheduleTable"></table>
    </div>
  </section>

  <section class="panel" id="panel-stats">
    <div class="print-only" id="statsPrintHeader"></div>
    <div class="stats-toolbar">
      <input type="text" id="statsSearch" class="stats-search no-print" placeholder="搜尋座號或姓名">
      <span class="count" id="statsCount">0 位學生</span>
      <div class="stats-actions no-print">
        <button type="button" class="sort-btn" id="statsExportBtn">匯出CSV</button>
        <button type="button" class="sort-btn" id="statsPrintBtn">列印</button>
      </div>
    </div>
    <div class="stats-table-wrap">
      <table class="stats-table" id="statsTable"></table>
    </div>
  </section>

  <div class="footer-note">
    出席、秩序評分、作業成績都會即時存到資料庫，拍照評分完成後也會立即建檔。
  </div>
</div>

<script>
/* ---------- App state ---------- */
let currentClassId = null;
let currentClasses = [];   // classes list from the latest /api/schedule response
let weeklySchedule = [];   // { classId, className, weekday, start, end, label }[] from the latest /api/schedule response
let attendance = {};   // { studentId: 'late' | 'absent' }
let behavior = {};     // { studentId: { plus, minus } } for the selected date only
let lateTotals = {};   // { studentId: { late, absent } } cumulative counts since records began
let selectedDate = "";  // "YYYY-MM-DD", defaults to today, changeable via the date picker
let rosterSortMode = "seat"; // "seat" | "scoreDesc" | "scoreAsc"
let rosterCache = [];

let statsBehaviorTotals = {}; // { studentId: { plus, minus } } cumulative since records began
let statsAssignments = [];    // [{ id, name }] assignments for the current class
let statsScores = {};         // { studentId: { assignmentId: score } }
let statsPhotos = {};         // { studentId: { assignmentId: photoKey } }
let statsSearchTerm = "";

let audioCtx = null;
function playBeep(freq, volume){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    osc.start(now);
    osc.stop(now + 0.13);
  }catch(e){}
}

/* ---------- 115學年度第一學期 行事曆(共21週，一律以週一~週五間的紅字為停課依據) ---------- */
const SEMESTER_START = Date.UTC(2026, 7, 31); // 8/31(一) 始業式
const SEMESTER_WEEKS = 21;
const SEMESTER_HOLIDAYS = [
  { date: "2026-09-25", label: "中秋節放假" },
  { date: "2026-09-28", label: "教師節放假" },
  { date: "2026-10-09", label: "國慶日補假" },
  { date: "2026-10-26", label: "光復節補假" },
  { date: "2026-12-21", label: "校慶運動會補假" },
  { date: "2026-12-25", label: "行憲紀念日放假" },
  { date: "2027-01-01", label: "元旦放假" }
];
const SEMESTER_EXAMS = [
  { start: "2026-11-05", end: "2026-11-06", label: "期中評量" },
  { start: "2027-01-14", end: "2027-01-15", label: "期末評量" }
];

function semesterWeekOf(ymd){
  const [y, m, d] = ymd.split("-").map(Number);
  const diffDays = Math.round((Date.UTC(y, m-1, d) - SEMESTER_START) / 86400000);
  if(diffDays < 0) return null;
  const week = Math.floor(diffDays / 7) + 1;
  return week <= SEMESTER_WEEKS ? week : null;
}
function holidayOn(ymd){
  return SEMESTER_HOLIDAYS.find(h => h.date === ymd) || null;
}
function examOn(ymd){
  return SEMESTER_EXAMS.find(e => ymd >= e.start && ymd <= e.end) || null;
}

function weekdayLabel(ymd){
  const [y, m, d] = ymd.split("-").map(Number);
  const wd = new Date(Date.UTC(y, m-1, d)).getUTCDay();
  return "日一二三四五六"[wd];
}

function renderNowDate(){
  const now = new Date();
  const ymd = todayStr();
  document.getElementById("nowDate").textContent =
    `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}(星期${weekdayLabel(ymd)}) ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const week = semesterWeekOf(ymd);
  let weekText = "";
  if(week){
    weekText = `第${week}週`;
  }else{
    const [y, m, d] = ymd.split("-").map(Number);
    const diffDays = Math.round((Date.UTC(y, m-1, d) - SEMESTER_START) / 86400000);
    if(diffDays < 0) weekText = `開學倒數${-diffDays}天`;
    else weekText = "本學期已結束";
  }
  document.getElementById("weekBadge").textContent = weekText;

  const holiday = holidayOn(ymd);
  const exam = examOn(ymd);
  let html = "";
  if(holiday) html += `<span class="holiday-badge">🔴 ${holiday.label}，今天不用上課</span>`;
  if(exam) html += `<span class="exam-badge">📝 今天${exam.label}</span>`;
  document.getElementById("todayNote").innerHTML = html;
}

const PERIODS = [
  { num: "1", start: "08:40", end: "09:20" },
  { num: "2", start: "09:30", end: "10:10" },
  { num: "3", start: "10:30", end: "11:10" },

  { num: "6", start: "14:20", end: "15:00" },
  { num: "7", start: "15:15", end: "15:55" }
];
const SCHEDULE_WEEKDAYS = [5, 4, 3, 2, 1]; // 顯示順序比照課表：五四三二一，由左到右
const SCHEDULE_WEEKDAY_LABELS = { 1:"一", 2:"二", 3:"三", 4:"四", 5:"五" };

function shortClassName(name){
  return (name || "").replace(/年|班/g, "");
}

function renderWeeklySchedule(){
  const root = document.getElementById("scheduleTable");
  if(!root) return;
  const todayWeekday = new Date().getDay();

  const blocksByWeekday = {};
  SCHEDULE_WEEKDAYS.forEach(wd => {
    blocksByWeekday[wd] = weeklySchedule
      .filter(s => s.weekday === wd)
      .map(e => {
        const coveredIdx = PERIODS
          .map((p, i) => (p.start && p.start >= e.start && p.end <= e.end) ? i : -1)
          .filter(i => i >= 0);
        if(!coveredIdx.length) return null;
        return {
          idxSet: new Set(coveredIdx),
          className: shortClassName(e.className) || e.classId,
          teacher: HOMEROOM_TEACHERS[e.className] || ""
        };
      })
      .filter(Boolean);
  });

  const headHtml = `<tr>${
    SCHEDULE_WEEKDAYS.map(wd => `<th class="${wd === todayWeekday ? "today-col" : ""}">${SCHEDULE_WEEKDAY_LABELS[wd]}</th>`).join("")
  }<th class="period-col-head"></th></tr>`;

  let bodyHtml = "";
  PERIODS.forEach((p, pi) => {
    const pmDivider = p.num === "5" ? "pm-divider" : "";
    let rowHtml = "<tr>";
    SCHEDULE_WEEKDAYS.forEach(wd => {
      const cellCls = [wd === todayWeekday ? "today-col" : "", pmDivider].filter(Boolean).join(" ");
      const block = blocksByWeekday[wd].find(b => b.idxSet.has(pi));
      rowHtml += block
        ? `<td class="${cellCls}"><span class="schedule-cell">${block.className}${block.teacher ? `<span class="schedule-teacher">${block.teacher}</span>` : ""}</span></td>`
        : `<td class="${cellCls}"></td>`;
    });
    rowHtml += `<td class="period-label ${pmDivider}">${p.num}${p.start ? `<br>${p.start}<br>${p.end}` : ""}</td>`;
    rowHtml += "</tr>";
    bodyHtml += rowHtml;
  });

  root.innerHTML = `<thead>${headHtml}</thead><tbody>${bodyHtml}</tbody>`;
}

/* ---------- Attendance + behavior (combined roster) ---------- */
function renderRoster(){
  const list = [...studentsFor(currentClassId)];
  const netScoreFor = (id) => {
    const b = behavior[id];
    return b ? (b.plus || 0) - (b.minus || 0) : 0;
  };
  if(rosterSortMode === "scoreDesc"){
    list.sort((a,b) => netScoreFor(b.id) - netScoreFor(a.id) || a.seat - b.seat);
  }else if(rosterSortMode === "scoreAsc"){
    list.sort((a,b) => netScoreFor(a.id) - netScoreFor(b.id) || a.seat - b.seat);
  }

  document.getElementById("scoreDescSortBtn").classList.toggle("active", rosterSortMode === "scoreDesc");
  document.getElementById("scoreAscSortBtn").classList.toggle("active", rosterSortMode === "scoreAsc");
  document.getElementById("seatSortBtn").classList.toggle("active", rosterSortMode === "seat");

  document.getElementById("attCount").textContent = list.length + " 位學生";
  const late = Object.values(attendance).filter(v => v === "late").length;
  const absent = Object.values(attendance).filter(v => v === "absent").length;
  document.getElementById("lateCount").textContent = late;
  document.getElementById("absentCount").textContent = absent;

  const root = document.getElementById("attRoster");
  root.innerHTML = list.map(st => {
    const state = attendance[st.id];
    const behToday = behavior[st.id] || { plus: 0, minus: 0 };
    const avatarInner = st.photoKey ? `<img src="/api/photo/${st.photoKey}">` : "🧑";
    return `
      <div class="student-row">
        <div class="student-row-top">
          <div class="avatar" data-student="${st.id}" title="點一下拍/換大頭照">${avatarInner}</div>
          <div class="seat">${st.seat}</div>
          <div class="s-name">${st.name}</div>
        </div>
        <div class="student-row-controls">
          <div class="att-controls">
            <button class="att-btn late ${state==='late'?'on':''}" data-id="${st.id}" data-state="late">遲到</button>
            <button class="att-btn absent ${state==='absent'?'on':''}" data-id="${st.id}" data-state="absent">缺席</button>
          </div>
          <div class="late-total">累計遲到 ${(lateTotals[st.id] && lateTotals[st.id].late) || 0} 次</div>
          <div class="beh-controls">
            <button class="beh-btn beh-minus" data-id="${st.id}" data-delta="-1">－ ${behToday.minus}</button>
            <button class="beh-undo-btn" data-id="${st.id}" title="復原今天最後一次加/扣分">↺</button>
            <button class="beh-btn beh-plus" data-id="${st.id}" data-delta="1">＋ ${behToday.plus}</button>
          </div>
        </div>
      </div>`;
  }).join("");

  root.querySelectorAll(".avatar").forEach(el => {
    el.addEventListener("click", () => openStudentPhoto(el.dataset.student));
  });

  root.querySelectorAll(".att-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id, state = btn.dataset.state;
      const turningOn = attendance[id] !== state;
      attendance[id] = turningOn ? state : undefined;
      if(attendance[id] === undefined) delete attendance[id];
      renderRoster();
      const st = studentsFor(currentClassId).find(s => s.id === id);
      if(!st) return;
      if(turningOn){
        apiPost("/api/attendance", { classId: currentClassId, date: selectedDate, action: "setStatus", seats: [st.seat], status: state })
          .then(() => loadLateTotals())
          .catch(()=>{});
      }else{
        apiPost("/api/attendance", { classId: currentClassId, date: selectedDate, action: "clear", seats: [st.seat] })
          .then(() => loadLateTotals())
          .catch(()=>{});
      }
    });
  });

  root.querySelectorAll(".beh-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id, delta = parseInt(btn.dataset.delta, 10);
      if(!behavior[id]) behavior[id] = { plus: 0, minus: 0 };
      if(delta > 0) behavior[id].plus += delta;
      else behavior[id].minus += -delta;
      if(!statsBehaviorTotals[id]) statsBehaviorTotals[id] = { plus: 0, minus: 0 };
      if(delta > 0) statsBehaviorTotals[id].plus += delta;
      else statsBehaviorTotals[id].minus += -delta;
      playBeep(delta > 0 ? 880 : 330, 0.05);
      renderRoster();
      apiPost("/api/behavior", { studentId: id, date: selectedDate, delta })
        .then(() => loadStatsData())
        .catch(()=>{});
    });
  });

  root.querySelectorAll(".beh-undo-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      try{
        const res = await apiPost("/api/behavior/undo", { studentId: id, date: selectedDate });
        const delta = res.delta;
        if(behavior[id]){
          if(delta > 0) behavior[id].plus = Math.max(0, behavior[id].plus - delta);
          else behavior[id].minus = Math.max(0, behavior[id].minus - (-delta));
        }
        if(statsBehaviorTotals[id]){
          if(delta > 0) statsBehaviorTotals[id].plus = Math.max(0, statsBehaviorTotals[id].plus - delta);
          else statsBehaviorTotals[id].minus = Math.max(0, statsBehaviorTotals[id].minus - (-delta));
        }
        renderRoster();
        renderStatsTable();
      }catch(err){
        alert("今天沒有可復原的加/扣分紀錄");
      }
    });
  });
}

/* ---------- Stats table (統計表) ---------- */
async function loadStatsData(){
  statsBehaviorTotals = {};
  statsAssignments = [];
  statsScores = {};
  statsPhotos = {};
  if(currentClassId){
    try{
      statsBehaviorTotals = await apiGet(`/api/behavior/summary?classId=${encodeURIComponent(currentClassId)}`);
    }catch(e){}
    try{
      const res = await apiGet(`/api/assignments/scores?classId=${encodeURIComponent(currentClassId)}`);
      statsAssignments = res.assignments || [];
      statsScores = res.scores || {};
      statsPhotos = res.photos || {};
    }catch(e){}
  }
  renderStatsTable();
}

function statsBehaviorFor(studentId){
  return statsBehaviorTotals[studentId] || { plus: 0, minus: 0 };
}
function statsLateFor(studentId){
  return (lateTotals[studentId] && lateTotals[studentId].late) || 0;
}
function statsAbsentFor(studentId){
  return (lateTotals[studentId] && lateTotals[studentId].absent) || 0;
}

function statsValueFor(st, key){
  if(key === "seat") return st.seat;
  if(key === "name") return st.name;
  if(key === "plus") return statsBehaviorFor(st.id).plus;
  if(key === "minus") return statsBehaviorFor(st.id).minus;
  if(key === "late") return statsLateFor(st.id);
  if(key === "absent") return statsAbsentFor(st.id);
  const score = statsScores[st.id] && statsScores[st.id][key];
  return score != null ? score : -1;
}

function getStatsList(){
  const term = statsSearchTerm.trim();
  const list = rosterCache.filter(st => !term || String(st.seat).includes(term) || st.name.includes(term));
  list.sort((a, b) => {
    const va = statsValueFor(a, statsSortKey), vb = statsValueFor(b, statsSortKey);
    const cmp = typeof va === "string" ? va.localeCompare(vb, "zh-Hant") : va - vb;
    return statsSortAsc ? cmp : -cmp;
  });
  return list;
}

const STATS_FIXED_COLUMNS = [
  { key: "seat", label: "座號" },
  { key: "name", label: "姓名" },
  { key: "plus", label: "加分", sub: "累計" },
  { key: "minus", label: "扣分", sub: "累計" },
  { key: "late", label: "遲到", sub: "累計" },
  { key: "absent", label: "缺席", sub: "累計" }
];

function renderStatsTable(){
  const root = document.getElementById("statsTable");
  if(!root) return;

  const list = getStatsList();
  document.getElementById("statsCount").textContent = list.length + " 位學生";

  const clsName = (currentClasses.find(c => c.id === currentClassId) || {}).name || currentClassId || "";
  document.getElementById("statsPrintHeader").textContent = clsName ? `統計表・${clsName}・${todayStr()}` : `統計表・${todayStr()}`;

  const sortArrow = (key) => statsSortKey === key ? (statsSortAsc ? " ▲" : " ▼") : "";

  const fixedHeadHtml = STATS_FIXED_COLUMNS.map(c => {
    const isSorted = statsSortKey === c.key;
    const labelHtml = c.sub ? `${c.label}<span class="col-sub">${c.sub}</span>` : c.label;
    return `<th data-key="${c.key}" class="${isSorted ? "sorted" : ""}">${labelHtml}${sortArrow(c.key)}</th>`;
  }).join("");

  const assignmentHeadHtml = statsAssignments.map(a => {
    const isSorted = statsSortKey === a.id;
    return `<th data-key="${a.id}" class="assignment-col ${isSorted ? "sorted" : ""}">
      <span class="stats-assignment-head">
        <span>${a.name}${sortArrow(a.id)}</span>
        <button type="button" class="stats-rename-btn no-print" data-rename="${a.id}" title="改名(所有班級同步)">✎</button>
        <button type="button" class="stats-rename-btn no-print" data-delete="${a.id}" title="刪除此作業(所有班級同步)">🗑</button>
      </span>
    </th>`;
  }).join("");

  const addColHtml = `<th class="stats-add-col no-print"><button type="button" id="statsAddAssignmentBtn" class="stats-add-btn" title="新增作業欄位(所有班級同步)">＋</button></th>`;

  const bodyHtml = list.map(st => {
    const beh = statsBehaviorFor(st.id);
    const assignmentCells = statsAssignments.map(a => {
      const score = statsScores[st.id] && statsScores[st.id][a.id];
      const photoKey = statsPhotos[st.id] && statsPhotos[st.id][a.id];
      return `<td>
        <div class="stats-score-cell">
          <input type="number" class="stats-score-input" data-student="${st.id}" data-assignment="${a.id}" value="${score != null ? score : ""}">
          <button type="button" class="stats-photo-btn no-print${photoKey ? "" : " empty"}" data-photo="${photoKey || ""}" data-student="${st.id}" title="${photoKey ? "查看作品照片" : "尚無照片"}">📷</button>
        </div>
      </td>`;
    }).join("");
    return `<tr>
      <td class="stats-seat">${st.seat}</td>
      <td class="stats-name">${st.name}</td>
      <td class="stats-plus">${beh.plus}</td>
      <td class="stats-minus">${beh.minus}</td>
      <td class="stats-clickable" data-detail-student="${st.id}" data-detail-status="late" title="點擊查看遲到日期">${statsLateFor(st.id)}</td>
      <td class="stats-clickable" data-detail-student="${st.id}" data-detail-status="absent" title="點擊查看缺席日期">${statsAbsentFor(st.id)}</td>
      ${assignmentCells}
      <td class="no-print"></td>
    </tr>`;
  }).join("");

  const sum = (fn) => list.reduce((acc, st) => acc + fn(st), 0);
  const avgFor = (assignmentId) => {
    const scores = list
      .map(st => statsScores[st.id] && statsScores[st.id][assignmentId])
      .filter(v => v != null);
    if(!scores.length) return "-";
    return Math.round(scores.reduce((s, v) => s + v, 0) / scores.length);
  };
  const avgCells = statsAssignments.map(a => `<td data-avg-for="${a.id}">${avgFor(a.id)}</td>`).join("");

  const footHtml = `<tr>
    <td colspan="2">全班合計/平均</td>
    <td>${sum(st => statsBehaviorFor(st.id).plus)}</td>
    <td>${sum(st => statsBehaviorFor(st.id).minus)}</td>
    <td>${sum(st => statsLateFor(st.id))}</td>
    <td>${sum(st => statsAbsentFor(st.id))}</td>
    ${avgCells}
    <td class="no-print"></td>
  </tr>`;

  root.innerHTML = `<thead><tr>${fixedHeadHtml}${assignmentHeadHtml}${addColHtml}</tr></thead><tbody>${bodyHtml}</tbody><tfoot>${footHtml}</tfoot>`;

  root.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if(statsSortKey === key) statsSortAsc = !statsSortAsc;
      else { statsSortKey = key; statsSortAsc = true; }
      renderStatsTable();
    });
  });

  root.querySelectorAll(".stats-rename-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const assignmentId = btn.dataset.rename;
      const current = statsAssignments.find(a => a.id === assignmentId);
      if(!current) return;
      const newName = prompt("修改作業名稱(所有班級會一起更新)", current.name);
      if(!newName || newName === current.name) return;
      current.name = newName;
      renderStatsTable();
      apiPost("/api/assignments/rename", { id: assignmentId, name: newName }).catch(()=>{});
    });
  });

  root.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const assignmentId = btn.dataset.delete;
      const current = statsAssignments.find(a => a.id === assignmentId);
      if(!current) return;
      if(!confirm(`確定要刪除作業「${current.name}」嗎?(所有班級的這個作業與已評分紀錄都會一起刪除,無法復原)`)) return;
      try{
        await apiDelete("/api/assignments", { id: assignmentId });
      }catch(err){}
      await loadStatsData();
      await loadAssignments();
      await loadSubmissionsForCurrentAssignment();
    });
  });

  root.querySelectorAll(".stats-score-input").forEach(inp => {
    inp.addEventListener("change", (e) => {
      e.stopPropagation();
      const studentId = inp.dataset.student, assignmentId = inp.dataset.assignment;
      if(inp.value === "") return;
      const val = parseInt(inp.value, 10);
      if(Number.isNaN(val)) return;
      if(!statsScores[studentId]) statsScores[studentId] = {};
      statsScores[studentId][assignmentId] = val;
      apiPost("/api/submissions/score", { assignmentId, studentId, score: val }).catch(()=>{});
      const avgCell = root.querySelector(`[data-avg-for="${assignmentId}"]`);
      if(avgCell) avgCell.textContent = avgFor(assignmentId);
    });
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("keydown", (e) => {
      if(e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      e.preventDefault();
      const idx = list.findIndex(st => st.id === inp.dataset.student);
      const nextStudent = list[e.key === "ArrowDown" ? idx + 1 : idx - 1];
      if(!nextStudent) return;
      const nextInput = root.querySelector(`.stats-score-input[data-student="${nextStudent.id}"][data-assignment="${inp.dataset.assignment}"]`);
      if(nextInput){ nextInput.focus(); nextInput.select(); }
    });
  });

  root.querySelectorAll(".stats-photo-btn:not(.empty)").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const st = rosterCache.find(s => s.id === btn.dataset.student);
      openArtworkPhoto(`/api/photo/${btn.dataset.photo}`, st ? `${st.seat} 號・${st.name}` : "");
    });
  });

  const addBtn = root.querySelector("#statsAddAssignmentBtn");
  if(addBtn){
    addBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if(!currentClassId){ alert("請先選擇班級"); return; }
      const name = prompt("新作業/欄位的名稱?(所有班級會一起新增)", "作業" + (statsAssignments.length + 1));
      if(!name) return;
      try{
        await apiPost("/api/assignments", { classId: currentClassId, name });
      }catch(err){}
      await loadStatsData();
      await loadAssignments();
      await loadSubmissionsForCurrentAssignment();
    });
  }

  root.querySelectorAll(".stats-clickable").forEach(td => {
    td.addEventListener("click", (e) => {
      e.stopPropagation();
      openAttendanceDetail(td.dataset.detailStudent, td.dataset.detailStatus);
    });
  });
}

async function openAttendanceDetail(studentId, status){
  const st = rosterCache.find(s => s.id === studentId);
  if(!st) return;
  const statusLabel = status === "absent" ? "缺席" : "遲到";

  const existing = document.getElementById("attendDetailModal");
  if(existing) existing.remove();

  const modal = document.createElement("div");
  modal.id = "attendDetailModal";
  modal.className = "photo-modal";
  modal.innerHTML = `
    <div class="photo-modal-box">
      <div class="photo-modal-name">${st.seat} 號・${st.name}・${statusLabel}紀錄</div>
      <div id="attendDetailList" class="attend-detail-list">載入中...</div>
      <div class="photo-modal-actions">
        <button class="photo-modal-close" id="attendDetailCloseBtn">關閉</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener("click", (e) => { if(e.target === modal) modal.remove(); });
  document.getElementById("attendDetailCloseBtn").addEventListener("click", () => modal.remove());

  try{
    const dates = await apiGet(`/api/attendance/detail?studentId=${encodeURIComponent(studentId)}&status=${status}`);
    const listEl = document.getElementById("attendDetailList");
    if(!listEl) return;
    listEl.innerHTML = dates.length
      ? dates.map(d => `<div class="attend-detail-item">${d}(星期${weekdayLabel(d)})</div>`).join("")
      : `<div class="attend-detail-item">目前沒有${statusLabel}紀錄</div>`;
  }catch(err){
    const listEl = document.getElementById("attendDetailList");
    if(listEl) listEl.textContent = "載入失敗,請稍後再試";
  }
}

function exportStatsCsv(){
  const list = getStatsList();
  const header = ["座號", "姓名", "加分累計", "扣分累計", "遲到累計", "缺席累計", ...statsAssignments.map(a => a.name)];
  const rows = [header];
  list.forEach(st => {
    const beh = statsBehaviorFor(st.id);
    const row = [st.seat, st.name, beh.plus, beh.minus, statsLateFor(st.id), statsAbsentFor(st.id)];
    statsAssignments.forEach(a => {
      const score = statsScores[st.id] && statsScores[st.id][a.id];
      row.push(score != null ? score : "");
    });
    rows.push(row);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob([String.fromCharCode(0xFEFF) + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const clsName = (currentClasses.find(c => c.id === currentClassId) || {}).name || currentClassId || "班級";
  const a = document.createElement("a");
  a.href = url;
  a.download = `統計表_${clsName}_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

let pendingTier = null;

const ARTWORK_PHOTO_TAG = "作品";
const TIER_CLASS = { "特優": "superb", "優等": "great", "甲等": "good" };

let camTargetSeat = null;

function loadImageFromBlob(blob){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}

async function normalizeToJpeg(blobOrFile){
  const img = await loadImageFromBlob(blobOrFile);
  const maxDim = 2000;
  let { width, height } = img;
  if(width > maxDim || height > maxDim){
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  canvas.getContext("2d").drawImage(img, 0, 0, width, height);
  return await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.85));
}

let camAvatarStudentId = null;

function openAvatarCamera(studentId){
  startPhotoCapture("大頭照", { studentId });
}

async function uploadAvatar(studentId, blob){
  try{
    const res = await fetch(`/api/students/photo?studentId=${encodeURIComponent(studentId)}`, {
      method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob
    });
    if(!res.ok) throw new Error("upload failed: " + res.status);
    const data = await res.json();
    const st = rosterCache.find(s => s.id === studentId);
    if(st) st.photoKey = data.key;
    renderRoster();
    renderStudentsGrid();
  }catch(e){
    alert("照片上傳失敗,請檢查網路連線後再試一次。");
  }
}

// Hands photo capture off to the phone's native camera app via <input capture>,
// instead of building an in-page camera with getUserMedia — sidesteps per-site
// camera permission/hardware-lock issues that getUserMedia is prone to.
function startPhotoCapture(tier, opts){
  opts = opts || {};
  camTargetSeat = opts.seat || null;
  camAvatarStudentId = opts.studentId || null;
  pendingTier = tier;
  const input = document.getElementById("cameraInput");
  input.value = ""; // so picking the same shot twice in a row still fires "change"
  input.click();
}

// Artwork photos use an input with no "capture" attribute, so the OS shows its own
// action sheet offering both "take photo" and "photo library" in one tap target
// (unlike startPhotoCapture, which forces the camera app directly for avatar shots).
function startArtworkPhoto(opts){
  opts = opts || {};
  camTargetSeat = opts.seat || null;
  camAvatarStudentId = null;
  pendingTier = ARTWORK_PHOTO_TAG;
  const input = document.getElementById("albumInput");
  input.value = "";
  input.click();
}

async function handlePickedFiles(files){
  files = Array.from(files || []);
  if(!files.length) return;
  const avatarStudentId = camAvatarStudentId;
  const seat = camTargetSeat;
  camAvatarStudentId = null;
  camTargetSeat = null;
  const file = files[0];

  let jpegBlob;
  try{
    jpegBlob = await normalizeToJpeg(file);
  }catch(err){
    alert("這張照片讀取失敗，請確認選擇的是JPG或PNG格式的照片。若是用iPhone選相簿照片,可到「設定→相機→格式」改成「最相容」後再試一次。");
    return;
  }

  if(avatarStudentId){
    await uploadAvatar(avatarStudentId, jpegBlob);
    return;
  }

  let photoKey;
  try{
    const res = await fetch(`/api/photo?ext=jpg&tier=${encodeURIComponent(pendingTier)}`, {
      method: "POST", headers: { "Content-Type": "image/jpeg" }, body: jpegBlob
    });
    if(!res.ok) throw new Error("upload failed: " + res.status);
    const data = await res.json();
    photoKey = data.key;
  }catch(err){
    alert("照片上傳失敗,請檢查網路連線後再試一次。");
    return;
  }

  openAssignForm({ dataUrl: URL.createObjectURL(jpegBlob), photoKey }, seat);
}

document.getElementById("cameraInput").addEventListener("change", (e) => handlePickedFiles(e.target.files));
document.getElementById("albumInput").addEventListener("change", (e) => handlePickedFiles(e.target.files));

function openAssignForm(entry, presetSeat){
  const existingForm = document.getElementById("assignFormWrap");
  if(existingForm) existingForm.remove();

  const wrap = document.createElement("div");
  wrap.id = "assignFormWrap";
  wrap.className = "assign-form";
  wrap.innerHTML = `
    <img src="${entry.dataUrl}">
    <div class="assign-row">
      <label>座號</label>
      <input type="number" id="assignSeat" min="1" max="${rosterCache.length}" placeholder="輸入座號" value="${presetSeat || ''}">
    </div>
    <div class="assign-row">
      <label>備註</label>
      <input type="text" id="assignNote" placeholder="選填">
    </div>
    <div class="assign-actions">
      <button class="assign-cancel" id="assignCancelBtn">取消</button>
      <button class="assign-confirm" id="assignConfirmBtn">確認建檔</button>
    </div>
  `;
  document.getElementById("artRoster").before(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "center" });
  if(!presetSeat) document.getElementById("assignSeat").focus();

  document.getElementById("assignCancelBtn").addEventListener("click", () => wrap.remove());

  document.getElementById("assignConfirmBtn").addEventListener("click", async () => {
    const seat = parseInt(document.getElementById("assignSeat").value, 10);
    const st = rosterCache.find(s => s.seat === seat);
    if(!st){ alert("查無座號 " + seat); return; }
    const note = document.getElementById("assignNote").value;

    if(!submissions[currentAssignmentId]) submissions[currentAssignmentId] = {};
    const existing = submissions[currentAssignmentId][st.id];
    if(existing && (existing.photoKey || existing.dataUrl) && !confirm(`${st.name}(座號${st.seat})這項作品已經建檔過,要覆蓋嗎?`)){
      return;
    }
    const score = existing && existing.score != null ? existing.score : 0;
    submissions[currentAssignmentId][st.id] = { tier: "", score, note, dataUrl: entry.dataUrl, photoKey: entry.photoKey };
    wrap.remove();
    renderArtRoster();

    apiPost("/api/submissions", {
      assignmentId: currentAssignmentId,
      classId: currentClassId,
      seat,
      tier: "", score, note,
      photoKey: entry.photoKey
    }).catch(()=>{});
  });
}

function renderArtRoster(){
  const data = submissions[currentAssignmentId] || {};
  const root = document.getElementById("artRoster");
  if(!root) return;
  document.getElementById("artCount").textContent = rosterCache.length + " 位學生";

  const list = [...rosterCache].sort((a,b) => a.seat - b.seat);
  root.innerHTML = list.map(st => {
    const e = data[st.id];
    const hasPhoto = !!(e && (e.photoKey || e.dataUrl));
    const imgSrc = hasPhoto ? (e.photoKey ? `/api/photo/${e.photoKey}` : e.dataUrl) : "";
    const photoInner = imgSrc
      ? `<img src="${imgSrc}" class="art-row-photo" data-student="${st.id}">`
      : `<div class="art-row-noPhoto">🧑</div>`;
    const tierBadge = e && e.tier ? `<span class="art-tier-badge ${TIER_CLASS[e.tier] || ""}">${e.tier}</span>` : "";
    const statusHtml = tierBadge + (e && e.note ? e.note : (hasPhoto ? "已建檔" : (e ? "尚未拍照" : "尚未建檔")));
    return `
      <div class="art-row" data-student="${st.id}">
        ${photoInner}
        <div class="art-row-main">
          <div class="art-row-name">
            ${st.seat} 號・${st.name}
            <input type="number" class="art-score-input" data-student="${st.id}" value="${e && e.score ? e.score : ""}" placeholder="分數">
          </div>
          <div class="art-row-meta">${statusHtml}</div>
        </div>
        <button class="art-row-capture" data-seat="${st.seat}">${hasPhoto ? "🔄 重拍" : "📷 拍照"}</button>
        ${e ? `<button class="art-row-remove" data-student="${st.id}" title="刪除">✕</button>` : ""}
      </div>`;
  }).join("");

  root.querySelectorAll(".art-row-photo").forEach(img => {
    img.addEventListener("click", () => {
      const st = rosterCache.find(s => s.id === img.dataset.student);
      openArtworkPhoto(img.src, st ? `${st.seat} 號・${st.name}` : "");
    });
  });
  root.querySelectorAll(".art-row-capture").forEach(btn => {
    btn.addEventListener("click", () => {
      startArtworkPhoto({ seat: parseInt(btn.dataset.seat, 10) });
    });
  });
  root.querySelectorAll(".art-score-input").forEach(inp => {
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", (e) => {
      const sid = inp.dataset.student;
      if(inp.value === "") return;
      const score = parseInt(inp.value, 10);
      if(Number.isNaN(score)) return;
      if(!submissions[currentAssignmentId]) submissions[currentAssignmentId] = {};
      if(!submissions[currentAssignmentId][sid]){
        submissions[currentAssignmentId][sid] = { tier: "", score, note: "", photoKey: null };
      }else{
        submissions[currentAssignmentId][sid].score = score;
      }
      apiPost("/api/submissions/score", { assignmentId: currentAssignmentId, studentId: sid, score }).catch(()=>{});
      renderArtRoster();
    });
  });
  root.querySelectorAll(".art-row-remove").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const sid = e.target.dataset.student;
      const st = rosterCache.find(s => s.id === sid);
      if(confirm(`刪除 ${st.name} 這項作品的建檔紀錄?`)){
        delete submissions[currentAssignmentId][sid];
        renderArtRoster();
        apiDelete("/api/submissions", { assignmentId: currentAssignmentId, studentId: sid }).catch(()=>{});
      }
    });
  });
}

async function loadSubmissionsForCurrentAssignment(){
  if(!currentAssignmentId){ renderArtRoster(); return; }
  try{
    const list = await apiGet(`/api/submissions?assignmentId=${encodeURIComponent(currentAssignmentId)}`);
    const map = {};
    list.forEach(r => {
      map[r.studentId] = { tier: r.tier, score: r.score, note: r.note, photoKey: r.photoKey };
    });
    submissions[currentAssignmentId] = map;
  }catch(e){
    if(!submissions[currentAssignmentId]) submissions[currentAssignmentId] = {};
  }
  renderArtRoster();
}

async function loadRoster(){
  rosterCache = await loadRosterFromApi(currentClassId);

  selectedDate = todayStr();
  const dateInput = document.getElementById("dateInput");
  dateInput.max = selectedDate;
  dateInput.value = selectedDate;
  await loadAttendanceAndBehaviorForDate();
  await loadLateTotals();
  await loadStatsData();

  renderStudentsGrid();
  await loadAssignments();
  await loadSubmissionsForCurrentAssignment();
}
